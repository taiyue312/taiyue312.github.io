<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>脑科学与疾病 · 小测刷题</title>
  <style>
    :root { --ink:#18201d; --muted:#64706b; --paper:#f7f8f5; --panel:#fff; --line:#d9ded9; --green:#176b52; --green-soft:#e6f1ec; --amber:#b56019; --red:#b13b35; --red-soft:#f9e9e7; --blue:#2f5f91; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:0; }
    button,select { font:inherit; }
    button { cursor:pointer; }
    .app { min-height:100vh; display:grid; grid-template-columns:260px minmax(0,1fr); }
    aside { position:sticky; top:0; height:100vh; border-right:1px solid var(--line); background:#edf1ed; padding:24px 18px; overflow:auto; }
    .brand { font-size:19px; font-weight:800; margin-bottom:4px; }
    .semester { color:var(--muted); font-size:13px; margin-bottom:24px; }
    .side-label { color:var(--muted); font-size:12px; font-weight:700; margin:20px 8px 8px; }
    .chapter-list { display:grid; gap:4px; }
    .chapter-btn { width:100%; border:0; background:transparent; padding:9px 10px; text-align:left; border-radius:6px; color:#34413c; line-height:1.35; }
    .chapter-btn:hover,.chapter-btn.active { background:#fff; color:var(--green); }
    .side-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .side-actions button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:8px; }
    main { min-width:0; }
    header { min-height:78px; border-bottom:1px solid var(--line); background:rgba(247,248,245,.94); padding:16px clamp(18px,4vw,56px); display:flex; gap:18px; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; }
    .progress-wrap { flex:1; max-width:560px; }
    .progress-meta { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:7px; }
    .progress { height:7px; background:#dfe4df; border-radius:8px; overflow:hidden; }
    .progress > div { height:100%; background:var(--green); transition:width .25s; }
    .header-actions { display:flex; gap:8px; }
    .icon-btn { width:40px; height:40px; border:1px solid var(--line); background:var(--panel); border-radius:6px; font-size:19px; }
    .workspace { max-width:900px; margin:0 auto; padding:42px clamp(18px,4vw,56px) 70px; }
    .eyebrow { color:var(--green); font-size:13px; font-weight:800; margin-bottom:9px; }
    h1 { font-size:clamp(24px,4vw,34px); line-height:1.3; margin:0 0 8px; }
    .meta { color:var(--muted); font-size:14px; display:flex; flex-wrap:wrap; gap:10px 18px; margin-bottom:28px; }
    .question { font-size:20px; line-height:1.75; font-weight:650; margin-bottom:22px; }
    .options { display:grid; gap:11px; }
    .option { width:100%; min-height:56px; border:1px solid var(--line); border-radius:7px; background:var(--panel); padding:12px 15px; display:grid; grid-template-columns:32px 1fr; gap:12px; align-items:center; text-align:left; color:var(--ink); }
    .option:hover:not(:disabled) { border-color:#8aa99c; }
    .option.selected { border-color:var(--green); background:var(--green-soft); }
    .option.correct { border-color:var(--green); background:var(--green-soft); }
    .option.wrong { border-color:var(--red); background:var(--red-soft); }
    .key { width:30px; height:30px; border-radius:50%; border:1px solid #bfc8c2; display:grid; place-items:center; font-weight:800; font-size:13px; background:#fff; }
    .submit-row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:24px; }
    .hint { color:var(--muted); font-size:13px; }
    .primary,.secondary { min-height:44px; border-radius:6px; padding:0 20px; font-weight:750; }
    .primary { border:1px solid var(--green); color:#fff; background:var(--green); }
    .primary:disabled { opacity:.42; cursor:not-allowed; }
    .secondary { border:1px solid var(--line); color:var(--ink); background:#fff; }
    .result { display:none; margin-top:25px; border-left:4px solid var(--green); background:#eef3ef; padding:18px 20px; line-height:1.75; }
    .result.wrong { border-color:var(--red); background:#f8eeec; }
    .result.show { display:block; }
    .result-title { font-weight:850; margin-bottom:5px; }
    .answer-line { font-size:14px; color:#415049; margin-bottom:7px; }
    .bottom-nav { display:flex; justify-content:space-between; margin-top:30px; padding-top:20px; border-top:1px solid var(--line); }
    .empty { text-align:center; padding:100px 20px; color:var(--muted); }
    dialog { width:min(560px,calc(100% - 30px)); border:1px solid var(--line); border-radius:8px; padding:0; box-shadow:0 24px 70px #24332a33; }
    dialog::backdrop { background:#17211b66; }
    .dialog-head { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    .dialog-body { padding:22px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .stat { background:#f2f4f1; padding:15px; border-radius:6px; }
    .stat strong { display:block; font-size:23px; margin-bottom:4px; }
    .close { border:0; background:transparent; font-size:24px; }
    @media (max-width:760px) {
      .app { display:block; } aside { position:static; width:100%; height:auto; border-right:0; border-bottom:1px solid var(--line); padding:14px 16px; } .brand,.semester,.side-label,.side-actions { display:none; }
      .chapter-list { display:flex; overflow:auto; padding-bottom:2px; } .chapter-btn { width:auto; flex:0 0 auto; white-space:nowrap; border:1px solid var(--line); background:#fff; }
      header { min-height:68px; padding:12px 16px; } .workspace { padding-top:28px; } .hint { display:none; } .question { font-size:18px; } .stats { grid-template-columns:1fr; }
    }
  </style>
</head>

      <div class="header-actions"><button class="icon-btn" id="shuffle" title="随机顺序">↝</button><button class="icon-btn" id="stats" title="学习统计">▥</button></div>

<script>
const BANK=[{"id":1,"title":"第一章 神经元的特性（20260319）","questions":[{"id":0,"number":1,"section":"一、选择题","type":"多选题","prompt":"神经元的主要结构通常有_____","options":[{"key":"A","text":"树突"},{"key":"B","text":"轴突"},{"key":"C","text":"胞体"}],"answer":"ABC","explanation":"神经元由树突（接收信号）、轴突（传递信号）和胞体（含细胞核，代谢中心）三部分组成，缺一不可。"},{"id":1,"number":2,"section":"一、选择题","type":"单选题","prompt":"神经环路通常由______神经元组成。","options":[{"key":"A","text":"单个"},{"key":"B","text":"多个"}],"answer":"B","explanation":"神经环路是由多个神经元通过突触连接形成的功能性回路，用于信息的整合与传递。"},{"id":2,"number":3,"section":"一、选择题","type":"多选题","prompt":"神经系统的主要功能______","options":[{"key":"A","text":"接收信息"},{"key":"B","text":"处理和存储信息"},{"key":"C","text":"产生反应"}],"answer":"ABC","explanation":"神经系统的三大核心功能是感知（接收信息）、整合（处理和存储信息）和效应（产生反应）。"},{"id":3,"number":4,"section":"一、选择题","type":"多选题","prompt":"一个完整的动作电位包括哪些阶段：","options":[{"key":"A","text":"刺激"},{"key":"B","text":"去极化/复极化"},{"key":"C","text":"超极化"},{"key":"D","text":"静息状态"}],"answer":"ABCD","explanation":"动作电位的完整过程包括刺激引发、去极化（Na+内流）、复极化（K+外流）、超极化（K+通道延迟关闭）及恢复至静息状态。"},{"id":4,"number":5,"section":"一、选择题","type":"单选题","prompt":"参与调节情绪的神经元是以下哪种细胞？","options":[{"key":"A","text":"视锥细胞"},{"key":"B","text":"视杆细胞"},{"key":"C","text":"ipRGC"}],"answer":"C","explanation":"ipRGC（内在光敏视网膜神经节细胞）含有黑视蛋白，参与非视觉功能如昼夜节律和情绪调节，而视锥和视杆细胞主要参与视觉成像。"},{"id":5,"number":1,"section":"二、判断题","type":"判断题","prompt":"公认的现代神经生物学之父是西班牙人 Santiago Ramon Cajal。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"T","explanation":"Cajal提出了\"神经元学说\"，证明神经系统由独立的神经元组成而非网状连续结构，获1906年诺贝尔奖。"},{"id":6,"number":2,"section":"二、判断题","type":"判断题","prompt":"神经元轴突和树突的外环境对神经元之间建立特异性连接发挥了重要作用。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"T","explanation":"轴突和树突外环境中的导向分子（如Netrin、Semaphorin等）引导神经突起生长，对建立特异性突触连接至关重要。"}]},{"id":2,"title":"第二章 神经信号的传导机制（20260326）","questions":[{"id":7,"number":1,"section":"二、判断题","type":"单选题","prompt":"Which feature distinguishes chemical synapses from electrical synapses?","options":[{"key":"A","text":"Instantaneous signal transmission"},{"key":"B","text":"Presence of gap junctions"},{"key":"C","text":"Synaptic delay due to neurotransmitter release"},{"key":"D","text":"Direct ion flow between cells"}],"answer":"C","explanation":"化学突触的核心特征是神经递质释放导致的突触延迟，而电突触通过缝隙连接实现即时信号传递。"},{"id":8,"number":2,"section":"二、判断题","type":"单选题","prompt":"The influx of which ion is critical for triggering synaptic vesicle fusion at the presynaptic terminal?","options":[{"key":"A","text":"Na⁺"},{"key":"B","text":"K⁺"},{"key":"C","text":"Ca²⁺"},{"key":"D","text":"Cl⁻"}],"answer":"C","explanation":"Ca²⁺通过电压门控钙通道内流后与Synaptotagmin结合，触发突触囊泡与突触前膜的融合释放神经递质。"},{"id":9,"number":3,"section":"二、判断题","type":"单选题","prompt":"COPII-coated vesicles mediate transport from:","options":[{"key":"A","text":"Golgi to plasma membrane"},{"key":"B","text":"Endoplasmic reticulum to Golgi"},{"key":"C","text":"Golgi to lysosomes"},{"key":"D","text":"Plasma membrane to endosomes"}],"answer":"B","explanation":"COPII包被囊泡负责从内质网（ER）向高尔基体的顺行转运，是分泌途径的起始步骤。"},{"id":10,"number":4,"section":"二、判断题","type":"单选题","prompt":"The SNARE complex responsible for vesicle fusion consists of:","options":[{"key":"A","text":"Syntaxin, SNAP-25, and VAMP"},{"key":"B","text":"Synaptotagmin, Complexin, and Munc18"},{"key":"C","text":"Clathrin, COPII, and COPI"},{"key":"D","text":"NSF, α-SNAP, and Munc13"}],"answer":"A","explanation":"SNARE复合体由突触前膜上的Syntaxin和SNAP-25（t-SNARE）与囊泡膜上的VAMP/Synaptobrevin（v-SNARE）组装而成，驱动膜融合。"},{"id":11,"number":5,"section":"二、判断题","type":"单选题","prompt":"Synaptotagmin-1 acts as a calcium sensor by:","options":[{"key":"A","text":"Hydrolyzing ATP to energize vesicle fusion"},{"key":"B","text":"Binding Ca²⁺ via its C2 domains to promote membrane fusion"},{"key":"C","text":"Inhibiting spontaneous neurotransmitter release"},{"key":"D","text":"Disassembling SNARE complexes after fusion"}],"answer":"B","explanation":"Synaptotagmin-1通过其C2结构域结合Ca²⁺后插入膜中，促进SNARE介导的快速膜融合，是同步释放的关键钙感受器。"},{"id":12,"number":6,"section":"二、判断题","type":"单选题","prompt":"Complexin regulates synaptic vesicle fusion by:","options":[{"key":"A","text":"Activating spontaneous release"},{"key":"B","text":"Stabilizing the SNARE complex and suppressing spontaneous fusion"},{"key":"C","text":"Directly binding to Ca²⁺ ions to trigger fusion"},{"key":"D","text":"Disassembling SNARE complexes post-fusion"}],"answer":"B","explanation":"Complexin结合在已组装的SNARE复合体上，起\"分子夹\"作用，稳定复合体并抑制自发融合，待Ca²⁺信号到来时解除抑制。"},{"id":13,"number":7,"section":"二、判断题","type":"单选题","prompt":"Munc13 is essential for synaptic transmission because it:","options":[{"key":"A","text":"Acts as a Ca²⁺ sensor for vesicle fusion"},{"key":"B","text":"Facilitates the assembly of SNARE complexes"},{"key":"C","text":"Recycles synaptic vesicles after fusion"},{"key":"D","text":"Inhibits spontaneous neurotransmitter release"}],"answer":"B","explanation":"Munc13是囊泡启动（priming）的关键蛋白，它打开Syntaxin的封闭构象，促进SNARE复合体的组装，使囊泡进入可释放状态。"},{"id":14,"number":8,"section":"二、判断题","type":"单选题","prompt":"The depolarization of the postsynaptic membrane following ACh receptor activation is primarily due to the influx of:","options":[{"key":"A","text":"K⁺"},{"key":"B","text":"Na⁺"},{"key":"C","text":"Cl⁻"},{"key":"D","text":"Ca²⁺"}],"answer":"B","explanation":"ACh受体（烟碱型）是非选择性阳离子通道，激活后主要由Na⁺内流驱动突触后膜去极化，产生终板电位。"},{"id":15,"number":9,"section":"二、判断题","type":"单选题","prompt":"The disassembly of SNARE complexes after fusion is mediated by:","options":[{"key":"A","text":"Synaptotagmin and Complexin"},{"key":"B","text":"NSF and α-SNAP"},{"key":"C","text":"Munc18 and Munc13"},{"key":"D","text":"Clathrin and Dynamin"}],"answer":"B","explanation":"融合后的SNARE复合体由NSF（AAA+ ATPase）在α-SNAP辅助下利用ATP水解能量解聚，使SNARE蛋白循环利用。"},{"id":16,"number":10,"section":"二、判断题","type":"单选题","prompt":"At the neuromuscular junction, the high density of ACh receptors is localized to:","options":[{"key":"A","text":"Presynaptic active zones"},{"key":"B","text":"Junctional folds of the postsynaptic membrane"},{"key":"C","text":"Synaptic vesicles"},{"key":"D","text":"Myelin sheaths"}],"answer":"B","explanation":"神经肌肉接头处ACh受体高密度集中在突触后膜的结合褶皱（junctional folds）顶部，由rapsyn等蛋白锚定聚集，确保高效信号传递。"}]},{"id":3,"title":"第三章 蛋白质结构与脑科学（20260402）","questions":[{"id":17,"number":1,"section":"二、判断题","type":"单选题","prompt":"Which of the following statement is TRUE?","options":[{"key":"A","text":"Structural biology is a useful tool for studying brain science."},{"key":"B","text":"Brain science has nothing to do with structural biology."}],"answer":"A","explanation":"结构生物学通过解析离子通道、受体等蛋白质的三维结构，为理解神经信号传导的分子机制提供了关键工具。"},{"id":18,"number":2,"section":"二、判断题","type":"单选题","prompt":"Which of the following molecule can pass a biological membrane freely?","options":[{"key":"A","text":"Glucose"},{"key":"B","text":"O₂"},{"key":"C","text":"Na⁺"},{"key":"D","text":"Vitamin C"}],"answer":"B","explanation":"O₂是小分子非极性气体，可自由扩散通过脂双层；葡萄糖、Na⁺和维生素C均需转运蛋白或通道协助。"},{"id":19,"number":3,"section":"二、判断题","type":"单选题","prompt":"Which of the following is NOT a structural biology technique?","options":[{"key":"A","text":"X-ray crystallography"},{"key":"B","text":"NMR spectroscopy"},{"key":"C","text":"RT-PCR"},{"key":"D","text":"Electron cryo-microscopy (Cryo-EM)"}],"answer":"C","explanation":"RT-PCR是分子生物学中检测RNA表达的技术，不属于结构生物学方法；X射线晶体学、NMR和冷冻电镜是三大结构解析技术。"},{"id":20,"number":4,"section":"二、判断题","type":"单选题","prompt":"What is the basic functional unit of the brain?","options":[{"key":"A","text":"Neuron"},{"key":"B","text":"Dendrite"},{"key":"C","text":"Ion channel"},{"key":"D","text":"Synapse"}],"answer":"A","explanation":"神经元是大脑的基本功能单位，负责接收、整合和传递电化学信号。"},{"id":21,"number":5,"section":"二、判断题","type":"单选题","prompt":"What is the resting membrane potential for a typical neuron?","options":[{"key":"A","text":"70 mV"},{"key":"B","text":"0 mV"},{"key":"C","text":"-30 mV"},{"key":"D","text":"-70 mV"}],"answer":"D","explanation":"典型神经元的静息膜电位约为-70 mV，主要由K⁺外流通过漏钾通道维持。"},{"id":22,"number":6,"section":"二、判断题","type":"单选题","prompt":"Which ion channel contributes to the resting membrane potential the most?","options":[{"key":"A","text":"NaV channel"},{"key":"B","text":"Leak K⁺ channel"},{"key":"C","text":"Ligand-gated cation channel"},{"key":"D","text":"Kv channel"}],"answer":"B","explanation":"漏钾通道（Leak K⁺ channel）在静息状态下持续开放，允许K⁺外流，是维持静息膜电位的主要贡献者。"},{"id":23,"number":7,"section":"二、判断题","type":"单选题","prompt":"What earned Robert Lefkowitz and Brian Kobilka the Nobel Prize in Chemistry in 2012?","options":[{"key":"A","text":"K⁺ channel study"},{"key":"B","text":"Na⁺ channel study"},{"key":"C","text":"Ca²⁺ channel study"},{"key":"D","text":"GPCR study"}],"answer":"D","explanation":"Lefkowitz和Kobilka因对G蛋白偶联受体（GPCR）的结构与功能研究获2012年诺贝尔化学奖。"},{"id":24,"number":8,"section":"二、判断题","type":"单选题","prompt":"GPCR is a/an:","options":[{"key":"A","text":"Enzyme"},{"key":"B","text":"RNA"},{"key":"C","text":"Receptor"},{"key":"D","text":"Soluble protein"}],"answer":"C","explanation":"GPCR（G蛋白偶联受体）是一类跨膜受体蛋白，含七次跨膜螺旋，通过偶联G蛋白将胞外信号转导至胞内。"},{"id":25,"number":9,"section":"二、判断题","type":"单选题","prompt":"Which of the following molecule has the most significant role in the brain's reward system?","options":[{"key":"A","text":"Water"},{"key":"B","text":"Glucose"},{"key":"C","text":"Dopamine"},{"key":"D","text":"Vitamin C"}],"answer":"C","explanation":"多巴胺是大脑奖赏系统的核心神经递质，在中脑边缘通路中介导快感和动机行为。"},{"id":26,"number":10,"section":"二、判断题","type":"单选题","prompt":"Which of the following statement is TRUE?","options":[{"key":"A","text":"GPCRs have seven transmembrane helices."},{"key":"B","text":"There are very few GPCR genes in the human genome."}],"answer":"A","explanation":"GPCR的标志性结构特征是七次跨膜α-螺旋；人类基因组中有超过800个GPCR基因，是最大的受体超家族。"}]},{"id":4,"title":"第四章 出生后脑发育（20260409）","questions":[{"id":27,"number":1,"section":"二、判断题","type":"单选题","prompt":"出生后脑发育的主要事件不包括：","options":[{"key":"A","text":"神经元凋亡"},{"key":"B","text":"突触形成和修剪"},{"key":"C","text":"髓鞘化"},{"key":"D","text":"皮层神经元的新生"}],"answer":"D","explanation":"出生后脑发育以突触形成/修剪、髓鞘化和程序性神经元死亡为主，皮层神经元的大规模新生主要发生在胚胎期。"},{"id":28,"number":2,"section":"二、判断题","type":"单选题","prompt":"人神经网络的巅峰期在何时达到：","options":[{"key":"A","text":"3岁"},{"key":"B","text":"13岁"},{"key":"C","text":"30岁"},{"key":"D","text":"65岁"}],"answer":"C","explanation":"人脑神经网络经历长期的突触修剪和髓鞘化完善，约在30岁左右达到连接效率和功能的巅峰状态。"},{"id":29,"number":3,"section":"二、判断题","type":"单选题","prompt":"神经发育类疾病不包括：","options":[{"key":"A","text":"阿兹海默症"},{"key":"B","text":"多动症"},{"key":"C","text":"早产儿脱髓鞘病变"},{"key":"D","text":"自闭症"}],"answer":"A","explanation":"阿兹海默症是神经退行性疾病，不属于神经发育类疾病；多动症、早产儿脱髓鞘和自闭症均与发育异常相关。"},{"id":30,"number":4,"section":"二、判断题","type":"单选题","prompt":"Rett syndrome 是由哪个遗传变异引起的：","options":[{"key":"A","text":"NF1"},{"key":"B","text":"p53"},{"key":"C","text":"MECP2"},{"key":"D","text":"21号染色体3倍化"}],"answer":"C","explanation":"Rett综合征由X染色体上的MECP2基因突变引起，该基因编码甲基化CpG结合蛋白2，影响基因表达调控和神经发育。"},{"id":31,"number":5,"section":"二、判断题","type":"单选题","prompt":"关于 Autism 哪个说法是错误的：","options":[{"key":"A","text":"是单基因遗传变异造成"},{"key":"B","text":"表现出明显的社交障碍"},{"key":"C","text":"可能与突触修剪和维持异常有关"},{"key":"D","text":"患儿脑容量明显增大"}],"answer":"A","explanation":"自闭症是多基因遗传病，涉及数百个风险基因和环境因素的共同作用，并非单基因遗传。"},{"id":32,"number":6,"section":"二、判断题","type":"单选题","prompt":"哪位神经生物学的先驱最早提出成体神经发生是不存在的？","options":[{"key":"A","text":"Camillo Golgi"},{"key":"B","text":"Charles Darwin"},{"key":"C","text":"Santiago Ramon Cajal"},{"key":"D","text":"Thomas Hunt Morgan"}],"answer":"C","explanation":"Cajal提出成体神经系统中神经通路是固定不变的、不能再生的，这一观点长期主导了神经科学领域。"},{"id":33,"number":7,"section":"二、判断题","type":"单选题","prompt":"小鼠成体海马中神经干细胞主要局限于哪个区域？","options":[{"key":"A","text":"齿状回颗粒下层（Subgranular layer, SGL）"},{"key":"B","text":"分子层（ML, Molecular layer）"},{"key":"C","text":"侧脑室下区（Subventricular zone, SVZ）"},{"key":"D","text":"皮层（Cortex）"}],"answer":"A","explanation":"成体海马神经发生主要发生在齿状回颗粒下层（SGL），该区域的神经干细胞可持续产生新的颗粒细胞。"},{"id":34,"number":8,"section":"二、判断题","type":"单选题","prompt":"小鼠 SVZ 中产生嗅球神经元的成体神经干细胞又被称为：","options":[{"key":"A","text":"Type A 细胞"},{"key":"B","text":"Type B 细胞"},{"key":"C","text":"Type C 细胞"},{"key":"D","text":"Type E 细胞"}],"answer":"B","explanation":"SVZ中Type B细胞（GFAP+星形胶质细胞样干细胞）是神经干细胞，产生Type C（转运扩增前体），进而分化为Type A（成神经细胞）迁移至嗅球。"},{"id":35,"number":9,"section":"二、判断题","type":"单选题","prompt":"小鼠成体神经干细胞被认为直接起源于胚胎期的何种细胞？","options":[{"key":"A","text":"少突胶质细胞前体（Oligodendrocyte precursor cell）"},{"key":"B","text":"神经上皮细胞（Neural epithelial cell）"},{"key":"C","text":"星型胶质细胞（Astrocyte）"},{"key":"D","text":"放射状胶质细胞（Radial glia）"}],"answer":"D","explanation":"成体神经干细胞直接起源于胚胎期的放射状胶质细胞，后者在发育后期转变为成体SVZ和SGL中的干细胞。"},{"id":36,"number":10,"section":"二、判断题","type":"单选题","prompt":"人成体神经发生研究中的重要新生神经元/神经前体细胞标志物是以下哪个？","options":[{"key":"A","text":"Olig2"},{"key":"B","text":"DCX"},{"key":"C","text":"NeuN"},{"key":"D","text":"GFAP"}],"answer":"B","explanation":"DCX（双皮质素）是新生神经元和神经前体细胞的经典标志物，常用于标记和追踪成体神经发生中的新生细胞。"}]},{"id":5,"title":"第五章 大脑的发育 I（20260416）","questions":[{"id":37,"number":1,"section":"二、判断题","type":"单选题","prompt":"神经系统由哪个胚层发育而来？","options":[{"key":"A","text":"三胚层均可"},{"key":"B","text":"外胚层（ectoderm）"},{"key":"C","text":"中胚层（mesoderm）"},{"key":"D","text":"内胚层（endoderm）"}],"answer":"B","explanation":"神经系统起源于外胚层，通过神经诱导形成神经板，进而卷曲为神经管，发育为中枢和外周神经系统。"},{"id":38,"number":2,"section":"二、判断题","type":"单选题","prompt":"中枢神经系统的主要细胞类型不包括以下哪种：","options":[{"key":"A","text":"神经元（Neuron）"},{"key":"B","text":"巨噬细胞（Macrophage）"},{"key":"C","text":"星型胶质细胞（Astrocyte）"},{"key":"D","text":"少突胶质细胞（Oligodendrocyte）"}],"answer":"B","explanation":"巨噬细胞属于外周免疫系统细胞，不是中枢神经系统的主要组成细胞；中枢神经系统中的免疫细胞是小胶质细胞。"},{"id":39,"number":3,"section":"二、判断题","type":"单选题","prompt":"早期神经发生的组织结构不包括：","options":[{"key":"A","text":"神经管（Neural Tube）"},{"key":"B","text":"神经脊（Neural Crest）"},{"key":"C","text":"神经板（Neural Plate）"},{"key":"D","text":"神经球（Neural Sphere）"}],"answer":"D","explanation":"神经球是体外培养神经干细胞时形成的细胞团，不是体内早期神经发生的组织结构。"},{"id":40,"number":4,"section":"二、判断题","type":"单选题","prompt":"以下哪种细胞是胚胎神经干细胞：","options":[{"key":"A","text":"小胶质细胞（Microglia）"},{"key":"B","text":"少突胶质细胞前体（Oligodendrocyte precursor cell）"},{"key":"C","text":"中间前体细胞（Intermediate progenitor cell）"},{"key":"D","text":"放射状胶质细胞（Radial glia）"}],"answer":"D","explanation":"放射状胶质细胞是胚胎期主要的神经干细胞，既能自我更新，又能分化产生神经元和胶质细胞，同时为新生神经元提供迁移支架。"},{"id":41,"number":5,"section":"二、判断题","type":"单选题","prompt":"以下哪一层皮层神经元最先形成：","options":[{"key":"A","text":"1"},{"key":"B","text":"3"},{"key":"C","text":"5"},{"key":"D","text":"6"}],"answer":"D","explanation":"大脑皮层发育遵循\"由内到外\"（inside-out）的模式，深层神经元（第6层）最先形成，浅层神经元后形成并迁移越过深层。"},{"id":42,"number":6,"section":"二、判断题","type":"单选题","prompt":"以下哪项不属于神经发育的 8 个主要阶段之一：","options":[{"key":"A","text":"神经元死亡（Neuron death）"},{"key":"B","text":"迁徙（Migration）"},{"key":"C","text":"小胶质细胞形成（Microglia genesis）"},{"key":"D","text":"增殖（Proliferation）"}],"answer":"C","explanation":"小胶质细胞起源于卵黄囊的中胚层前体细胞，不属于神经发育的经典阶段；神经发育主要包括诱导、增殖、迁移、分化、突触形成、修剪、髓鞘化和神经元死亡等。"},{"id":43,"number":7,"section":"二、判断题","type":"单选题","prompt":"至少有百分之几的新生神经元在发育过程中死亡：","options":[{"key":"A","text":"80%"},{"key":"B","text":"10%"},{"key":"C","text":"20%"},{"key":"D","text":"40%"}],"answer":"D","explanation":"发育过程中约40-50%的新生神经元通过程序性细胞死亡被清除，这一过程受神经营养因子竞争性调节，确保神经环路的精确连接。"},{"id":44,"number":8,"section":"二、判断题","type":"单选题","prompt":"小鼠皮层和人皮层发育的一个重要差别在于人具有：","options":[{"key":"A","text":"VZ"},{"key":"B","text":"oSVZ"},{"key":"C","text":"IZ"},{"key":"D","text":"CP"}],"answer":"B","explanation":"人脑皮层发育中具有显著扩大的外层亚脑室区（oSVZ），其中含有大量外放射状胶质细胞（oRG），是人脑皮层扩展和折叠的关键。"},{"id":45,"number":9,"section":"二、判断题","type":"单选题","prompt":"常用的谱系追踪技术不包括：","options":[{"key":"A","text":"染料标记"},{"key":"B","text":"原位杂交标记"},{"key":"C","text":"Cre/LoxP 报告基因系统"},{"key":"D","text":"H3 或 BrdU 标记 DNA"}],"answer":"B","explanation":"原位杂交是检测特定RNA表达的技术，不能追踪细胞谱系关系；染料标记、Cre/LoxP和BrdU/H3标记均可标记细胞并追踪其后代。"},{"id":46,"number":10,"section":"二、判断题","type":"单选题","prompt":"单细胞测序技术在脑发育中的应用不包括：","options":[{"key":"A","text":"对发育中的脑细胞进行分群"},{"key":"B","text":"直接证明细胞间的分化关系"},{"key":"C","text":"确定不同细胞亚群的特异性表达基因"},{"key":"D","text":"模拟和预测神经发育路径"}],"answer":"B","explanation":"单细胞测序可进行分群、鉴定标志基因和拟时序分析来推测分化轨迹，但不能直接证明细胞间的分化关系，后者需要谱系追踪实验验证。"}]},{"id":6,"title":"第六章 疼痛信号传导（20260423）","questions":[{"id":47,"number":1,"section":"一、选择题","type":"单选题","prompt":"根据国际疼痛研究学会（IASP）的定义，疼痛是：","options":[{"key":"A","text":"仅由组织损伤引起的纯粹生理感觉"},{"key":"B","text":"与实际或潜在组织损伤相关或类似的不适感官和情绪体验"},{"key":"C","text":"只有在神经系统受到直接损伤时才产生的感觉"},{"key":"D","text":"完全由主观因素决定、与身体无关的心理现象"}],"answer":"B","explanation":"IASP定义疼痛为与实际或潜在组织损伤相关的不愉快的感觉和情感体验，强调疼痛兼具感觉和情绪双重成分。"},{"id":48,"number":2,"section":"一、选择题","type":"单选题","prompt":"下列哪种感觉属于躯体感觉的范畴？","options":[{"key":"A","text":"视觉"},{"key":"B","text":"听觉"},{"key":"C","text":"本体感觉"},{"key":"D","text":"嗅觉"}],"answer":"C","explanation":"躯体感觉包括触觉、温度觉、痛觉和本体感觉（位置觉）；视觉、听觉、嗅觉属于特殊感觉。"},{"id":49,"number":3,"section":"一、选择题","type":"单选题","prompt":"皮肤中专门感受强烈伤害性刺激（强热、强压、化学刺激）的感受器称为：","options":[{"key":"A","text":"机械感受器"},{"key":"B","text":"伤害感受器"},{"key":"C","text":"温度感受器"},{"key":"D","text":"本体感受器"}],"answer":"B","explanation":"伤害感受器（nociceptor）是高阈值感受器，专门检测可能造成组织损伤的强烈刺激，将其转化为痛觉信号。"},{"id":50,"number":4,"section":"一、选择题","type":"单选题","prompt":"Aδ纤维介导的疼痛特点是：","options":[{"key":"A","text":"定位不明确的慢性痛"},{"key":"B","text":"与慢性炎症性疼痛相关"},{"key":"C","text":"急性且定位明确的疼痛"},{"key":"D","text":"无法被意识感知的疼痛"}],"answer":"C","explanation":"Aδ纤维是有髓鞘的细径纤维，传导速度较快，介导\"第一痛\"——急性、尖锐、定位明确的疼痛。"},{"id":51,"number":5,"section":"一、选择题","type":"单选题","prompt":"慢性疼痛的诊断时限是指疼痛持续：","options":[{"key":"A","text":"超过1周"},{"key":"B","text":"超过1个月"},{"key":"C","text":"超过3个月"},{"key":"D","text":"超过6个月"}],"answer":"C","explanation":"临床上将持续或反复发作超过3个月的疼痛定义为慢性疼痛。"},{"id":52,"number":6,"section":"一、选择题","type":"单选题","prompt":"伤害性信号从皮肤到大脑的传递路径，以下顺序正确的是：","options":[{"key":"A","text":"初级感觉神经元 → 脊髓 → 丘脑 → 大脑皮层"},{"key":"B","text":"脊髓 → 丘脑 → 初级感觉神经元 → 大脑皮层"},{"key":"C","text":"大脑皮层 → 丘脑 → 脊髓 → 初级感觉神经元"},{"key":"D","text":"初级感觉神经元 → 丘脑 → 脊髓 → 大脑皮层"}],"answer":"A","explanation":"痛觉传导的经典通路为：伤害感受器激活初级感觉神经元 → 脊髓背角（二级神经元） → 丘脑（三级神经元） → 大脑皮层（感知）。"},{"id":53,"number":7,"section":"一、选择题","type":"单选题","prompt":"受伤后局部炎症导致\"轻微触碰也感到疼痛\"，其核心机制是：","options":[{"key":"A","text":"神经纤维数量减少"},{"key":"B","text":"外周和中枢敏化"},{"key":"C","text":"痛觉信号被完全阻断"},{"key":"D","text":"丘脑功能永久损伤"}],"answer":"B","explanation":"炎症介质降低伤害感受器阈值（外周敏化），同时脊髓背角神经元兴奋性增强（中枢敏化），共同导致触诱发痛。"},{"id":54,"number":8,"section":"一、选择题","type":"单选题","prompt":"关于慢性疼痛的社会负担，以下说法正确的是：","options":[{"key":"A","text":"慢性疼痛全球影响人群不到5%"},{"key":"B","text":"我国慢性疼痛患者超过3亿"},{"key":"C","text":"慢性疼痛仅影响老年人群"},{"key":"D","text":"慢性疼痛已被完全治愈，不再是健康难题"}],"answer":"B","explanation":"我国慢性疼痛患者超过3亿，是继心脑血管疾病和肿瘤之后的第三大健康问题，影响各年龄段人群。"},{"id":55,"number":9,"section":"一、选择题","type":"单选题","prompt":"关于阿片类镇痛药，以下说法正确的是：","options":[{"key":"A","text":"阿片类药物无任何副作用，可随意使用"},{"key":"B","text":"轻度疼痛应首选阿片类药物"},{"key":"C","text":"长期使用阿片类药物可能导致成瘾和呼吸抑制"},{"key":"D","text":"阿片类药物是所有疼痛的首选治疗方案"}],"answer":"C","explanation":"阿片类药物是强效镇痛药，但长期使用有成瘾性和呼吸抑制等严重副作用，应遵循WHO三阶梯原则合理使用。"},{"id":56,"number":10,"section":"一、选择题","type":"单选题","prompt":"以下哪项属于慢性疼痛的非药物治疗方式？","options":[{"key":"A","text":"服用布洛芬"},{"key":"B","text":"电刺激神经系统的神经调控疗法"},{"key":"C","text":"使用加巴喷丁"},{"key":"D","text":"注射吗啡"}],"answer":"B","explanation":"神经调控疗法（如经皮神经电刺激、脊髓电刺激等）是重要的非药物治疗手段；布洛芬、加巴喷丁和吗啡均属药物治疗。"},{"id":57,"number":1,"section":"二、判断题","type":"判断题","prompt":"疼痛只是一种纯粹的生理感觉，与情绪状态无关。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"F","explanation":"疼痛既有感官成分也有情绪成分，IASP定义明确指出疼痛是感觉和情感的双重体验。"},{"id":58,"number":2,"section":"二、判断题","type":"判断题","prompt":"伤害感受器属于\"高阈值\"感受器，只在受到强烈刺激时才被激活。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"T","explanation":"伤害感受器的激活阈值高于普通机械或温度感受器，只有达到可能损伤组织的刺激强度时才会被激活。"},{"id":59,"number":3,"section":"二、判断题","type":"判断题","prompt":"战场上士兵在激烈战斗中可能感受不到疼痛，说明大脑状态可以调节疼痛感知。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"T","explanation":"下行抑制系统（PAG-RVM通路）可释放内源性阿片肽抑制痛觉传入，在应激状态下产生应激性镇痛。"},{"id":60,"number":4,"section":"二、判断题","type":"判断题","prompt":"C纤维是有髓鞘纤维，传导速度快，介导急性定位明确的疼痛。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"F","explanation":"C纤维是无髓鞘纤维，传导速度慢（0.5-2 m/s），介导慢性、弥漫性的\"第二痛\"；Aδ纤维才是有髓鞘、传导快、介导急性痛的纤维。"},{"id":61,"number":5,"section":"二、判断题","type":"判断题","prompt":"疼痛信号到达大脑后，除初级躯体感觉皮层外，杏仁核和岛叶皮质也参与痛觉的情感体验。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"T","explanation":"痛觉的感觉-辨别成分由S1处理，情感-动机成分由杏仁核（恐惧/焦虑）和岛叶皮质（主观不适感）等区域处理。"},{"id":62,"number":6,"section":"二、判断题","type":"判断题","prompt":"慢性疼痛是继心脑血管疾病、肿瘤之后的第三大健康问题。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"T","explanation":"慢性疼痛影响全球超过20%人口，被WHO列为继心脑血管疾病和肿瘤之后的第三大健康问题。"},{"id":63,"number":7,"section":"二、判断题","type":"判断题","prompt":"外周敏化只发生在神经系统中枢，与外周组织无关。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"F","explanation":"外周敏化发生在外周神经末梢（伤害感受器），由炎症介质（前列腺素、缓激肽等）降低其激活阈值引起；中枢敏化才发生在脊髓及以上中枢。"},{"id":64,"number":8,"section":"二、判断题","type":"判断题","prompt":"牵涉痛是指疼痛感受到的部位与实际损伤部位不一致，如心肌缺血时出现左肩放射痛。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"T","explanation":"牵涉痛是因为内脏和体表的传入神经在脊髓背角汇聚于同一节段，大脑误判疼痛来源而产生的现象。"},{"id":65,"number":9,"section":"二、判断题","type":"判断题","prompt":"心理与行为治疗（如认知行为疗法）是慢性疼痛的有效非药物治疗手段之一。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"T","explanation":"认知行为疗法可改变患者对疼痛的认知和行为应对方式，已被大量临床研究证实对慢性疼痛管理有效。"},{"id":66,"number":10,"section":"二、判断题","type":"判断题","prompt":"对乙酰氨基酚和布洛芬属于非阿片类镇痛药，常用于轻度至中度疼痛。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":"T","explanation":"对乙酰氨基酚和布洛芬（NSAIDs类）是WHO三阶梯止痛的第一阶梯用药，适用于轻度至中度疼痛。"}]},{"id":7,"title":"第七章 神经系统疾病导论（20260430）","questions":[{"id":67,"number":1,"section":"二、判断题","type":"多选题","prompt":"以下哪些动脉承担脑的血液供应？","options":[{"key":"A","text":"颈内动脉"},{"key":"B","text":"颈外动脉"},{"key":"C","text":"大脑前动脉"},{"key":"D","text":"大脑中动脉"},{"key":"E","text":"椎-基底动脉"}],"answer":"ACDE","explanation":"脑血供由前循环（颈内动脉→大脑前/中动脉）和后循环（椎-基底动脉）两套系统提供；颈外动脉主要供应面部和头皮。"},{"id":68,"number":2,"section":"二、判断题","type":"多选题","prompt":"以下哪些属于卒中可控危险因素？","options":[{"key":"A","text":"高血压"},{"key":"B","text":"种族"},{"key":"C","text":"年龄"},{"key":"D","text":"糖尿病"},{"key":"E","text":"吸烟"}],"answer":"ADE","explanation":"高血压、糖尿病和吸烟是可通过干预控制的卒中危险因素；种族和年龄属于不可控因素。"},{"id":69,"number":3,"section":"二、判断题","type":"单选题","prompt":"发病率最高的脑卒中是：（单选）","options":[{"key":"A","text":"脑实质出血"},{"key":"B","text":"脑室出血"},{"key":"C","text":"蛛网膜下腔出血"},{"key":"D","text":"缺血性脑卒中"},{"key":"E","text":"脑干出血"}],"answer":"D","explanation":"缺血性脑卒中（脑梗死）占所有脑卒中的80%以上，是发病率最高的类型。"},{"id":70,"number":4,"section":"二、判断题","type":"多选题","prompt":"蛛网膜下腔出血的主要病因包括：","options":[{"key":"A","text":"先天性动脉瘤"},{"key":"B","text":"脑血管畸形"},{"key":"C","text":"高血压动脉硬化性动脉瘤"},{"key":"D","text":"Moyamoya 病"},{"key":"E","text":"大动脉粥样硬化"}],"answer":"ABCD","explanation":"蛛网膜下腔出血最常见的病因是先天性颅内动脉瘤破裂，其他病因包括脑血管畸形、动脉硬化性动脉瘤和烟雾病等。"},{"id":71,"number":5,"section":"二、判断题","type":"多选题","prompt":"血管性认知障碍临床-病理-病因分型包括：","options":[{"key":"A","text":"危险因素相关性"},{"key":"B","text":"缺血性"},{"key":"C","text":"出血性"},{"key":"D","text":"脑血管病合并 AD"},{"key":"E","text":"活动亢进型"}],"answer":"ABCD","explanation":"血管性认知障碍的分型包括危险因素相关性、缺血性、出血性和脑血管病合并AD病理；活动亢进型属于谵妄的分型。"},{"id":72,"number":6,"section":"二、判断题","type":"多选题","prompt":"以下哪些是影响癫痫发作的因素？","options":[{"key":"A","text":"遗传因素"},{"key":"B","text":"年龄"},{"key":"C","text":"睡眠"},{"key":"D","text":"过度疲劳"},{"key":"E","text":"内分泌失调"}],"answer":"ABCDE","explanation":"癫痫发作受多种因素影响，包括遗传易感性、年龄、睡眠剥夺、过度疲劳和内分泌变化等均可诱发或加重发作。"},{"id":73,"number":7,"section":"二、判断题","type":"多选题","prompt":"神经系统遗传性疾病传递方式包括：","options":[{"key":"A","text":"单基因遗传"},{"key":"B","text":"多基因遗传"},{"key":"C","text":"线粒体病"},{"key":"D","text":"染色体病"},{"key":"E","text":"体细胞遗传病"}],"answer":"ABCDE","explanation":"神经系统遗传病的传递方式涵盖单基因遗传（常/性染色体显/隐性）、多基因遗传、线粒体母系遗传、染色体数目/结构异常及体细胞突变。"},{"id":74,"number":8,"section":"二、判断题","type":"多选题","prompt":"根据发病年龄和临床特点，遗传性共济失调可分为：","options":[{"key":"A","text":"常染色体显性遗传性共济失调"},{"key":"B","text":"常染色体隐性遗传性共济失调"},{"key":"C","text":"X连锁遗传性共济失调"},{"key":"D","text":"Friedreich 共济失调"},{"key":"E","text":"脊髓小脑性共济失调"}],"answer":"DE","explanation":"按发病年龄和临床特点分类，遗传性共济失调主要分为Friedreich共济失调（早发型）和脊髓小脑性共济失调（SCA，晚发型）等类型。"},{"id":75,"number":9,"section":"二、判断题","type":"多选题","prompt":"根据病变累及的范围，周围神经病变分为哪几类？","options":[{"key":"A","text":"多发性神经病"},{"key":"B","text":"多发神经根病变"},{"key":"C","text":"脱髓鞘性神经病变"},{"key":"D","text":"单神经病变"},{"key":"E","text":"神经丛病"}],"answer":"ABDE","explanation":"按病变范围分类，周围神经病变包括多发性神经病、多发神经根病变、单神经病变和神经丛病；脱髓鞘性神经病变是按病理分类。"},{"id":76,"number":10,"section":"二、判断题","type":"多选题","prompt":"中枢神经系统感染途径包括：","options":[{"key":"A","text":"血行感染"},{"key":"B","text":"垂直感染"},{"key":"C","text":"直接感染"},{"key":"D","text":"逆行感染"},{"key":"E","text":"消化道感染"}],"answer":"ACD","explanation":"中枢神经系统感染的主要途径包括血行感染（最常见）、直接感染（外伤/手术）和逆行感染（沿神经逆行传播如狂犬病毒）。"}]},{"id":8,"title":"第八章 癌症神经科学（20260507）","questions":[{"id":77,"number":1,"section":"二、判断题","type":"单选题","prompt":"\"癌症神经生物学\"的概念何时被提出？","options":[{"key":"A","text":"1835"},{"key":"B","text":"2008"},{"key":"C","text":"2017"},{"key":"D","text":"2020"}],"answer":"D","explanation":"2020年Cancer Neuroscience作为一个正式的研究领域被提出，尽管神经与肿瘤互作的研究证据此前已有积累。"},{"id":78,"number":2,"section":"二、判断题","type":"单选题","prompt":"以下哪项表述是错误的：","options":[{"key":"A","text":"精神状态可影响肿瘤发生发展"},{"key":"B","text":"肿瘤可主动重塑神经环路"},{"key":"C","text":"大部分肿瘤都可与神经元形成电化学功能突触"},{"key":"D","text":"神经电活动分泌因子可促进肿瘤"}],"answer":"C","explanation":"目前仅在胶质瘤等少数肿瘤中发现了神经元-肿瘤细胞之间的电化学突触，并非\"大部分\"肿瘤都能形成此类突触。"},{"id":79,"number":3,"section":"二、判断题","type":"单选题","prompt":"已发现的神经-肿瘤突触不包括：","options":[{"key":"A","text":"交感神经突触"},{"key":"B","text":"谷氨酸能突触"},{"key":"C","text":"GABA能突触"},{"key":"D","text":"胆碱能突触"}],"answer":"A","explanation":"已发现的神经-肿瘤突触类型包括谷氨酸能、GABA能和胆碱能突触；交感神经主要通过旁分泌方式（释放去甲肾上腺素等）影响肿瘤，而非形成经典突触。"},{"id":80,"number":4,"section":"二、判断题","type":"单选题","prompt":"针对神经-肿瘤互作治疗肿瘤的主要策略不包括：","options":[{"key":"A","text":"神经/精神类药物的老药新用"},{"key":"B","text":"手术切除肿瘤周围神经"},{"key":"C","text":"抑制神经信号受体"},{"key":"D","text":"补充神经营养因子"}],"answer":"D","explanation":"神经营养因子可能促进肿瘤生长，补充它们会加重病情；治疗策略应以阻断神经-肿瘤信号通路为目标。"},{"id":81,"number":5,"section":"二、判断题","type":"单选题","prompt":"癌症治疗造成的神经系统毒性不包括：","options":[{"key":"A","text":"认知障碍"},{"key":"B","text":"阿尔兹海默症"},{"key":"C","text":"耳（听神经）毒性"},{"key":"D","text":"周围神经病变"}],"answer":"B","explanation":"化疗可导致认知障碍（\"化疗脑\"）、耳毒性和周围神经病变等神经毒性，但阿尔兹海默症是独立的神经退行性疾病，不属于癌症治疗的直接神经毒性。"}]},{"id":9,"title":"第九章 神经免疫（20260514）","questions":[{"id":82,"number":1,"section":"二、判断题","type":"多选题","prompt":"请指出以下哪些感染性疾病已经通过疫苗免疫完全得到清除：","options":[{"key":"A","text":"天花"},{"key":"B","text":"脊髓灰质炎"},{"key":"C","text":"HIV"},{"key":"D","text":"肺结核"},{"key":"E","text":"麻疹"}],"answer":"ABE","explanation":"天花已被WHO宣布彻底消灭，脊髓灰质炎和麻疹通过疫苗接种在大多数国家基本消除；HIV和肺结核目前尚无有效消除性疫苗。"},{"id":83,"number":2,"section":"二、判断题","type":"多选题","prompt":"请选择以下属于天然免疫系统的细胞：","options":[{"key":"A","text":"巨核细胞"},{"key":"B","text":"巨噬细胞"},{"key":"C","text":"浆细胞"},{"key":"D","text":"中性粒细胞"},{"key":"E","text":"NK 细胞"}],"answer":"BDE","explanation":"巨噬细胞、中性粒细胞和NK细胞是天然免疫的核心效应细胞；巨核细胞产生血小板，浆细胞属于适应性免疫。"},{"id":84,"number":3,"section":"二、判断题","type":"多选题","prompt":"请指出以下属于二级淋巴器官的是：","options":[{"key":"A","text":"骨髓"},{"key":"B","text":"肝脏"},{"key":"C","text":"皮肤"},{"key":"D","text":"腹股沟淋巴结"},{"key":"E","text":"脾脏"}],"answer":"DE","explanation":"淋巴结和脾脏是经典的二级（外周）淋巴器官，是免疫应答启动的场所；骨髓和胸腺是一级（中枢）淋巴器官。"},{"id":85,"number":4,"section":"二、判断题","type":"多选题","prompt":"以下哪些特征属于 Adaptive Immune Response：","options":[{"key":"A","text":"反应速度快，可在几小时内完成"},{"key":"B","text":"高度抗原特异性"},{"key":"C","text":"对二次感染的反应时间快"},{"key":"D","text":"主要由屏障系统参与"}],"answer":"BC","explanation":"适应性免疫的核心特征是高度抗原特异性和免疫记忆（二次应答快）；快速反应和屏障系统属于天然免疫特征。"},{"id":86,"number":5,"section":"二、判断题","type":"多选题","prompt":"以下哪些解剖学特征可以确保大脑处于\"免疫豁免\"状态：","options":[{"key":"A","text":"血-脑屏障"},{"key":"B","text":"血-脑脊液屏障"},{"key":"C","text":"脑膜屏障"},{"key":"D","text":"脑灰质"},{"key":"E","text":"脑白质"}],"answer":"ABC","explanation":"血-脑屏障、血-脑脊液屏障和脑膜屏障共同构成大脑的免疫豁免基础，限制外周免疫细胞和大分子进入中枢神经系统。"},{"id":87,"number":6,"section":"二、判断题","type":"单选题","prompt":"以下关于 Microglia 的说法哪个是错误的？","options":[{"key":"A","text":"形态随状态变化"},{"key":"B","text":"具有免疫监视功能"},{"key":"C","text":"完全由单核细胞分化而来"},{"key":"D","text":"可以与神经细胞相互作用"}],"answer":"C","explanation":"小胶质细胞起源于胚胎期卵黄囊的原始巨噬细胞前体，在胚胎早期迁入脑内，并非由成体单核细胞分化而来。"},{"id":88,"number":7,"section":"二、判断题","type":"多选题","prompt":"以下哪些描述属于多发性硬化的病理特征：","options":[{"key":"A","text":"腹泻"},{"key":"B","text":"呼吸困难"},{"key":"C","text":"失明"},{"key":"D","text":"共济失调"},{"key":"E","text":"吞咽困难"}],"answer":"ACDE","explanation":"多发性硬化可累及视神经（失明）、小脑（共济失调）、脑干（吞咽困难），严重时也可影响自主神经功能（胃肠症状）；呼吸困难不是其典型表现。"},{"id":89,"number":8,"section":"二、判断题","type":"多选题","prompt":"以下哪些免疫细胞不参与多发硬化的病理过程：","options":[{"key":"A","text":"树突状细胞"},{"key":"B","text":"单核细胞"},{"key":"C","text":"嗜酸性粒细胞"},{"key":"D","text":"Th17 细胞"},{"key":"E","text":"Th1 细胞"}],"answer":"ABDE","explanation":"本题答案依据课程参考答案；嗜酸性粒细胞（C）参与多发硬化病理过程，而树突状细胞、单核细胞、Th17和Th1细胞在本题语境下不属于参与者（注意：此题答案以课程给出的参考答案为准）。"},{"id":90,"number":9,"section":"二、判断题","type":"多选题","prompt":"以下哪些细胞参与血-脑屏障的形成：","options":[{"key":"A","text":"周细胞"},{"key":"B","text":"少突胶质细胞"},{"key":"C","text":"小胶质细胞"},{"key":"D","text":"内皮细胞"},{"key":"E","text":"神经元"}],"answer":"ABCD","explanation":"血-脑屏障由脑微血管内皮细胞为核心，周细胞、星形胶质细胞足突和基底膜共同构成；本题参考答案包含ABCD。"},{"id":91,"number":10,"section":"二、判断题","type":"多选题","prompt":"以下关于 Microglia 与阿尔兹海默症的说法哪些是正确的？","options":[{"key":"A","text":"Microglia 可以合成淀粉样蛋白前体"},{"key":"B","text":"活化的 Microglia 可以清除淀粉样斑块"},{"key":"C","text":"小胶质细胞只促进 AD 的进展"},{"key":"D","text":"部分小胶质细胞可以限制 AD 的进展"}],"answer":"ABD","explanation":"小胶质细胞在AD中具有双重作用：既能通过吞噬清除Aβ斑块（保护作用），也能因过度活化释放炎症因子加重病理（促病作用），因此C\"只促进\"的说法错误。"}]},{"id":10,"title":"第十章 脑肠轴（20260521）","questions":[{"id":92,"number":1,"section":"二、判断题","type":"多选题","prompt":"大脑-肠道交流的三条主要途径是什么？","options":[{"key":"A","text":"神经途径"},{"key":"B","text":"内分泌途径"},{"key":"C","text":"免疫途径"},{"key":"D","text":"旁分泌途径"}],"answer":"ABC","explanation":"脑肠轴的三大交流途径是神经途径（迷走神经等）、内分泌途径（HPA轴）和免疫途径（细胞因子等）。"},{"id":93,"number":2,"section":"二、判断题","type":"多选题","prompt":"脑-肠轴涉及的主要研究对象有哪些？","options":[{"key":"A","text":"神经系统"},{"key":"B","text":"肌肉"},{"key":"C","text":"消化道"},{"key":"D","text":"菌群微生物"}],"answer":"ACD","explanation":"脑-肠轴研究的核心对象包括中枢/外周神经系统、胃肠道及肠道微生物菌群，三者通过双向信号通路相互调控。"},{"id":94,"number":3,"section":"二、判断题","type":"多选题","prompt":"大脑和肠道交互的神经系统可分为哪些部分？","options":[{"key":"A","text":"大脑"},{"key":"B","text":"脊髓"},{"key":"C","text":"肠神经系统"},{"key":"D","text":"迷走神经途径"}],"answer":"ABCD","explanation":"脑肠神经交互涉及中枢（大脑、脊髓）和外周（肠神经系统、迷走神经）多个层次的神经网络。"},{"id":95,"number":4,"section":"二、判断题","type":"单选题","prompt":"阿尔茨海默症治疗新药甘露特钠胶囊（九期一）的靶点是什么？","options":[{"key":"A","text":"神经元"},{"key":"B","text":"肠道上皮"},{"key":"C","text":"肠道菌群"},{"key":"D","text":"神经胶质细胞"}],"answer":"C","explanation":"九期一（GV-971）通过重塑肠道菌群、减少菌群相关神经炎症的作用机制改善AD患者认知功能，靶点是肠道菌群。"},{"id":96,"number":5,"section":"二、判断题","type":"多选题","prompt":"参与脑-肠交互的内分泌途径的关键组织是：","options":[{"key":"A","text":"下丘脑"},{"key":"B","text":"垂体"},{"key":"C","text":"肾上腺"},{"key":"D","text":"胰腺"}],"answer":"ABC","explanation":"HPA轴（下丘脑-垂体-肾上腺轴）是脑肠轴内分泌途径的核心，应激信号通过该轴调节肠道功能。"},{"id":97,"number":6,"section":"二、判断题","type":"多选题","prompt":"以下因素中哪些被证实了会参与调控脑-肠轴交流？","options":[{"key":"A","text":"饮食"},{"key":"B","text":"先天性遗传"},{"key":"C","text":"表观遗传学"},{"key":"D","text":"环境因素"}],"answer":"ABCD","explanation":"饮食（影响菌群组成）、遗传、表观遗传和环境因素均被证实通过多种机制参与脑肠轴的调控。"},{"id":98,"number":7,"section":"二、判断题","type":"多选题","prompt":"已被证实的受脑-肠轴影响的行为和精神有哪些？","options":[{"key":"A","text":"认知"},{"key":"B","text":"压力"},{"key":"C","text":"恐惧"},{"key":"D","text":"食物摄入"}],"answer":"ABCD","explanation":"脑肠轴双向调控影响认知功能、压力应激反应、恐惧情绪和食欲/进食行为等多种行为和精神状态。"},{"id":99,"number":8,"section":"二、判断题","type":"多选题","prompt":"下面哪些疾病被证实由脑肠轴参与调控？","options":[{"key":"A","text":"多发性硬化"},{"key":"B","text":"肠易激综合征"},{"key":"C","text":"中风"},{"key":"D","text":"肥胖"}],"answer":"ABCD","explanation":"脑肠轴失调与多发性硬化（免疫调节）、肠易激综合征（功能性胃肠病）、中风（炎症反应）和肥胖（代谢调节）等多种疾病相关。"},{"id":100,"number":9,"section":"二、判断题","type":"多选题","prompt":"紧张和压力会参与调节 HPA 轴，刺激以下哪些神经内分泌信号分子的释放，引起胃肠功能失调？","options":[{"key":"A","text":"5-羟色胺"},{"key":"B","text":"胰高血糖素"},{"key":"C","text":"儿茶酚胺"},{"key":"D","text":"胰岛素"}],"answer":"AC","explanation":"应激通过HPA轴和交感神经系统释放5-羟色胺和儿茶酚胺（如肾上腺素、去甲肾上腺素），影响肠道运动和分泌功能。"},{"id":101,"number":10,"section":"二、判断题","type":"多选题","prompt":"下面哪些代谢物是由肠道微生物产生并作用于肠道 EECs 和 ECCs，调控大脑神经中枢的？","options":[{"key":"A","text":"初级胆汁酸"},{"key":"B","text":"二级胆汁酸"},{"key":"C","text":"极长链脂肪酸"},{"key":"D","text":"短链脂肪酸"}],"answer":"BD","explanation":"二级胆汁酸（由肠道细菌从初级胆汁酸转化）和短链脂肪酸（肠菌发酵膳食纤维产生）是肠道微生物的关键代谢产物，作用于肠内分泌细胞影响脑功能。"}]},{"id":11,"title":"第十一章 神经胶质细胞（20260528）","questions":[{"id":102,"number":1,"section":"二、判断题","type":"单选题","prompt":"下列关于星形胶质细胞（astrocytes）亚型的描述，哪一项是正确的？（单选）","options":[{"key":"A","text":"原生质型星形胶质细胞主要分布在白质区域，具有长而纤细的突起"},{"key":"B","text":"纤维型星形胶质细胞主要存在于灰质中，突起稠密而短"},{"key":"C","text":"原生质型星形胶质细胞分布在灰质中，突起短而分枝丰富"},{"key":"D","text":"两种星形胶质细胞在形态和分布上没有显著差异"}],"answer":"C","explanation":"原生质型星形胶质细胞（protoplasmic）分布在灰质，突起短而分枝丰富；纤维型（fibrous）分布在白质，突起长而纤细。"},{"id":103,"number":2,"section":"二、判断题","type":"单选题","prompt":"中枢神经系统中的星形胶质细胞最早在哪个发育阶段开始生成？（单选）","options":[{"key":"A","text":"胚胎早期（E8.5）"},{"key":"B","text":"胚胎中期（E12.5）"},{"key":"C","text":"胚胎晚期（E18.5）"},{"key":"D","text":"出生后第7天"}],"answer":"C","explanation":"星形胶质细胞的生成主要始于胚胎晚期（约E18.5），晚于神经元发生，并在出生后早期大量增殖和成熟。"},{"id":104,"number":3,"section":"二、判断题","type":"单选题","prompt":"星形胶质细胞在哪个发育阶段成熟，表现为形态和功能的完全分化？（单选）","options":[{"key":"A","text":"胚胎中期（E12.5）"},{"key":"B","text":"胚胎晚期（E18.5）"},{"key":"C","text":"出生后早期（P0-P7）"},{"key":"D","text":"出生后晚期（P21-P28）"}],"answer":"D","explanation":"星形胶质细胞在出生后晚期（约P21-P28）才达到形态和功能的完全成熟，包括完善的终足结构和神经递质摄取能力。"},{"id":105,"number":4,"section":"二、判断题","type":"单选题","prompt":"少突胶质细胞的主要功能是什么？（单选）","options":[{"key":"A","text":"产生神经递质"},{"key":"B","text":"形成髓鞘"},{"key":"C","text":"维持血脑屏障"},{"key":"D","text":"促进神经生长"}],"answer":"B","explanation":"少突胶质细胞的核心功能是在中枢神经系统中包裹轴突形成髓鞘，实现跳跃式传导，加快信号传递速度。"},{"id":106,"number":5,"section":"二、判断题","type":"单选题","prompt":"在成人中，少突胶质细胞前体细胞（OPCs）在以下什么情况下募集和再分化？（单选）","options":[{"key":"A","text":"正常生理状态"},{"key":"B","text":"神经损伤"},{"key":"C","text":"脑血流增加"},{"key":"D","text":"休息状态"}],"answer":"B","explanation":"成体OPCs在正常情况下处于静息状态，当发生脱髓鞘损伤时被激活、募集并分化为成熟少突胶质细胞参与髓鞘修复。"},{"id":107,"number":6,"section":"二、判断题","type":"单选题","prompt":"髓鞘主要存在于什么结构中？（单选）","options":[{"key":"A","text":"血管"},{"key":"B","text":"大脑皮层"},{"key":"C","text":"胼胝体"},{"key":"D","text":"眼球"}],"answer":"C","explanation":"胼胝体是连接左右大脑半球的最大白质纤维束，含有大量有髓鞘的轴突，是髓鞘最密集的结构之一。"},{"id":108,"number":7,"section":"二、判断题","type":"多选题","prompt":"以下哪些功能与少突胶质细胞相关：（多选）","options":[{"key":"A","text":"形成髓鞘"},{"key":"B","text":"参与突触修剪"},{"key":"C","text":"产生神经递质"},{"key":"D","text":"支持神经元生存"}],"answer":"ABD","explanation":"少突胶质细胞除形成髓鞘外，还能参与突触修剪和通过分泌营养因子支持神经元生存；产生神经递质不是其功能。"},{"id":109,"number":8,"section":"二、判断题","type":"多选题","prompt":"髓鞘的特点包括哪些：（多选）","options":[{"key":"A","text":"提高神经信号传导速度"},{"key":"B","text":"由少突胶质细胞或施旺细胞形成"},{"key":"C","text":"仅存在于中枢神经系统"},{"key":"D","text":"包含脂质和蛋白质"}],"answer":"ABD","explanation":"髓鞘通过跳跃传导提高信号速度，由CNS中的少突胶质细胞和PNS中的施旺细胞形成，富含脂质（70-80%）和蛋白质（20-30%）。"},{"id":110,"number":9,"section":"二、判断题","type":"多选题","prompt":"少突胶质细胞可能参与以下哪些疾病的发生：（多选）","options":[{"key":"A","text":"阿尔兹海默症"},{"key":"B","text":"多发性硬化症"},{"key":"C","text":"自闭症"},{"key":"D","text":"亨廷顿舞蹈病"}],"answer":"ABCD","explanation":"少突胶质细胞功能异常和髓鞘病变参与多种神经疾病，包括AD（白质损伤）、MS（免疫攻击髓鞘）、ASD（髓鞘发育异常）和HD（白质退行性变）。"},{"id":111,"number":10,"section":"二、判断题","type":"单选题","prompt":"以下关于小胶质细胞在帕金森病（PD）中作用的描述，哪一项是正确的？（单选）","options":[{"key":"A","text":"小胶质细胞无法识别α-突触核蛋白聚集体，因而不参与病理过程"},{"key":"B","text":"小胶质细胞通过 NMDAR 直接杀伤多巴胺能神经元"},{"key":"C","text":"激活的小胶质细胞释放促炎因子可加剧神经炎症并促进神经元退行性变"},{"key":"D","text":"小胶质细胞的唯一功能是在发育过程中修剪突触，与 PD 无关"}],"answer":"C","explanation":"PD中α-synuclein聚集体激活小胶质细胞，使其释放TNF-α、IL-1β等促炎因子，形成慢性神经炎症环境，加速多巴胺能神经元死亡。"}]},{"id":12,"title":"第十二章 神经退行性疾病（20260604）","questions":[{"id":112,"number":1,"section":"二、判断题","type":"多选题","prompt":"阿尔茨海默病是一种中枢神经系统变性病，主要表现包括：","options":[{"key":"A","text":"静止性震颤"},{"key":"B","text":"认知功能障碍"},{"key":"C","text":"人格和行为改变"},{"key":"D","text":"抽象思维和计算力损害"},{"key":"E","text":"渐进性记忆障碍"}],"answer":"BCDE","explanation":"AD的核心表现为渐进性记忆障碍、认知功能下降、人格行为改变和计算力损害；静止性震颤是帕金森病的典型运动症状。"},{"id":113,"number":2,"section":"二、判断题","type":"多选题","prompt":"以下哪些不是水解 APP 产生 Aβ 的关键酶？","options":[{"key":"A","text":"胰蛋白酶"},{"key":"B","text":"α-分泌酶"},{"key":"C","text":"β-分泌酶"},{"key":"D","text":"γ-分泌酶"},{"key":"E","text":"淀粉酶"}],"answer":"ABE","explanation":"APP经β-分泌酶和γ-分泌酶依次切割产生Aβ（淀粉样途径）；α-分泌酶在Aβ序列内切割阻止其生成（非淀粉样途径）；胰蛋白酶和淀粉酶不参与此过程。"},{"id":114,"number":3,"section":"二、判断题","type":"单选题","prompt":"在帕金森病中细胞内路易体主要在哪种细胞：","options":[{"key":"A","text":"小胶质细胞"},{"key":"B","text":"星形胶质细胞"},{"key":"C","text":"少突胶质细胞"},{"key":"D","text":"多巴胺能神经元"},{"key":"E","text":"施万细胞"}],"answer":"D","explanation":"路易体（Lewy body）是PD的病理标志，主要由错误折叠的α-synuclein聚集形成，出现在中脑黑质的多巴胺能神经元胞体内。"},{"id":115,"number":4,"section":"二、判断题","type":"单选题","prompt":"以下哪种是帕金森病诊断的关键生物学标志物？","options":[{"key":"A","text":"α-synuclein"},{"key":"B","text":"T-tau"},{"key":"C","text":"P-tau"},{"key":"D","text":"Aβ"},{"key":"E","text":"S-100"}],"answer":"A","explanation":"α-synuclein的异常聚集是PD的核心病理特征，其种子扩增检测（SAA）已成为PD生物学诊断的关键标志物。"},{"id":116,"number":5,"section":"二、判断题","type":"多选题","prompt":"以下哪些属于帕金森病 Braak 病理 2 期症状？","options":[{"key":"A","text":"睡眠障碍"},{"key":"B","text":"嗅觉障碍"},{"key":"C","text":"运动障碍"},{"key":"D","text":"情绪障碍"},{"key":"E","text":"痴呆"}],"answer":"AD","explanation":"Braak 2期病变累及低位脑干（蓝斑核等），临床表现为睡眠障碍和情绪障碍等非运动症状；嗅觉障碍见于1期，运动症状见于3-4期，痴呆见于5-6期。"},{"id":117,"number":6,"section":"二、判断题","type":"多选题","prompt":"以下哪些属于帕金森病相关基因？","options":[{"key":"A","text":"PARK1"},{"key":"B","text":"PARK2"},{"key":"C","text":"PARK3"},{"key":"D","text":"PARK4"},{"key":"E","text":"PARK5"}],"answer":"ABCDE","explanation":"PARK1-5均是已鉴定的帕金森病相关基因位点，分别对应SNCA、Parkin、未知、SNCA三倍体和UCHL1等基因。"},{"id":118,"number":7,"section":"二、判断题","type":"单选题","prompt":"以下哪一个是编码 α-synuclein 蛋白的基因？","options":[{"key":"A","text":"PARK2"},{"key":"B","text":"SNCA"},{"key":"C","text":"LRRK2"},{"key":"D","text":"DJ-1"},{"key":"E","text":"PARK5"}],"answer":"B","explanation":"SNCA（PARK1/PARK4位点）编码α-synuclein蛋白，其点突变或基因拷贝数增加均可导致家族性PD。"},{"id":119,"number":8,"section":"二、判断题","type":"单选题","prompt":"以下哪一个是编码 Parkin 蛋白的基因？","options":[{"key":"A","text":"PARK1"},{"key":"B","text":"PARK2"},{"key":"C","text":"PARK3"},{"key":"D","text":"PARK4"},{"key":"E","text":"PARK5"}],"answer":"B","explanation":"PARK2基因编码Parkin蛋白，是一种E3泛素连接酶，其功能缺失突变是常染色体隐性遗传性早发PD的最常见原因。"},{"id":120,"number":9,"section":"二、判断题","type":"多选题","prompt":"以下属于帕金森病中的泛素-蛋白酶体系统的是：","options":[{"key":"A","text":"超氧化物歧化酶"},{"key":"B","text":"去泛素化酶"},{"key":"C","text":"氧化还原酶"},{"key":"D","text":"E3-UB 连接酶"},{"key":"E","text":"磷酸酯酶"}],"answer":"BD","explanation":"泛素-蛋白酶体系统（UPS）的核心组分包括泛素化酶（E1/E2/E3）和去泛素化酶；Parkin作为E3连接酶参与错误折叠蛋白的清除，其功能障碍与PD发病密切相关。"},{"id":121,"number":10,"section":"二、判断题","type":"单选题","prompt":"早发型帕金森病一般是 6 号染色体上的哪个基因缺失或突变导致？","options":[{"key":"A","text":"LRRK2"},{"key":"B","text":"SNCA"},{"key":"C","text":"PARKIN"},{"key":"D","text":"DJ-1"},{"key":"E","text":"PINK1"}],"answer":"C","explanation":"PARKIN基因位于6号染色体（6q25.2-q27），其纯合或复合杂合突变是常染色体隐性遗传早发型PD（juvenile PD）的最主要原因。"}]},{"id":13,"title":"第十三章 脑疾病的生物治疗（20260611）","questions":[{"id":122,"number":1,"section":"二、判断题","type":"多选题","prompt":"目前常用的基因治疗病毒载体有：","options":[{"key":"A","text":"腺病毒载体"},{"key":"B","text":"腺相关病毒载体"},{"key":"C","text":"逆转录病毒载体"},{"key":"D","text":"新冠病毒载体"}],"answer":"ABC","explanation":"腺病毒、腺相关病毒（AAV）和逆转录病毒/慢病毒是三大经典基因治疗载体系统；新冠病毒不用作基因治疗载体。"},{"id":123,"number":2,"section":"二、判断题","type":"单选题","prompt":"SMA（脊髓性肌萎缩症）一般分为几种类型：","options":[{"key":"A","text":"二"},{"key":"B","text":"三"},{"key":"C","text":"四"},{"key":"D","text":"五"}],"answer":"C","explanation":"SMA根据发病年龄和严重程度分为四型（I-IV型），从最严重的婴儿型（I型）到最轻的成人型（IV型）。"},{"id":124,"number":3,"section":"二、判断题","type":"单选题","prompt":"SMA 的发病机制主要是：","options":[{"key":"A","text":"SMN1 基因发生缺失突变"},{"key":"B","text":"SMN2 基因发生缺失突变"},{"key":"C","text":"SMN1 基因发生点突变"},{"key":"D","text":"SMN2 基因发生点突变"}],"answer":"C","explanation":"SMA主要由SMN1基因突变（包括缺失和点突变）导致功能性SMN蛋白缺乏，引起运动神经元退行性变；本题参考答案选C。"},{"id":125,"number":4,"section":"二、判断题","type":"多选题","prompt":"治疗 SMA 的 rAAV 基因药物包括以下部分：","options":[{"key":"A","text":"启动子"},{"key":"B","text":"治疗基因"},{"key":"C","text":"AAV 衣壳蛋白"},{"key":"D","text":"递送用脂质体"}],"answer":"ABC","explanation":"rAAV基因药物（如Zolgensma）由AAV衣壳蛋白包装含启动子和SMN1治疗基因的表达盒组成，不使用脂质体递送。"},{"id":126,"number":5,"section":"二、判断题","type":"单选题","prompt":"治疗 SMA 的 rAAV 基因药物使用的血清型为：","options":[{"key":"A","text":"AAV2"},{"key":"B","text":"AAV5"},{"key":"C","text":"AAV8"},{"key":"D","text":"AAV9"}],"answer":"D","explanation":"Zolgensma使用AAV9血清型，因AAV9能高效穿越血脑屏障并在运动神经元中实现高效转导。"},{"id":127,"number":6,"section":"二、判断题","type":"多选题","prompt":"rAAV 三质粒生产体系的要素为：","options":[{"key":"A","text":"Rep/Cap"},{"key":"B","text":"腺病毒辅助基因"},{"key":"C","text":"两边为 ITR 包围的治疗基因"},{"key":"D","text":"痘病毒基因"}],"answer":"ABC","explanation":"rAAV三质粒系统包括：(1) ITR-治疗基因-ITR载体质粒，(2) Rep/Cap辅助质粒，(3) 腺病毒辅助功能质粒；不涉及痘病毒。"},{"id":128,"number":7,"section":"二、判断题","type":"多选题","prompt":"目前现有 rAAV 三质粒生产体系的最主要问题是：","options":[{"key":"A","text":"病毒滴度不高"},{"key":"B","text":"不容易规模化生产"},{"key":"C","text":"生产成本昂贵"},{"key":"D","text":"病毒感染能力不高"}],"answer":"BC","explanation":"rAAV三质粒系统最大的瓶颈是难以规模化生产和成本极高（Zolgensma单剂超200万美元），限制了基因治疗的普及。"},{"id":129,"number":8,"section":"二、判断题","type":"多选题","prompt":"下面哪些疾病是神经系统相关疾病：","options":[{"key":"A","text":"帕金森症"},{"key":"B","text":"老年痴呆"},{"key":"C","text":"亨廷顿"},{"key":"D","text":"SMA"}],"answer":"ABCD","explanation":"帕金森病、阿尔兹海默病（老年痴呆）、亨廷顿舞蹈病和脊髓性肌萎缩症均为神经系统疾病。"},{"id":130,"number":9,"section":"二、判断题","type":"多选题","prompt":"rAAV 作为基因治疗载体的优点：","options":[{"key":"A","text":"安全性高"},{"key":"B","text":"能感染多种类型的细胞"},{"key":"C","text":"免疫原性相对较低"},{"key":"D","text":"长时间表达"}],"answer":"ABCD","explanation":"rAAV的优势包括：非致病性（安全）、广泛的组织嗜性（多种细胞）、免疫原性较低以及主要以附加体形式长期表达。"},{"id":131,"number":10,"section":"二、判断题","type":"多选题","prompt":"以下哪些方法有助于降低 rAAV 的免疫原性：","options":[{"key":"A","text":"高效的治疗基因"},{"key":"B","text":"靶向性高的 rAAV 病毒衣壳"},{"key":"C","text":"使用患者体内无中和抗体的病毒衣壳"},{"key":"D","text":"高驱动活性的启动子"}],"answer":"ABCD","explanation":"降低rAAV免疫原性的策略包括：使用高效治疗基因减少用量、靶向衣壳减少脱靶免疫反应、选择无预存抗体的血清型、使用强启动子降低所需病毒剂量。"}]}];
const STORE_KEY='neuroscience-quiz-v1';
const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
const state={chapter:0,index:0,mode:'chapter',shuffle:false,answers:saved.answers||{},stars:saved.stars||{}};
const all=BANK.flatMap((c,ci)=>c.questions.map(q=>({...q,chapterIndex:ci,chapterTitle:c.title})));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(STORE_KEY,JSON.stringify({answers:state.answers,stars:state.stars}));}
function questionSet(){let arr=state.mode==='wrong'?all.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct):state.mode==='star'?all.filter(q=>state.stars[q.id]):BANK[state.chapter].questions.map(q=>({...q,chapterIndex:state.chapter,chapterTitle:BANK[state.chapter].title}));return state.shuffle?[...arr].sort((a,b)=>((a.id*9301+49297)%233280)-((b.id*9301+49297)%233280)):arr;}
function renderChapters(){const nav=$('#chapters');nav.innerHTML=BANK.map((c,i)=>`<button class="chapter-btn ${state.mode==='chapter'&&i===state.chapter?'active':''}" data-i="${i}">${i+1}. ${esc(c.title.replace(/（\d+）/,''))}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.mode='chapter';state.chapter=+b.dataset.i;state.index=0;render();});}
function normalize(keys){return [...keys].sort().join('');}
function render(){renderChapters();const set=questionSet();if(!set.length){$('#workspace').innerHTML=`<div class="empty"><h2>这里还没有题目</h2><p>${state.mode==='wrong'?'答错的题目会自动收录到这里。':'点击题目右上角的收藏按钮即可添加。'}</p></div>`;updateHeader(set);return;}state.index=Math.max(0,Math.min(state.index,set.length-1));const q=set[state.index],record=state.answers[q.id],chosen=record?record.selected:[];const multi=q.type==='多选题';
$('#workspace').innerHTML=`<div class="eyebrow">${esc(q.chapterTitle)}</div><h1>第 ${state.index+1} 题</h1><div class="meta"><span>${q.type}</span><span>${esc(q.section)}</span><span>本组共 ${set.length} 题</span><button id="star" title="收藏本题" style="border:0;background:transparent;color:${state.stars[q.id]?'#b56019':'#64706b'};font-size:18px">${state.stars[q.id]?'★':'☆'}</button></div><div class="question">${esc(q.prompt)}</div><div class="options">${q.options.map(o=>{let cls=chosen.includes(o.key)?'selected':'';if(record){if(q.answer.includes(o.key))cls='correct';else if(chosen.includes(o.key))cls='wrong';}return `<button class="option ${cls}" data-key="${o.key}" ${record?'disabled':''}><span class="key">${o.key}</span><span>${esc(o.text)}</span></button>`}).join('')}</div><div class="submit-row"><span class="hint">${multi?'多选题：选全后提交':'选择答案后立即判断'}</span><button class="primary" id="submit" ${chosen.length?'':'disabled'}>${record?'下一题':'提交答案'}</button></div><div class="result ${record?'show':''} ${record&&!record.correct?'wrong':''}" id="result">${record?resultHtml(q,record.correct):''}</div><div class="bottom-nav"><button class="secondary" id="prev" ${state.index===0?'disabled':''}>上一题</button><button class="secondary" id="next" ${state.index===set.length-1?'disabled':''}>下一题</button></div>`;
let pending=[...chosen];$('#star').onclick=()=>{state.stars[q.id]=!state.stars[q.id];persist();render();};document.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>{if(record)return;const key=btn.dataset.key;if(multi){pending=pending.includes(key)?pending.filter(k=>k!==key):[...pending,key];}else pending=[key];document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',pending.includes(x.dataset.key)));$('#submit').disabled=!pending.length;if(!multi)submit(q,pending);});$('#submit').onclick=()=>record?move(1):submit(q,pending);$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);updateHeader(set);}
function resultHtml(q,ok){return `<div class="result-title">${ok?'回答正确':'回答错误'}</div><div class="answer-line">正确答案：${q.answer.split('').join('、')}</div><div>${esc(q.explanation||'暂无解析')}</div>`;}
function submit(q,pending){if(!pending.length)return;const correct=normalize(pending)===normalize(q.answer.split(''));state.answers[q.id]={selected:[...pending],correct};persist();render();}
function move(n){state.index+=n;render();window.scrollTo({top:0,behavior:'smooth'});}
function updateHeader(set){const done=set.filter(q=>state.answers[q.id]).length,correct=set.filter(q=>state.answers[q.id]?.correct).length;$('#progressText').textContent=`已完成 ${done} / ${set.length}`;$('#accuracyText').textContent=done?`正确率 ${Math.round(correct/done*100)}%`:'正确率 --';$('#progressBar').style.width=`${set.length?done/set.length*100:0}%`;}
$('#wrongMode').onclick=()=>{state.mode='wrong';state.index=0;render();};$('#starMode').onclick=()=>{state.mode='star';state.index=0;render();};$('#shuffle').onclick=()=>{state.shuffle=!state.shuffle;state.index=0;$('#shuffle').style.background=state.shuffle?'#e6f1ec':'#fff';render();};
$('#stats').onclick=()=>{const done=all.filter(q=>state.answers[q.id]).length,correct=all.filter(q=>state.answers[q.id]?.correct).length,wrong=done-correct;$('#statsBody').innerHTML=`<div class="stats"><div class="stat"><strong>${done}</strong>已完成</div><div class="stat"><strong>${done?Math.round(correct/done*100):0}%</strong>正确率</div><div class="stat"><strong>${wrong}</strong>当前错题</div></div><p style="color:#64706b;margin:18px 0 0">作答记录保存在此浏览器中。重新答对不会自动移出错题集，便于持续复习。</p><button class="secondary" id="reset" style="margin-top:18px;color:#b13b35">清空全部记录</button>`;$('#reset').onclick=()=>{if(confirm('确定清空全部作答记录和收藏吗？')){localStorage.removeItem(STORE_KEY);location.reload();}};$('#statsDialog').showModal();};$('#closeStats').onclick=()=>$('#statsDialog').close();
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});render();
</script>
</body>
</html>
