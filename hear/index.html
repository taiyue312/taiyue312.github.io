<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143d38">
  <title>英语听力音频库 · Taiyue</title>
  <style>
    :root { --ink:#172522; --muted:#68736f; --paper:#f3f1e9; --line:rgba(23,37,34,.13); --green:#1d5b50; --orange:#db7948; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 90% 0,rgba(29,91,80,.17),transparent 28rem),radial-gradient(circle at 5% 8%,rgba(219,121,72,.14),transparent 24rem),var(--paper); font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .shell { width:min(920px,calc(100% - 28px)); margin:0 auto; }
    nav { height:68px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    nav a { color:var(--muted); text-decoration:none; font-size:14px; font-weight:750; }
    nav a:hover { color:var(--green); }
    .brand { color:var(--ink); font-weight:900; letter-spacing:-.02em; }
    header { padding:64px 0 36px; }
    .eyebrow { color:var(--green); font-size:12px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:12px 0 14px; font:500 clamp(42px,8vw,70px)/1 Georgia,serif; letter-spacing:-.05em; }
    header p { max-width:620px; margin:0; color:var(--muted); line-height:1.7; }
    .player { position:sticky; top:12px; z-index:5; display:grid; grid-template-columns:1fr auto; gap:18px; align-items:center; margin:10px 0 25px; padding:17px 18px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.86); box-shadow:0 18px 45px rgba(21,41,36,.1); backdrop-filter:blur(14px); }
    .now { min-width:0; }
    .now small { display:block; margin-bottom:5px; color:var(--muted); font-size:10px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .now strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    audio { width:min(430px,48vw); height:42px; }
    .list { display:grid; grid-template-columns:repeat(2,1fr); gap:11px; padding-bottom:70px; }
    .track { display:grid; grid-template-columns:44px 1fr 34px; gap:13px; align-items:center; min-height:78px; padding:13px 15px; border:1px solid var(--line); border-radius:15px; background:rgba(255,255,255,.72); cursor:pointer; text-align:left; color:var(--ink); transition:.16s ease; }
    .track:hover { transform:translateY(-2px); border-color:rgba(29,91,80,.38); background:#fff; }
    .track.active { border-color:var(--green); background:#dcebe5; }
    .num { color:#929995; font:700 12px ui-monospace,Consolas,monospace; }
    .track strong { display:block; margin-bottom:3px; }
    .track span.meta { color:var(--muted); font-size:12px; }
    .play { display:grid; place-items:center; width:31px; height:31px; border-radius:50%; background:#e0ece7; color:var(--green); font-size:11px; }
    .active .play { background:var(--green); color:#fff; }
    @media(max-width:680px){ header{padding-top:42px}.player{grid-template-columns:1fr;position:static}audio{width:100%}.list{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <nav class="shell"><a class="brand" href="../">Taiyue · Study Atlas</a><a href="../">← 返回主页</a></nav>
  <main class="shell">
    <header><div class="eyebrow">Audio archive</div><h1>英语听力音频库</h1><p>集中播放原有的 12 组英语音频。选择任一章节开始，播放结束后自动进入下一组。</p></header>
    <section class="player" aria-label="音频播放器">
      <div class="now"><small>Now playing</small><strong id="nowTitle">请选择一个章节</strong></div>
      <audio id="audio" controls preload="metadata"></audio>
    </section>
    <section class="list" id="list" aria-label="音频章节"></section>
  </main>
  <script>
    const tracks = Array.from({ length: 12 }, (_, index) => ({ number:index + 1, file:`${index + 1}.mp3`, title:`听力章节 ${String(index + 1).padStart(2,'0')}` }));
    const list = document.querySelector('#list');
    const audio = document.querySelector('#audio');
    const nowTitle = document.querySelector('#nowTitle');
    let current = -1;

    function selectTrack(index, autoplay = true) {
      current = index;
      const track = tracks[index];
      audio.src = track.file;
      nowTitle.textContent = track.title;
      document.querySelectorAll('.track').forEach((button, i) => button.classList.toggle('active', i === index));
      if (autoplay) audio.play().catch(() => {});
    }

    tracks.forEach((track, index) => {
      const button = document.createElement('button');
      button.className = 'track';
      button.type = 'button';
      button.innerHTML = `<span class="num">${String(track.number).padStart(2,'0')}</span><span><strong>${track.title}</strong><span class="meta">MP3 音频</span></span><span class="play">▶</span>`;
      button.addEventListener('click', () => selectTrack(index));
      list.append(button);
    });
    audio.addEventListener('ended', () => { if (current >= 0 && current < tracks.length - 1) selectTrack(current + 1); });
  </script>
</body>
</html>
