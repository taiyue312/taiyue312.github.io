<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文句子朗读练习</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #687086;
      --paper: #f7f5ef;
      --card: rgba(255,255,255,.86);
      --line: #dedbd1;
      --accent: #215b4f;
      --accent-soft: #dcece6;
      --warm: #d9834f;
      --shadow: 0 18px 55px rgba(31, 44, 54, .10);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 2%, rgba(217,131,79,.16), transparent 27rem),
        radial-gradient(circle at 92% 10%, rgba(33,91,79,.14), transparent 30rem),
        var(--paper);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 52px 0 80px; }
    header { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: end; margin-bottom: 26px; }
    .eyebrow { color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 8px 0 10px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(36px, 6vw, 66px); line-height: .98; letter-spacing: -.035em; }
    .lede { margin: 0; color: var(--muted); font-size: 16px; }
    .count { min-width: 120px; padding: 15px 18px; border-left: 3px solid var(--warm); color: var(--muted); }
    .count strong { display: block; color: var(--ink); font-family: Georgia, serif; font-size: 30px; }

    .controls {
      position: sticky; top: 12px; z-index: 10;
      display: grid; grid-template-columns: minmax(180px, 1fr) minmax(190px, 280px) 180px auto;
      gap: 12px; align-items: end; padding: 16px;
      border: 1px solid rgba(222,219,209,.9); border-radius: 18px;
      background: rgba(250,249,245,.9); box-shadow: var(--shadow); backdrop-filter: blur(16px);
    }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    input, select, button { font: inherit; }
    input[type="search"], select {
      width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 11px;
      background: #fff; color: var(--ink); padding: 0 12px; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(33,91,79,.12); }
    .range-wrap { display: grid; grid-template-columns: 1fr 42px; gap: 8px; align-items: center; height: 44px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    output { color: var(--ink); font-weight: 800; text-align: right; }
    .stop {
      height: 44px; border: 0; border-radius: 11px; padding: 0 18px; cursor: pointer;
      background: var(--ink); color: #fff; font-weight: 800;
    }
    .stop:hover { background: #29364f; }

    .status { min-height: 24px; margin: 20px 3px 12px; color: var(--muted); font-size: 14px; }
    .status.speaking { color: var(--accent); font-weight: 700; }
    .list { display: grid; gap: 10px; }
    .sentence {
      width: 100%; display: grid; grid-template-columns: 50px 1fr 36px; gap: 16px; align-items: center;
      border: 1px solid var(--line); border-radius: 15px; padding: 17px 18px; cursor: pointer;
      background: var(--card); color: var(--ink); text-align: left; box-shadow: 0 5px 18px rgba(42,48,56,.035);
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .sentence:hover { transform: translateY(-2px); border-color: #aebfb8; background: #fff; }
    .sentence:focus-visible { outline: 3px solid rgba(33,91,79,.25); outline-offset: 2px; }
    .sentence.active { border-color: var(--accent); background: var(--accent-soft); }
    .number { color: #969b9f; font: 700 13px/1 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .content { display: grid; gap: 7px; }
    .term-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .term { color: var(--accent); font-size: 13px; font-weight: 850; letter-spacing: .025em; }
    .audio-tag { padding: 3px 7px; border-radius: 999px; background: #dcece6; color: var(--accent); font: 750 10px/1 ui-monospace, Consolas, monospace; letter-spacing: .04em; text-transform: uppercase; }
    .audio-tag.fallback { background: #ece9e1; color: #74766f; }
    .text { font-family: Georgia, "Times New Roman", serif; font-size: clamp(17px, 2vw, 20px); line-height: 1.45; }
    .translation { color: var(--muted); font-size: 14px; line-height: 1.55; }
    .play { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
    .active .play { background: var(--accent); color: #fff; }
    .empty { padding: 56px 20px; text-align: center; color: var(--muted); }
    footer { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }

    @media (max-width: 780px) {
      .shell { width: min(100% - 20px, 1080px); padding-top: 30px; }
      header { grid-template-columns: 1fr; }
      .count { display: none; }
      .controls { position: static; grid-template-columns: 1fr 1fr; }
      .search-field { grid-column: 1 / -1; }
      .sentence { grid-template-columns: 36px 1fr 32px; gap: 10px; padding: 15px 12px; }
    }
    @media (max-width: 500px) { .controls { grid-template-columns: 1fr; } .search-field { grid-column: auto; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Biology · Listening Practice</div>
        <h1>Click. Listen.<br>Remember.</h1>
        <p class="lede">点击任意英文句子即可朗读；再次点击可重新播放。</p>
      </div>
      <div class="count"><strong id="visibleCount">0</strong>当前句子</div>
    </header>

    <section class="controls" aria-label="朗读控制">
      <label class="search-field">搜索句子
        <input id="search" type="search" placeholder="输入关键词，例如 DNA、cell…" autocomplete="off">
      </label>
      <label>备用系统语音
        <select id="voice" aria-label="选择英文语音"><option>正在读取系统语音…</option></select>
      </label>
      <label>语速
        <span class="range-wrap"><input id="rate" type="range" min="0.6" max="1.4" step="0.05" value="0.9"><output id="rateValue">0.90×</output></span>
      </label>
      <button id="stop" class="stop" type="button">停止朗读</button>
    </section>

    <div id="status" class="status" role="status">选择一个句子开始练习。</div>
    <section id="list" class="list" aria-label="英文句子列表"></section>
    <footer>语音由浏览器的 Speech Synthesis 功能提供，建议使用 Microsoft Edge 或 Google Chrome。</footer>
  </main>

  <script>
    const entries = [{"term":"biology","english":"Biology becomes most powerful when it explains life at both molecular and organismal levels.","chinese":"当生物学能够同时解释分子水平和生物体水平的生命现象时，它最有解释力。","audioStart":0.07,"audioEnd":5.825,"audioFile":"audio/part-1.mp3"},{"term":"molecular biology","english":"Molecular biology asks how DNA, RNA, and proteins cooperate to control cellular activity.","chinese":"分子生物学关注DNA、RNA和蛋白质如何协同控制细胞活动。","audioStart":6.145,"audioEnd":12.462,"audioFile":"audio/part-1.mp3"},{"term":"cell biology","english":"Cell biology helps us understand why the same signal can trigger different responses in different cells.","chinese":"细胞生物学帮助我们理解为什么同一种信号会在不同细胞中引发不同反应。","audioStart":12.782,"audioEnd":18.75,"audioFile":"audio/part-1.mp3"},{"term":"genetics","english":"Genetics can explain why a mutation is harmless in one context but pathogenic in another.","chinese":"遗传学可以解释为什么同一个突变在某些背景下无害，而在另一些背景下致病。","audioStart":19.07,"audioEnd":24.7,"audioFile":"audio/part-1.mp3"},{"term":"biochemistry","english":"Biochemistry connects the structure of molecules with the reactions that keep cells alive.","chinese":"生物化学把分子结构与维持细胞生命的化学反应联系起来。","audioStart":25.02,"audioEnd":30.187,"audioFile":"audio/part-1.mp3"},{"term":"physiology","english":"Physiology studies how organs maintain stable function while the environment keeps changing.","chinese":"生理学研究器官如何在环境不断变化时维持稳定功能。","audioStart":30.507,"audioEnd":35.725,"audioFile":"audio/part-1.mp3"},{"term":"immunology","english":"Immunology is not only about defense against pathogens but also about tolerance to self.","chinese":"免疫学不仅研究抵御病原体，也研究机体如何对自身保持耐受。","audioStart":36.045,"audioEnd":41.587,"audioFile":"audio/part-1.mp3"},{"term":"microbiology","english":"Microbiology shows that microorganisms can be harmful pathogens or essential partners of the host.","chinese":"微生物学表明，微生物既可以是有害病原体，也可以是宿主必需的伙伴。","audioStart":41.907,"audioEnd":48.112,"audioFile":"audio/part-1.mp3"},{"term":"developmental biology","english":"Developmental biology explains how a single fertilized egg gives rise to many specialized cell types.","chinese":"发育生物学解释一个受精卵如何产生多种特化细胞类型。","audioStart":48.445,"audioEnd":54.475,"audioFile":"audio/part-1.mp3"},{"term":"evolution","english":"Evolution provides a framework for understanding why biological systems are both efficient and imperfect.","chinese":"进化为理解生物系统为何既高效又不完美提供了框架。","audioStart":54.795,"audioEnd":61.025,"audioFile":"audio/part-1.mp3"},{"term":"organism","english":"An organism survives by coordinating molecular events, cellular behavior, and organ function.","chinese":"生物体通过协调分子事件、细胞行为和器官功能来维持生存。","audioStart":61.345,"audioEnd":67.575,"audioFile":"audio/part-1.mp3"},{"term":"cell","english":"A cell is not a simple bag of molecules but a highly organized living system.","chinese":"细胞不是简单的分子袋，而是高度有序的生命系统。","audioStart":67.895,"audioEnd":72.762,"audioFile":"audio/part-1.mp3"},{"term":"tissue","english":"A tissue gains its function from both its cell types and the way those cells are arranged.","chinese":"组织的功能既来自其细胞类型，也来自这些细胞的排列方式。","audioStart":73.082,"audioEnd":77.9,"audioFile":"audio/part-1.mp3"},{"term":"organ","english":"An organ can fail even when most of its cells are alive, because coordination has been lost.","chinese":"即使大多数细胞仍然存活，器官也可能因协调失衡而发生功能衰竭。","audioStart":78.22,"audioEnd":83.762,"audioFile":"audio/part-1.mp3"},{"term":"nucleus","english":"The nucleus stores genetic information and regulates which genes are accessible for expression.","chinese":"细胞核储存遗传信息，并调控哪些基因可以被表达。","audioStart":84.082,"audioEnd":89.625,"audioFile":"audio/part-1.mp3"},{"term":"cytoplasm","english":"Many signaling events occur in the cytoplasm before they influence gene expression in the nucleus.","chinese":"许多信号事件先发生在细胞质中，然后才影响细胞核内的基因表达。","audioStart":89.945,"audioEnd":95.825,"audioFile":"audio/part-1.mp3"},{"term":"membrane","english":"The membrane separates the cell from its environment while allowing selective communication.","chinese":"细胞膜将细胞与外界环境分隔开，同时允许选择性交流。","audioStart":96.132,"audioEnd":101.025,"audioFile":"audio/part-1.mp3"},{"term":"organelle","english":"Each organelle creates a specialized compartment for reactions that would otherwise interfere with one another.","chinese":"每种细胞器都提供一个特化空间，使原本可能相互干扰的反应得以进行。","audioStart":101.345,"audioEnd":107.325,"audioFile":"audio/part-1.mp3"},{"term":"mitochondrion","english":"A mitochondrion produces energy but also sends stress signals when cellular metabolism is disturbed.","chinese":"线粒体产生能量，但在细胞代谢紊乱时也会发出应激信号。","audioStart":107.645,"audioEnd":113.637,"audioFile":"audio/part-1.mp3"},{"term":"ribosome","english":"The ribosome translates genetic information into proteins with remarkable speed and accuracy.","chinese":"核糖体以惊人的速度和准确性把遗传信息翻译成蛋白质。","audioStart":113.945,"audioEnd":119.8,"audioFile":"audio/part-1.mp3"},{"term":"endoplasmic reticulum, ER","english":"The endoplasmic reticulum, ER, is central to protein folding and calcium storage.","chinese":"内质网是蛋白质折叠和钙储存的关键场所。","audioStart":120.095,"audioEnd":125.05,"audioFile":"audio/part-1.mp3"},{"term":"Golgi apparatus","english":"The Golgi apparatus modifies and sorts proteins before they are sent to their final destinations.","chinese":"高尔基体在蛋白质被送往最终位置之前对其进行修饰和分选。","audioStart":125.357,"audioEnd":131.275,"audioFile":"audio/part-1.mp3"},{"term":"lysosome","english":"The lysosome degrades damaged components and helps recycle cellular materials.","chinese":"溶酶体降解受损成分，并帮助回收细胞材料。","audioStart":131.582,"audioEnd":136.587,"audioFile":"audio/part-1.mp3"},{"term":"chromosome","english":"A chromosome packages long DNA molecules so that genetic information can be copied and inherited.","chinese":"染色体包装长DNA分子，使遗传信息能够被复制和遗传。","audioStart":136.907,"audioEnd":142.925,"audioFile":"audio/part-1.mp3"},{"term":"DNA","english":"DNA stores biological instructions, but those instructions matter only when cells can read them.","chinese":"DNA储存生物学指令，但只有当细胞能够读取这些指令时，它们才有意义。","audioStart":143.245,"audioEnd":149.262,"audioFile":"audio/part-1.mp3"},{"term":"RNA","english":"RNA can act as a messenger, a regulator, or even a catalytic molecule.","chinese":"RNA既可以作为信使，也可以作为调控分子，甚至可以作为催化分子。","audioStart":149.582,"audioEnd":154.45,"audioFile":"audio/part-1.mp3"},{"term":"protein","english":"A protein often performs its function by changing shape or binding to another molecule.","chinese":"蛋白质常常通过改变构象或结合其他分子来发挥功能。","audioStart":154.757,"audioEnd":159.7,"audioFile":"audio/part-1.mp3"},{"term":"enzyme","english":"An enzyme accelerates a reaction without being consumed by the reaction itself.","chinese":"酶能加速反应，而自身不会在反应中被消耗。","audioStart":160.02,"audioEnd":164.962,"audioFile":"audio/part-1.mp3"},{"term":"gene","english":"A gene is a functional DNA sequence whose activity depends on regulatory context.","chinese":"基因是具有功能的DNA序列，其活性取决于调控背景。","audioStart":165.282,"audioEnd":170.512,"audioFile":"audio/part-1.mp3"},{"term":"genome","english":"The genome contains not only protein-coding genes but also many regulatory regions.","chinese":"基因组不仅包含蛋白编码基因，也包含大量调控区域。","audioStart":170.832,"audioEnd":176.025,"audioFile":"audio/part-1.mp3"},{"term":"transcriptome","english":"The transcriptome changes rapidly when a cell responds to stress or differentiation signals.","chinese":"当细胞应对应激或分化信号时，转录组会迅速变化。","audioStart":176.332,"audioEnd":181.762,"audioFile":"audio/part-1.mp3"},{"term":"proteome","english":"The proteome reflects what proteins are actually present in a cell at a given time.","chinese":"蛋白质组反映某一时刻细胞中实际存在的蛋白质。","audioStart":182.07,"audioEnd":186.837,"audioFile":"audio/part-1.mp3"},{"term":"metabolome","english":"The metabolome can reveal cellular states that are not obvious from gene expression alone.","chinese":"代谢组能够揭示单靠基因表达难以看出的细胞状态。","audioStart":187.157,"audioEnd":192.275,"audioFile":"audio/part-1.mp3"},{"term":"pathway","english":"A pathway describes a chain of molecular events that leads to a biological outcome.","chinese":"通路描述一系列导致某种生物学结果的分子事件。","audioStart":192.595,"audioEnd":197.612,"audioFile":"audio/part-1.mp3"},{"term":"signaling pathway","english":"A signaling pathway converts an external cue into a specific cellular response.","chinese":"信号通路把外部刺激转化为特定的细胞反应。","audioStart":197.92,"audioEnd":202.8,"audioFile":"audio/part-1.mp3"},{"term":"receptor","english":"A receptor allows a cell to sense molecules outside or inside the cell.","chinese":"受体使细胞能够感知细胞外或细胞内的分子。","audioStart":203.12,"audioEnd":207.687,"audioFile":"audio/part-1.mp3"},{"term":"ligand","english":"A ligand can activate, inhibit, or stabilize a receptor depending on how it binds.","chinese":"配体可以根据结合方式激活、抑制或稳定受体。","audioStart":208.007,"audioEnd":213.637,"audioFile":"audio/part-1.mp3"},{"term":"transcription","english":"Transcription is the first step by which genetic information is converted into RNA.","chinese":"转录是遗传信息转化为RNA的第一步。","audioStart":213.957,"audioEnd":219.237,"audioFile":"audio/part-1.mp3"},{"term":"translation","english":"Translation turns an mRNA sequence into a chain of amino acids.","chinese":"翻译把mRNA序列转化为氨基酸链。","audioStart":219.557,"audioEnd":224.162,"audioFile":"audio/part-1.mp3"},{"term":"replication","english":"Replication must be accurate because errors can become permanent mutations.","chinese":"复制必须准确，因为错误可能变成永久性突变。","audioStart":224.482,"audioEnd":228.837,"audioFile":"audio/part-1.mp3"},{"term":"mutation","english":"A mutation can be neutral, harmful, or beneficial depending on its biological context.","chinese":"突变可能是中性的、有害的或有益的，这取决于其生物学背景。","audioStart":229.157,"audioEnd":234.95,"audioFile":"audio/part-1.mp3"},{"term":"variant","english":"A variant is interpreted by asking whether it changes function, expression, or disease risk.","chinese":"判断变异体时，需要看它是否改变功能、表达或疾病风险。","audioStart":235.27,"audioEnd":241.387,"audioFile":"audio/part-1.mp3"},{"term":"phenotype","english":"A phenotype is the observable result of genetic information interacting with the environment.","chinese":"表型是遗传信息与环境相互作用后产生的可观察结果。","audioStart":241.707,"audioEnd":247.062,"audioFile":"audio/part-1.mp3"},{"term":"genotype","english":"The genotype gives the genetic blueprint, but it does not always predict the final phenotype.","chinese":"基因型提供遗传蓝图，但并不总能完全预测最终表型。","audioStart":247.357,"audioEnd":253.012,"audioFile":"audio/part-1.mp3"},{"term":"expression","english":"Gene expression can increase, decrease, or shift between cell types during disease.","chinese":"在疾病过程中，基因表达可能升高、降低，或在不同细胞类型之间发生转移。","audioStart":253.332,"audioEnd":258.412,"audioFile":"audio/part-1.mp3"},{"term":"regulation","english":"Regulation prevents biological processes from happening at the wrong time or place.","chinese":"调控防止生物过程在错误的时间或位置发生。","audioStart":258.745,"audioEnd":263.775,"audioFile":"audio/part-1.mp3"},{"term":"homeostasis","english":"Homeostasis allows living systems to remain stable without being static.","chinese":"稳态使生命系统能够保持稳定，但并不意味着一成不变。","audioStart":264.095,"audioEnd":268.825,"audioFile":"audio/part-1.mp3"},{"term":"apoptosis","english":"Apoptosis removes unwanted cells without causing strong inflammation.","chinese":"细胞凋亡清除不需要的细胞，同时通常不会引发强烈炎症。","audioStart":269.107,"audioEnd":273.7,"audioFile":"audio/part-1.mp3"},{"term":"necrosis","english":"Necrosis often releases cellular contents and can trigger inflammatory responses.","chinese":"坏死常常释放细胞内容物，并可能引发炎症反应。","audioStart":274.02,"audioEnd":279.25,"audioFile":"audio/part-1.mp3"},{"term":"autophagy","english":"Autophagy helps cells survive starvation by recycling their own components.","chinese":"自噬通过回收细胞自身成分帮助细胞在饥饿状态下存活。","audioStart":279.532,"audioEnd":284.162,"audioFile":"audio/part-1.mp3"},{"term":"proliferation","english":"Proliferation must be tightly controlled because excessive cell growth can lead to cancer.","chinese":"增殖必须受到严格控制，因为过度细胞生长可能导致癌症。","audioStart":284.482,"audioEnd":289.387,"audioFile":"audio/part-1.mp3"},{"term":"differentiation","english":"Differentiation gives cells specialized identities while usually reducing their developmental flexibility.","chinese":"分化赋予细胞特化身份，同时通常降低其发育可塑性。","audioStart":289.72,"audioEnd":296.0,"audioFile":"audio/part-1.mp3"},{"term":"senescence","english":"Senescence can stop damaged cells from dividing but may also promote chronic inflammation.","chinese":"衰老可以阻止受损细胞继续分裂，但也可能促进慢性炎症。","audioStart":296.307,"audioEnd":301.575,"audioFile":"audio/part-1.mp3"},{"term":"stem cell","english":"A stem cell can self-renew and produce more specialized daughter cells.","chinese":"干细胞能够自我更新，并产生更特化的子代细胞。","audioStart":301.857,"audioEnd":306.025,"audioFile":"audio/part-1.mp3"},{"term":"pluripotency","english":"Pluripotency means that a cell can generate cell types from all three germ layers.","chinese":"多能性意味着细胞能够产生来自三个胚层的细胞类型。","audioStart":306.332,"audioEnd":310.95,"audioFile":"audio/part-1.mp3"},{"term":"lineage","english":"A lineage records the developmental history of a cell and its descendants.","chinese":"细胞谱系记录一个细胞及其后代的发育历史。","audioStart":311.27,"audioEnd":315.662,"audioFile":"audio/part-1.mp3"},{"term":"assay","english":"An assay is useful only when it measures the biological process it claims to measure.","chinese":"实验检测只有在真正测量其声称的生物过程时才有意义。","audioStart":315.982,"audioEnd":321.087,"audioFile":"audio/part-1.mp3"},{"term":"sample","english":"A sample must be collected and stored carefully to avoid misleading experimental results.","chinese":"样本必须被谨慎采集和保存，以避免产生误导性的实验结果。","audioStart":321.37,"audioEnd":326.725,"audioFile":"audio/part-1.mp3"},{"term":"control group","english":"The control group provides the baseline needed to interpret an experimental effect.","chinese":"对照组提供了解释实验效应所需的基线。","audioStart":327.032,"audioEnd":331.875,"audioFile":"audio/part-1.mp3"},{"term":"experimental group","english":"The experimental group receives the treatment or condition being tested.","chinese":"实验组接受正在被测试的处理或条件。","audioStart":332.17,"audioEnd":336.25,"audioFile":"audio/part-1.mp3"},{"term":"in vitro","english":"In vitro experiments allow precise control but cannot fully reproduce a living organism.","chinese":"体外实验便于精确控制，但无法完全再现活体生物。","audioStart":336.57,"audioEnd":342.025,"audioFile":"audio/part-1.mp3"},{"term":"in vivo","english":"In vivo studies show how a process behaves within the complexity of a living body.","chinese":"体内研究显示某一过程在活体复杂环境中如何表现。","audioStart":342.345,"audioEnd":347.375,"audioFile":"audio/part-1.mp3"},{"term":"ex vivo","english":"Ex vivo analysis preserves some tissue context while allowing manipulation outside the body.","chinese":"离体分析保留部分组织背景，同时允许在体外进行操作。","audioStart":347.695,"audioEnd":353.337,"audioFile":"audio/part-1.mp3"},{"term":"knockout","english":"A knockout model tests what happens when a gene is completely removed or disabled.","chinese":"敲除模型用于测试一个基因被完全去除或失活后会发生什么。","audioStart":353.657,"audioEnd":358.662,"audioFile":"audio/part-1.mp3"},{"term":"knockdown","english":"Knockdown reduces gene expression without necessarily eliminating the gene completely.","chinese":"敲低降低基因表达，但不一定完全消除该基因。","audioStart":358.982,"audioEnd":364.275,"audioFile":"audio/part-1.mp3"},{"term":"overexpression","english":"Overexpression can reveal what happens when a protein is produced above its normal level.","chinese":"过表达可以揭示蛋白质高于正常水平产生时会发生什么。","audioStart":364.595,"audioEnd":369.675,"audioFile":"audio/part-1.mp3"},{"term":"wild type, WT","english":"Wild type, WT, usually refers to the standard form used for comparison with mutants.","chinese":"野生型通常指用于与突变型比较的标准形式。","audioStart":369.995,"audioEnd":375.3,"audioFile":"audio/part-1.mp3"},{"term":"mutant","english":"A mutant is valuable experimentally because it can expose the function of the altered gene.","chinese":"突变型在实验上很有价值，因为它能揭示被改变基因的功能。","audioStart":375.62,"audioEnd":380.725,"audioFile":"audio/part-1.mp3"},{"term":"statistical significance","english":"Statistical significance suggests that an observed difference is unlikely to be due to chance alone.","chinese":"统计学显著性表明观察到的差异不太可能仅由偶然因素造成。","audioStart":381.032,"audioEnd":386.812,"audioFile":"audio/part-1.mp3"},{"term":"mechanism","english":"A mechanism explains not just what happened, but how and why it happened.","chinese":"机制解释的不只是发生了什么，还包括它如何发生以及为什么发生。","audioStart":387.132,"audioEnd":391.562,"audioFile":"audio/part-1.mp3"},{"term":"model organism","english":"A model organism is chosen because its biology can answer questions relevant to other species.","chinese":"模式生物之所以被选择，是因为其生物学特征可以回答与其他物种相关的问题。","audioStart":391.87,"audioEnd":397.487,"audioFile":"audio/part-1.mp3"},{"term":"metabolism","english":"Metabolism is the chemical economy that determines how cells obtain and spend energy.","chinese":"代谢是决定细胞如何获取和消耗能量的化学经济系统。","audioStart":397.795,"audioEnd":403.087,"audioFile":"audio/part-1.mp3"},{"term":"metabolic pathway","english":"A metabolic pathway can become a therapeutic target when disease cells depend on it more than normal cells.","chinese":"当疾病细胞比正常细胞更依赖某条代谢通路时，该通路可能成为治疗靶点。","audioStart":403.407,"audioEnd":409.287,"audioFile":"audio/part-1.mp3"},{"term":"catabolism","english":"Catabolism breaks large molecules into smaller units and releases usable energy.","chinese":"分解代谢把大分子分解为小分子，并释放可利用的能量。","audioStart":409.607,"audioEnd":414.875,"audioFile":"audio/part-1.mp3"},{"term":"anabolism","english":"Anabolism consumes energy to build the molecules required for growth and repair.","chinese":"合成代谢消耗能量来构建生长和修复所需的分子。","audioStart":415.195,"audioEnd":420.212,"audioFile":"audio/part-1.mp3"},{"term":"glucose metabolism","english":"Glucose metabolism is frequently rewired in cancer, diabetes, and immune activation.","chinese":"葡萄糖代谢在癌症、糖尿病和免疫激活中常常被重塑。","audioStart":420.532,"audioEnd":426.337,"audioFile":"audio/part-1.mp3"},{"term":"lipid metabolism","english":"Lipid metabolism affects membrane composition, hormone synthesis, and inflammatory signaling.","chinese":"脂质代谢影响膜组成、激素合成和炎症信号。","audioStart":426.657,"audioEnd":432.412,"audioFile":"audio/part-1.mp3"},{"term":"amino acid metabolism","english":"Amino acid metabolism supplies building blocks but also regulates signaling pathways such as mTOR.","chinese":"氨基酸代谢提供合成原料，同时也调控mTOR等信号通路。","audioStart":432.72,"audioEnd":439.175,"audioFile":"audio/part-1.mp3"},{"term":"energy metabolism","english":"Energy metabolism changes quickly when cells switch from rest to proliferation.","chinese":"当细胞从静息状态转向增殖时，能量代谢会迅速改变。","audioStart":439.495,"audioEnd":444.25,"audioFile":"audio/part-1.mp3"},{"term":"glycolysis","english":"Glycolysis provides ATP rapidly and also supplies intermediates for biosynthesis.","chinese":"糖酵解能快速提供ATP，也能为生物合成提供中间产物。","audioStart":444.57,"audioEnd":450.225,"audioFile":"audio/part-1.mp3"},{"term":"gluconeogenesis","english":"Gluconeogenesis maintains blood glucose during fasting but becomes excessive in diabetes.","chinese":"糖异生在禁食时维持血糖，但在糖尿病中可能过度增强。","audioStart":450.545,"audioEnd":456.287,"audioFile":"audio/part-1.mp3"},{"term":"tricarboxylic acid cycle, TCA cycle","english":"The tricarboxylic acid cycle, TCA cycle, links nutrient breakdown to mitochondrial energy production.","chinese":"三羧酸循环把营养物质分解与线粒体能量产生联系起来。","audioStart":456.595,"audioEnd":463.5,"audioFile":"audio/part-1.mp3"},{"term":"Krebs cycle","english":"The Krebs cycle generates reducing equivalents that feed the electron transport chain.","chinese":"克雷布斯循环产生还原当量，为电子传递链提供电子。","audioStart":463.807,"audioEnd":468.687,"audioFile":"audio/part-1.mp3"},{"term":"oxidative phosphorylation, OXPHOS","english":"Oxidative phosphorylation, OXPHOS, produces large amounts of ATP but depends on functional mitochondria.","chinese":"氧化磷酸化能产生大量ATP，但依赖功能正常的线粒体。","audioStart":469.007,"audioEnd":476.312,"audioFile":"audio/part-1.mp3"},{"term":"electron transport chain","english":"The electron transport chain uses electron flow to drive proton pumping across the mitochondrial membrane.","chinese":"电子传递链利用电子流推动质子跨线粒体膜泵出。","audioStart":476.607,"audioEnd":482.587,"audioFile":"audio/part-1.mp3"},{"term":"ATP","english":"ATP is often described as the energy currency because many cellular reactions spend it directly.","chinese":"ATP常被称为能量货币，因为许多细胞反应会直接消耗它。","audioStart":482.907,"audioEnd":488.862,"audioFile":"audio/part-1.mp3"},{"term":"NADH","english":"NADH carries high-energy electrons from metabolic reactions to the respiratory chain.","chinese":"NADH把代谢反应中的高能电子传递给呼吸链。","audioStart":489.182,"audioEnd":494.512,"audioFile":"audio/part-1.mp3"},{"term":"NADPH","english":"NADPH provides reducing power for biosynthesis and antioxidant defense.","chinese":"NADPH为生物合成和抗氧化防御提供还原力。","audioStart":494.832,"audioEnd":500.0,"audioFile":"audio/part-1.mp3"},{"term":"fatty acid oxidation","english":"Fatty acid oxidation is especially important when glucose is limited or energy demand is high.","chinese":"当葡萄糖有限或能量需求较高时，脂肪酸氧化尤其重要。","audioStart":500.32,"audioEnd":506.012,"audioFile":"audio/part-1.mp3"},{"term":"beta-oxidation","english":"Beta-oxidation shortens fatty acids step by step to generate acetyl-CoA.","chinese":"beta-氧化逐步缩短脂肪酸，并产生乙酰辅酶A。","audioStart":506.332,"audioEnd":511.125,"audioFile":"audio/part-1.mp3"},{"term":"lipogenesis","english":"Lipogenesis is increased when cells need new membranes for rapid growth.","chinese":"当细胞快速生长并需要新膜时，脂肪生成会增强。","audioStart":511.457,"audioEnd":516.037,"audioFile":"audio/part-1.mp3"},{"term":"cholesterol metabolism","english":"Cholesterol metabolism influences membrane fluidity and steroid hormone production.","chinese":"胆固醇代谢影响膜流动性和类固醇激素生成。","audioStart":516.357,"audioEnd":521.562,"audioFile":"audio/part-1.mp3"},{"term":"insulin","english":"Insulin lowers blood glucose by promoting glucose uptake and storage.","chinese":"胰岛素通过促进葡萄糖摄取和储存来降低血糖。","audioStart":521.882,"audioEnd":526.225,"audioFile":"audio/part-1.mp3"},{"term":"glucagon","english":"Glucagon raises blood glucose by stimulating glycogen breakdown and gluconeogenesis.","chinese":"胰高血糖素通过刺激糖原分解和糖异生来升高血糖。","audioStart":526.545,"audioEnd":532.05,"audioFile":"audio/part-1.mp3"},{"term":"insulin resistance","english":"Insulin resistance forces the pancreas to produce more insulin to maintain glucose control.","chinese":"胰岛素抵抗迫使胰腺分泌更多胰岛素以维持血糖控制。","audioStart":532.37,"audioEnd":537.775,"audioFile":"audio/part-1.mp3"},{"term":"diabetes mellitus","english":"Diabetes mellitus causes chronic metabolic stress that damages blood vessels, nerves, and kidneys.","chinese":"糖尿病会造成慢性代谢压力，损伤血管、神经和肾脏。","audioStart":538.095,"audioEnd":544.525,"audioFile":"audio/part-1.mp3"},{"term":"type 2 diabetes","english":"Type 2 diabetes usually develops from a combination of insulin resistance and beta-cell dysfunction.","chinese":"2型糖尿病通常由胰岛素抵抗和beta细胞功能障碍共同导致。","audioStart":544.845,"audioEnd":550.8,"audioFile":"audio/part-1.mp3"},{"term":"obesity","english":"Obesity is biologically active because expanded adipose tissue secretes hormones and inflammatory mediators.","chinese":"肥胖具有生物学活性，因为扩大的脂肪组织会分泌激素和炎症介质。","audioStart":551.12,"audioEnd":557.937,"audioFile":"audio/part-1.mp3"},{"term":"metabolic syndrome","english":"Metabolic syndrome combines abdominal obesity, dyslipidemia, hypertension, and impaired glucose control.","chinese":"代谢综合征包括腹型肥胖、血脂异常、高血压和血糖控制受损。","audioStart":558.257,"audioEnd":565.825,"audioFile":"audio/part-1.mp3"},{"term":"non-alcoholic fatty liver disease, NAFLD","english":"Non-alcoholic fatty liver disease, NAFLD, reflects lipid accumulation in the liver without heavy alcohol use.","chinese":"非酒精性脂肪性肝病指没有大量饮酒情况下肝脏脂质堆积。","audioStart":566.145,"audioEnd":573.425,"audioFile":"audio/part-1.mp3"},{"term":"inflammation","english":"Inflammation protects the host in the short term but damages tissues when it becomes chronic.","chinese":"炎症在短期内保护宿主，但转为慢性后会损伤组织。","audioStart":573.745,"audioEnd":579.162,"audioFile":"audio/part-1.mp3"},{"term":"chronic inflammation","english":"Chronic inflammation can keep immune cells activated long after the original trigger has disappeared.","chinese":"慢性炎症会使免疫细胞在最初诱因消失后仍持续激活。","audioStart":579.482,"audioEnd":585.337,"audioFile":"audio/part-1.mp3"},{"term":"oxidative stress","english":"Oxidative stress occurs when reactive molecules overwhelm antioxidant defenses.","chinese":"当活性分子超过抗氧化防御能力时，就会发生氧化应激。","audioStart":585.657,"audioEnd":590.725,"audioFile":"audio/part-1.mp3"},{"term":"reactive oxygen species, ROS","english":"Reactive oxygen species, ROS, can act as signaling molecules at low levels and damage molecules at high levels.","chinese":"活性氧在低水平时可作为信号分子，在高水平时会损伤分子。","audioStart":591.045,"audioEnd":598.15,"audioFile":"audio/part-1.mp3"},{"term":"mitochondrial dysfunction","english":"Mitochondrial dysfunction can reduce ATP production and increase cellular stress signals.","chinese":"线粒体功能障碍会降低ATP产生，并增强细胞应激信号。","audioStart":0.057,"audioEnd":5.487,"audioFile":"audio/part-2.mp3"},{"term":"hypoxia","english":"Hypoxia stabilizes HIF proteins and pushes cells toward adaptive metabolic programs.","chinese":"缺氧会稳定HIF蛋白，并推动细胞进入适应性代谢程序。","audioStart":5.807,"audioEnd":11.587,"audioFile":"audio/part-2.mp3"},{"term":"Warburg effect","english":"The Warburg effect helps explain why many tumors consume glucose aggressively even in oxygen-rich conditions.","chinese":"瓦伯格效应解释了为什么许多肿瘤即使在富氧条件下也大量消耗葡萄糖。","audioStart":11.907,"audioEnd":18.462,"audioFile":"audio/part-2.mp3"},{"term":"biomarker","english":"A biomarker is useful when it helps diagnose disease, predict prognosis, or monitor treatment response.","chinese":"生物标志物如果能帮助诊断疾病、预测预后或监测治疗反应，就具有实用价值。","audioStart":18.782,"audioEnd":25.35,"audioFile":"audio/part-2.mp3"},{"term":"pathogenesis","english":"Pathogenesis describes the process by which normal biology is converted into disease.","chinese":"发病机制描述正常生物学过程如何转变为疾病。","audioStart":25.67,"audioEnd":31.2,"audioFile":"audio/part-2.mp3"},{"term":"disease progression","english":"Disease progression often reflects the accumulation of molecular damage and failed repair.","chinese":"疾病进展常常反映分子损伤的积累和修复失败。","audioStart":31.532,"audioEnd":36.9,"audioFile":"audio/part-2.mp3"},{"term":"therapeutic target","english":"A therapeutic target should be important for disease cells and less essential for normal tissues.","chinese":"治疗靶点应当对疾病细胞重要，而对正常组织相对不那么必需。","audioStart":37.22,"audioEnd":42.387,"audioFile":"audio/part-2.mp3"},{"term":"comorbidity","english":"Comorbidity can complicate treatment because one disease may worsen another.","chinese":"共病会使治疗复杂化，因为一种疾病可能加重另一种疾病。","audioStart":42.707,"audioEnd":47.125,"audioFile":"audio/part-2.mp3"},{"term":"prognosis","english":"Prognosis estimates the likely course of disease based on clinical and molecular information.","chinese":"预后根据临床和分子信息估计疾病可能的发展过程。","audioStart":47.432,"audioEnd":52.825,"audioFile":"audio/part-2.mp3"},{"term":"neuroscience","english":"Neuroscience tries to explain how electrical, chemical, and cellular events produce behavior.","chinese":"神经科学试图解释电活动、化学信号和细胞事件如何产生行为。","audioStart":53.145,"audioEnd":59.1,"audioFile":"audio/part-2.mp3"},{"term":"brain science","english":"Brain science connects molecules and circuits with perception, memory, emotion, and decision-making.","chinese":"脑科学把分子和环路与感知、记忆、情绪和决策联系起来。","audioStart":59.42,"audioEnd":65.912,"audioFile":"audio/part-2.mp3"},{"term":"neuron","english":"A neuron communicates by receiving inputs, integrating them, and sending signals to other cells.","chinese":"神经元通过接收输入、整合信息并向其他细胞发送信号来进行交流。","audioStart":66.232,"audioEnd":72.537,"audioFile":"audio/part-2.mp3"},{"term":"glial cell","english":"A glial cell supports neurons but can also shape inflammation, metabolism, and synaptic function.","chinese":"胶质细胞支持神经元，同时也能影响炎症、代谢和突触功能。","audioStart":72.857,"audioEnd":79.075,"audioFile":"audio/part-2.mp3"},{"term":"astrocyte","english":"An astrocyte regulates neurotransmitter balance and helps maintain the blood-brain barrier.","chinese":"星形胶质细胞调节神经递质平衡，并帮助维持血脑屏障。","audioStart":79.37,"audioEnd":84.387,"audioFile":"audio/part-2.mp3"},{"term":"microglia","english":"Microglia survey the brain environment and respond quickly to injury or infection.","chinese":"小胶质细胞监视脑内环境，并对损伤或感染迅速作出反应。","audioStart":84.707,"audioEnd":89.6,"audioFile":"audio/part-2.mp3"},{"term":"oligodendrocyte","english":"An oligodendrocyte forms myelin, allowing nerve impulses to travel more efficiently.","chinese":"少突胶质细胞形成髓鞘，使神经冲动传导更高效。","audioStart":89.92,"audioEnd":95.625,"audioFile":"audio/part-2.mp3"},{"term":"synapse","english":"A synapse is the specialized contact where one neuron influences another cell.","chinese":"突触是一个神经元影响另一细胞的特化接触点。","audioStart":95.932,"audioEnd":100.712,"audioFile":"audio/part-2.mp3"},{"term":"synaptic transmission","english":"Synaptic transmission converts electrical activity into chemical communication and back again.","chinese":"突触传递把电活动转化为化学交流，然后再转回电信号。","audioStart":100.995,"audioEnd":106.537,"audioFile":"audio/part-2.mp3"},{"term":"neurotransmitter","english":"A neurotransmitter can excite, inhibit, or modulate the activity of a postsynaptic cell.","chinese":"神经递质可以兴奋、抑制或调节突触后细胞的活动。","audioStart":106.857,"audioEnd":112.65,"audioFile":"audio/part-2.mp3"},{"term":"dopamine","english":"Dopamine is involved in reward, movement, motivation, and several neuropsychiatric disorders.","chinese":"多巴胺参与奖赏、运动、动机以及多种神经精神疾病。","audioStart":112.97,"audioEnd":118.825,"audioFile":"audio/part-2.mp3"},{"term":"serotonin","english":"Serotonin influences mood, sleep, appetite, and many peripheral physiological processes.","chinese":"血清素影响情绪、睡眠、食欲以及许多外周生理过程。","audioStart":119.145,"audioEnd":126.012,"audioFile":"audio/part-2.mp3"},{"term":"acetylcholine","english":"Acetylcholine is essential for neuromuscular transmission and also modulates attention in the brain.","chinese":"乙酰胆碱对神经肌肉传递必不可少，也调节脑内注意功能。","audioStart":126.332,"audioEnd":132.15,"audioFile":"audio/part-2.mp3"},{"term":"glutamate","english":"Glutamate is the major excitatory neurotransmitter in the mammalian central nervous system.","chinese":"谷氨酸是哺乳动物中枢神经系统中主要的兴奋性神经递质。","audioStart":132.47,"audioEnd":137.787,"audioFile":"audio/part-2.mp3"},{"term":"GABA","english":"GABA provides inhibition that prevents neural circuits from becoming overactive.","chinese":"GABA提供抑制作用，防止神经环路过度兴奋。","audioStart":138.107,"audioEnd":142.95,"audioFile":"audio/part-2.mp3"},{"term":"receptor","english":"In neurons, a receptor determines how a chemical signal changes electrical activity.","chinese":"在神经元中，受体决定化学信号如何改变电活动。","audioStart":143.27,"audioEnd":148.8,"audioFile":"audio/part-2.mp3"},{"term":"ion channel","english":"An ion channel opens or closes to control the movement of charged particles across a membrane.","chinese":"离子通道通过开放或关闭来控制带电粒子跨膜流动。","audioStart":149.082,"audioEnd":154.612,"audioFile":"audio/part-2.mp3"},{"term":"action potential","english":"An action potential is an all-or-none electrical signal that travels along an axon.","chinese":"动作电位是沿轴突传播的全或无电信号。","audioStart":154.932,"audioEnd":160.125,"audioFile":"audio/part-2.mp3"},{"term":"resting potential","english":"The resting potential reflects the unequal distribution of ions across the neuronal membrane.","chinese":"静息电位反映神经元膜两侧离子分布不均。","audioStart":160.445,"audioEnd":165.725,"audioFile":"audio/part-2.mp3"},{"term":"membrane potential","english":"Membrane potential changes determine whether a neuron becomes more or less likely to fire.","chinese":"膜电位变化决定神经元放电可能性增加还是降低。","audioStart":166.045,"audioEnd":171.375,"audioFile":"audio/part-2.mp3"},{"term":"neural circuit","english":"A neural circuit transforms sensory information into actions, memories, or emotional states.","chinese":"神经环路把感觉信息转化为动作、记忆或情绪状态。","audioStart":171.695,"audioEnd":177.762,"audioFile":"audio/part-2.mp3"},{"term":"neural network","english":"A neural network can store information through the strength and pattern of its connections.","chinese":"神经网络可以通过连接强度和连接模式储存信息。","audioStart":178.082,"audioEnd":182.875,"audioFile":"audio/part-2.mp3"},{"term":"plasticity","english":"Plasticity allows the nervous system to adapt after learning, injury, or environmental change.","chinese":"可塑性使神经系统能够在学习、损伤或环境变化后进行适应。","audioStart":183.195,"audioEnd":189.25,"audioFile":"audio/part-2.mp3"},{"term":"synaptic plasticity","english":"Synaptic plasticity changes the strength of communication between neurons.","chinese":"突触可塑性改变神经元之间交流的强度。","audioStart":189.557,"audioEnd":193.987,"audioFile":"audio/part-2.mp3"},{"term":"long-term potentiation, LTP","english":"Long-term potentiation, LTP, is often used as a cellular model of learning and memory.","chinese":"长时程增强常被用作学习和记忆的细胞模型。","audioStart":194.307,"audioEnd":200.037,"audioFile":"audio/part-2.mp3"},{"term":"long-term depression, LTD","english":"Long-term depression, LTD, weakens synaptic responses and helps refine neural circuits.","chinese":"长时程抑制会削弱突触反应，并帮助精细调整神经环路。","audioStart":200.357,"audioEnd":206.512,"audioFile":"audio/part-2.mp3"},{"term":"neurogenesis","english":"Neurogenesis in the adult brain is limited but may contribute to learning and repair.","chinese":"成年脑中的神经发生有限，但可能参与学习和修复。","audioStart":206.832,"audioEnd":211.725,"audioFile":"audio/part-2.mp3"},{"term":"neurodegeneration","english":"Neurodegeneration involves progressive loss of neuronal structure or function.","chinese":"神经退行性变涉及神经元结构或功能的进行性丧失。","audioStart":212.045,"audioEnd":216.687,"audioFile":"audio/part-2.mp3"},{"term":"neuroinflammation","english":"Neuroinflammation can protect the brain acutely but worsen degeneration when sustained.","chinese":"神经炎症在急性阶段可保护大脑，但持续存在时会加重退行性变。","audioStart":217.007,"audioEnd":222.25,"audioFile":"audio/part-2.mp3"},{"term":"blood-brain barrier, BBB","english":"The blood-brain barrier, BBB, restricts many drugs from entering the brain.","chinese":"血脑屏障限制许多药物进入大脑。","audioStart":222.557,"audioEnd":227.25,"audioFile":"audio/part-2.mp3"},{"term":"hippocampus","english":"The hippocampus is crucial for forming many types of new memory.","chinese":"海马对形成多种新记忆至关重要。","audioStart":227.57,"audioEnd":231.462,"audioFile":"audio/part-2.mp3"},{"term":"cortex","english":"The cortex supports complex functions such as perception, language, and voluntary movement.","chinese":"皮层支持感知、语言和自主运动等复杂功能。","audioStart":231.77,"audioEnd":237.787,"audioFile":"audio/part-2.mp3"},{"term":"prefrontal cortex","english":"The prefrontal cortex helps control planning, attention, and flexible decision-making.","chinese":"前额叶皮层帮助控制计划、注意和灵活决策。","audioStart":238.095,"audioEnd":243.237,"audioFile":"audio/part-2.mp3"},{"term":"amygdala","english":"The amygdala assigns emotional significance to stimuli, especially threats.","chinese":"杏仁核为刺激赋予情绪意义，尤其是威胁性刺激。","audioStart":243.532,"audioEnd":248.55,"audioFile":"audio/part-2.mp3"},{"term":"cerebellum","english":"The cerebellum fine-tunes movement and also contributes to cognitive processing.","chinese":"小脑精细调节运动，也参与认知处理。","audioStart":248.882,"audioEnd":253.412,"audioFile":"audio/part-2.mp3"},{"term":"basal ganglia","english":"The basal ganglia help select actions and are strongly linked to movement disorders.","chinese":"基底节帮助选择动作，并与运动障碍密切相关。","audioStart":253.732,"audioEnd":258.537,"audioFile":"audio/part-2.mp3"},{"term":"Alzheimer's disease, AD","english":"Alzheimer's disease, AD, gradually impairs memory and is linked to amyloid and tau pathology.","chinese":"阿尔茨海默病逐渐损害记忆，并与淀粉样蛋白和Tau病理相关。","audioStart":258.857,"audioEnd":264.737,"audioFile":"audio/part-2.mp3"},{"term":"Parkinson's disease, PD","english":"Parkinson's disease, PD, is marked by motor symptoms and loss of dopaminergic neurons.","chinese":"帕金森病以运动症状和多巴胺能神经元丢失为特征。","audioStart":265.057,"audioEnd":271.412,"audioFile":"audio/part-2.mp3"},{"term":"amyloid-beta, Abeta","english":"Amyloid-beta, Abeta, can accumulate into plaques that are associated with Alzheimer's pathology.","chinese":"beta-淀粉样蛋白可聚集形成与阿尔茨海默病理相关的斑块。","audioStart":271.732,"audioEnd":278.475,"audioFile":"audio/part-2.mp3"},{"term":"tau protein","english":"Tau protein normally stabilizes microtubules but becomes harmful when abnormally modified.","chinese":"Tau蛋白通常稳定微管，但异常修饰后会变得有害。","audioStart":278.795,"audioEnd":284.487,"audioFile":"audio/part-2.mp3"},{"term":"alpha-synuclein","english":"Alpha-synuclein aggregation is a key pathological feature of Parkinson's disease.","chinese":"alpha-突触核蛋白聚集是帕金森病的重要病理特征。","audioStart":284.807,"audioEnd":289.9,"audioFile":"audio/part-2.mp3"},{"term":"myelin","english":"Myelin insulates axons and greatly increases the speed of signal conduction.","chinese":"髓鞘包裹轴突，并显著提高信号传导速度。","audioStart":290.22,"audioEnd":294.987,"audioFile":"audio/part-2.mp3"},{"term":"demyelination","english":"Demyelination slows nerve conduction and can produce weakness, numbness, or cognitive symptoms.","chinese":"脱髓鞘会减慢神经传导，并可导致无力、麻木或认知症状。","audioStart":295.307,"audioEnd":301.837,"audioFile":"audio/part-2.mp3"},{"term":"cognitive function","english":"Cognitive function includes memory, attention, language, and executive control.","chinese":"认知功能包括记忆、注意、语言和执行控制。","audioStart":302.157,"audioEnd":307.712,"audioFile":"audio/part-2.mp3"},{"term":"learning and memory","english":"Learning and memory depend on lasting changes in synapses and neural circuits.","chinese":"学习与记忆依赖突触和神经环路的持久改变。","audioStart":308.032,"audioEnd":312.862,"audioFile":"audio/part-2.mp3"},{"term":"behavioral test","english":"A behavioral test must be interpreted carefully because stress or motor deficits can affect performance.","chinese":"行为学实验必须谨慎解释，因为压力或运动缺陷会影响表现。","audioStart":313.182,"audioEnd":318.75,"audioFile":"audio/part-2.mp3"},{"term":"electrophysiology","english":"Electrophysiology measures electrical activity and reveals how neurons encode information.","chinese":"电生理学测量电活动，并揭示神经元如何编码信息。","audioStart":319.07,"audioEnd":324.662,"audioFile":"audio/part-2.mp3"},{"term":"calcium imaging","english":"Calcium imaging allows researchers to watch neuronal activity in many cells at once.","chinese":"钙成像使研究者能够同时观察许多细胞的神经活动。","audioStart":324.982,"audioEnd":330.175,"audioFile":"audio/part-2.mp3"},{"term":"optogenetics","english":"Optogenetics uses light-sensitive proteins to control selected neurons with high temporal precision.","chinese":"光遗传学利用光敏蛋白以高时间精度控制特定神经元。","audioStart":330.495,"audioEnd":336.475,"audioFile":"audio/part-2.mp3"},{"term":"chemogenetics","english":"Chemogenetics controls engineered receptors with specific drugs to modulate neural circuits.","chinese":"化学遗传学用特定药物控制工程化受体，从而调节神经环路。","audioStart":336.795,"audioEnd":342.462,"audioFile":"audio/part-2.mp3"},{"term":"structural biology","english":"Structural biology explains function by showing how biological molecules are arranged in three dimensions.","chinese":"结构生物学通过展示生物分子的三维排列来解释其功能。","audioStart":342.77,"audioEnd":348.975,"audioFile":"audio/part-2.mp3"},{"term":"protein structure","english":"Protein structure determines which partners a protein can bind and which reactions it can perform.","chinese":"蛋白质结构决定蛋白能够结合哪些伙伴以及执行哪些反应。","audioStart":349.307,"audioEnd":354.712,"audioFile":"audio/part-2.mp3"},{"term":"primary structure","english":"Primary structure is the amino acid sequence that constrains all higher levels of folding.","chinese":"一级结构是氨基酸序列，它限制着更高级别的折叠方式。","audioStart":355.045,"audioEnd":360.362,"audioFile":"audio/part-2.mp3"},{"term":"secondary structure","english":"Secondary structure includes local patterns such as helices and sheets formed by backbone interactions.","chinese":"二级结构包括由主链相互作用形成的螺旋和折叠等局部模式。","audioStart":360.682,"audioEnd":366.887,"audioFile":"audio/part-2.mp3"},{"term":"tertiary structure","english":"Tertiary structure describes the overall three-dimensional shape of a single protein chain.","chinese":"三级结构描述单条蛋白链的整体三维形状。","audioStart":367.207,"audioEnd":372.287,"audioFile":"audio/part-2.mp3"},{"term":"quaternary structure","english":"Quaternary structure explains how multiple protein subunits assemble into a functional complex.","chinese":"四级结构解释多个蛋白亚基如何组装成功能性复合物。","audioStart":372.62,"audioEnd":378.412,"audioFile":"audio/part-2.mp3"},{"term":"alpha helix","english":"An alpha helix is stabilized by hydrogen bonds within the protein backbone.","chinese":"alpha-螺旋由蛋白主链内部的氢键稳定。","audioStart":378.732,"audioEnd":383.4,"audioFile":"audio/part-2.mp3"},{"term":"beta sheet","english":"A beta sheet can create rigid surfaces that support binding or structural stability.","chinese":"beta-折叠可以形成刚性表面，支持结合或结构稳定性。","audioStart":383.72,"audioEnd":388.725,"audioFile":"audio/part-2.mp3"},{"term":"domain","english":"A domain often folds independently and carries a specific structural or functional role.","chinese":"结构域通常能够独立折叠，并承担特定结构或功能作用。","audioStart":389.045,"audioEnd":394.275,"audioFile":"audio/part-2.mp3"},{"term":"motif","english":"A motif is a recurring structural pattern that may indicate a conserved function.","chinese":"基序是一种反复出现的结构模式，可能提示保守功能。","audioStart":394.582,"audioEnd":399.15,"audioFile":"audio/part-2.mp3"},{"term":"folding","english":"Folding converts a linear amino acid chain into a functional three-dimensional structure.","chinese":"折叠把线性的氨基酸链转变为有功能的三维结构。","audioStart":399.47,"audioEnd":404.687,"audioFile":"audio/part-2.mp3"},{"term":"misfolding","english":"Misfolding can expose sticky surfaces and promote toxic protein aggregation.","chinese":"错误折叠会暴露黏性表面，并促进有毒蛋白聚集。","audioStart":405.007,"audioEnd":409.9,"audioFile":"audio/part-2.mp3"},{"term":"conformational change","english":"A conformational change can turn an inactive protein into an active signaling molecule.","chinese":"构象变化可以把非活性蛋白转变为活跃的信号分子。","audioStart":410.182,"audioEnd":415.137,"audioFile":"audio/part-2.mp3"},{"term":"protein complex","english":"A protein complex can perform tasks that no single subunit could accomplish alone.","chinese":"蛋白复合物能够完成单个亚基无法独立完成的任务。","audioStart":415.457,"audioEnd":420.312,"audioFile":"audio/part-2.mp3"},{"term":"ligand binding","english":"Ligand binding often shifts the equilibrium between inactive and active conformations.","chinese":"配体结合常常改变非活性构象和活性构象之间的平衡。","audioStart":420.632,"audioEnd":425.762,"audioFile":"audio/part-2.mp3"},{"term":"binding pocket","english":"A binding pocket is shaped by evolution to recognize particular chemical features.","chinese":"结合口袋经过进化塑造，用于识别特定化学特征。","audioStart":426.082,"audioEnd":431.087,"audioFile":"audio/part-2.mp3"},{"term":"active site","english":"The active site positions substrates so that a chemical reaction can occur efficiently.","chinese":"活性位点排列底物，使化学反应能够高效发生。","audioStart":431.382,"audioEnd":436.325,"audioFile":"audio/part-2.mp3"},{"term":"allosteric regulation","english":"Allosteric regulation allows a molecule bound at one site to change activity at another site.","chinese":"别构调节使一个位点结合的分子能够改变另一个位点的活性。","audioStart":436.645,"audioEnd":442.362,"audioFile":"audio/part-2.mp3"},{"term":"affinity","english":"Affinity describes how strongly two molecules prefer to stay bound.","chinese":"亲和力描述两个分子倾向于结合在一起的强弱。","audioStart":442.645,"audioEnd":446.762,"audioFile":"audio/part-2.mp3"},{"term":"resolution","english":"Resolution determines how much structural detail can be trusted in a map or model.","chinese":"分辨率决定在密度图或模型中有多少结构细节是可信的。","audioStart":447.082,"audioEnd":452.125,"audioFile":"audio/part-2.mp3"},{"term":"crystal structure","english":"A crystal structure can provide atomic detail but may miss flexible states present in solution.","chinese":"晶体结构可以提供原子细节，但可能漏掉溶液中存在的柔性状态。","audioStart":452.445,"audioEnd":458.062,"audioFile":"audio/part-2.mp3"},{"term":"X-ray crystallography","english":"X-ray crystallography infers atomic positions from how crystals diffract X-rays.","chinese":"X射线晶体学通过晶体衍射X射线的方式推断原子位置。","audioStart":458.382,"audioEnd":463.712,"audioFile":"audio/part-2.mp3"},{"term":"NMR spectroscopy","english":"NMR spectroscopy can study protein structure and dynamics in solution.","chinese":"核磁共振波谱可以研究溶液中蛋白质的结构和动态变化。","audioStart":464.032,"audioEnd":468.725,"audioFile":"audio/part-2.mp3"},{"term":"cryo-electron microscopy, cryo-EM","english":"Cryo-electron microscopy, cryo-EM, is especially useful for large complexes that are difficult to crystallize.","chinese":"冷冻电子显微镜特别适合研究难以结晶的大型复合物。","audioStart":469.045,"audioEnd":476.037,"audioFile":"audio/part-2.mp3"},{"term":"single-particle analysis","english":"Single-particle analysis reconstructs a 3D structure from many noisy images of individual molecules.","chinese":"单颗粒分析从大量单个分子的噪声图像中重构三维结构。","audioStart":476.357,"audioEnd":482.975,"audioFile":"audio/part-2.mp3"},{"term":"vitrification","english":"Vitrification freezes water into a glass-like state that preserves native molecular structure.","chinese":"玻璃化冷冻使水冻结为类似玻璃的状态，从而保存天然分子结构。","audioStart":483.295,"audioEnd":488.837,"audioFile":"audio/part-2.mp3"},{"term":"electron density map","english":"An electron density map guides the placement of atoms during model building.","chinese":"电子密度图在模型构建时指导原子的放置。","audioStart":489.157,"audioEnd":493.412,"audioFile":"audio/part-2.mp3"},{"term":"cryo-EM map","english":"A cryo-EM map shows the averaged density of particles captured in thin ice.","chinese":"冷冻电镜密度图显示薄冰中颗粒的平均密度。","audioStart":493.695,"audioEnd":498.287,"audioFile":"audio/part-2.mp3"},{"term":"particle picking","english":"Particle picking identifies individual molecular images that will be used for reconstruction.","chinese":"颗粒挑选识别将用于重构的单个分子图像。","audioStart":498.62,"audioEnd":504.212,"audioFile":"audio/part-2.mp3"},{"term":"2D classification","english":"2D classification groups similar particle views and removes poor-quality images.","chinese":"二维分类把相似颗粒视图分组，并去除低质量图像。","audioStart":504.532,"audioEnd":509.55,"audioFile":"audio/part-2.mp3"},{"term":"3D reconstruction","english":"3D reconstruction combines many particle orientations to recover a three-dimensional map.","chinese":"三维重构整合许多颗粒取向，以恢复三维密度图。","audioStart":509.87,"audioEnd":515.65,"audioFile":"audio/part-2.mp3"},{"term":"model building","english":"Model building fits atomic coordinates into experimental density.","chinese":"模型构建把原子坐标拟合到实验密度中。","audioStart":0.057,"audioEnd":4.287,"audioFile":"audio/part-3.mp3"},{"term":"refinement","english":"Refinement improves the agreement between the structural model and the experimental data.","chinese":"精修提高结构模型与实验数据之间的一致性。","audioStart":4.62,"audioEnd":9.55,"audioFile":"audio/part-3.mp3"},{"term":"atomic model","english":"An atomic model proposes where individual atoms are located in a macromolecule.","chinese":"原子模型提出大分子中各个原子的位置。","audioStart":9.87,"audioEnd":15.087,"audioFile":"audio/part-3.mp3"},{"term":"conformational heterogeneity","english":"Conformational heterogeneity means that particles adopt multiple shapes instead of one rigid state.","chinese":"构象异质性意味着颗粒呈现多种形状，而不是单一刚性状态。","audioStart":15.407,"audioEnd":21.375,"audioFile":"audio/part-3.mp3"},{"term":"membrane protein","english":"A membrane protein is difficult to study because it depends on a lipid environment.","chinese":"膜蛋白难以研究，因为它依赖脂质环境。","audioStart":21.67,"audioEnd":26.25,"audioFile":"audio/part-3.mp3"},{"term":"receptor complex","english":"A receptor complex can integrate signals from ligands, cofactors, and intracellular partners.","chinese":"受体复合物能够整合来自配体、辅因子和细胞内伙伴的信号。","audioStart":26.57,"audioEnd":32.775,"audioFile":"audio/part-3.mp3"},{"term":"ribosome structure","english":"Ribosome structure reveals how RNA and proteins cooperate during translation.","chinese":"核糖体结构揭示RNA和蛋白质在翻译过程中如何协同工作。","audioStart":33.095,"audioEnd":38.225,"audioFile":"audio/part-3.mp3"},{"term":"protein-protein interaction, PPI","english":"Protein-protein interaction, PPI, often determines whether a signaling pathway is assembled or blocked.","chinese":"蛋白质-蛋白质相互作用常常决定一条信号通路是被组装还是被阻断。","audioStart":38.532,"audioEnd":44.812,"audioFile":"audio/part-3.mp3"},{"term":"molecular docking","english":"Molecular docking predicts how a small molecule may fit into a protein binding pocket.","chinese":"分子对接预测小分子可能如何嵌入蛋白质结合口袋。","audioStart":45.145,"audioEnd":50.112,"audioFile":"audio/part-3.mp3"},{"term":"molecular dynamics simulation, MD","english":"Molecular dynamics simulation, MD, follows atomic movements over time to explore structural flexibility.","chinese":"分子动力学模拟随时间追踪原子运动，以探索结构柔性。","audioStart":50.432,"audioEnd":57.712,"audioFile":"audio/part-3.mp3"},{"term":"transcriptional regulation","english":"Transcriptional regulation determines when a gene is silent and when it becomes active.","chinese":"转录调控决定一个基因何时沉默、何时被激活。","audioStart":58.032,"audioEnd":62.862,"audioFile":"audio/part-3.mp3"},{"term":"gene expression regulation","english":"Gene expression regulation allows cells with the same genome to develop different identities.","chinese":"基因表达调控使拥有相同基因组的细胞能够形成不同身份。","audioStart":63.182,"audioEnd":68.525,"audioFile":"audio/part-3.mp3"},{"term":"transcription factor, TF","english":"A transcription factor, TF, recognizes DNA motifs and recruits proteins that activate or repress transcription.","chinese":"转录因子识别DNA基序，并招募激活或抑制转录的蛋白质。","audioStart":68.82,"audioEnd":76.6,"audioFile":"audio/part-3.mp3"},{"term":"promoter","english":"A promoter marks the region where transcription machinery assembles to start RNA synthesis.","chinese":"启动子标记转录机器组装并开始RNA合成的区域。","audioStart":76.92,"audioEnd":82.287,"audioFile":"audio/part-3.mp3"},{"term":"enhancer","english":"An enhancer can activate a distant gene by physically contacting its promoter.","chinese":"增强子可以通过与启动子发生空间接触来激活远处基因。","audioStart":82.607,"audioEnd":87.375,"audioFile":"audio/part-3.mp3"},{"term":"silencer","english":"A silencer reduces gene expression by recruiting repressive regulatory proteins.","chinese":"沉默子通过招募抑制性调控蛋白来降低基因表达。","audioStart":87.695,"audioEnd":92.787,"audioFile":"audio/part-3.mp3"},{"term":"operator","english":"In bacteria, an operator controls whether RNA polymerase can transcribe nearby genes.","chinese":"在细菌中，操纵子控制RNA聚合酶是否能够转录邻近基因。","audioStart":93.107,"audioEnd":98.5,"audioFile":"audio/part-3.mp3"},{"term":"transcription start site, TSS","english":"The transcription start site, TSS, defines the first nucleotide copied into RNA.","chinese":"转录起始位点定义被复制进RNA的第一个核苷酸。","audioStart":98.807,"audioEnd":104.487,"audioFile":"audio/part-3.mp3"},{"term":"RNA polymerase","english":"RNA polymerase reads a DNA template and synthesizes a complementary RNA strand.","chinese":"RNA聚合酶读取DNA模板，并合成互补RNA链。","audioStart":104.807,"audioEnd":110.15,"audioFile":"audio/part-3.mp3"},{"term":"mediator complex","english":"The mediator complex helps transcription factors communicate with RNA polymerase.","chinese":"Mediator复合物帮助转录因子与RNA聚合酶沟通。","audioStart":110.457,"audioEnd":115.437,"audioFile":"audio/part-3.mp3"},{"term":"cis-regulatory element","english":"A cis-regulatory element controls genes located on the same DNA molecule.","chinese":"顺式调控元件调控同一DNA分子上的基因。","audioStart":115.757,"audioEnd":120.75,"audioFile":"audio/part-3.mp3"},{"term":"trans-acting factor","english":"A trans-acting factor can diffuse through the nucleus and regulate distant DNA sites.","chinese":"反式作用因子可以在细胞核内扩散，并调控远处DNA位点。","audioStart":121.07,"audioEnd":126.275,"audioFile":"audio/part-3.mp3"},{"term":"alternative splicing","english":"Alternative splicing allows one gene to produce multiple protein isoforms.","chinese":"可变剪接使一个基因能够产生多种蛋白异构体。","audioStart":126.595,"audioEnd":131.262,"audioFile":"audio/part-3.mp3"},{"term":"mRNA processing","english":"mRNA processing converts a newly made transcript into a mature messenger RNA.","chinese":"mRNA加工把新合成的转录本转变为成熟信使RNA。","audioStart":131.582,"audioEnd":136.85,"audioFile":"audio/part-3.mp3"},{"term":"5' cap","english":"The 5' cap protects mRNA and helps recruit the ribosome for translation.","chinese":"5'帽子结构保护mRNA，并帮助招募核糖体进行翻译。","audioStart":137.157,"audioEnd":142.012,"audioFile":"audio/part-3.mp3"},{"term":"poly(A) tail","english":"The poly(A) tail increases mRNA stability and influences translation efficiency.","chinese":"poly(A)尾提高mRNA稳定性，并影响翻译效率。","audioStart":142.32,"audioEnd":148.762,"audioFile":"audio/part-3.mp3"},{"term":"untranslated region, UTR","english":"An untranslated region, UTR, can regulate mRNA localization, stability, and translation.","chinese":"非翻译区能够调控mRNA定位、稳定性和翻译。","audioStart":149.045,"audioEnd":155.975,"audioFile":"audio/part-3.mp3"},{"term":"non-coding RNA","english":"Non-coding RNA can regulate gene expression without being translated into protein.","chinese":"非编码RNA无需被翻译成蛋白质，也能调控基因表达。","audioStart":156.295,"audioEnd":161.262,"audioFile":"audio/part-3.mp3"},{"term":"microRNA, miRNA","english":"MicroRNA, miRNA, usually represses target mRNAs by guiding silencing complexes.","chinese":"微小RNA通常通过引导沉默复合物来抑制靶mRNA。","audioStart":161.582,"audioEnd":167.8,"audioFile":"audio/part-3.mp3"},{"term":"long non-coding RNA, lncRNA","english":"Long non-coding RNA, lncRNA, can organize chromatin or guide regulatory proteins to genes.","chinese":"长链非编码RNA可以组织染色质，或引导调控蛋白到达基因位点。","audioStart":168.12,"audioEnd":174.712,"audioFile":"audio/part-3.mp3"},{"term":"circular RNA, circRNA","english":"Circular RNA, circRNA, is unusually stable because it lacks free ends.","chinese":"环状RNA由于缺乏游离末端而异常稳定。","audioStart":175.032,"audioEnd":180.212,"audioFile":"audio/part-3.mp3"},{"term":"RNA interference, RNAi","english":"RNA interference, RNAi, uses small RNAs to reduce the expression of specific genes.","chinese":"RNA干扰利用小RNA降低特定基因的表达。","audioStart":180.532,"audioEnd":186.425,"audioFile":"audio/part-3.mp3"},{"term":"epigenetics","english":"Epigenetics studies heritable changes in gene activity that do not alter DNA sequence.","chinese":"表观遗传学研究不改变DNA序列但可遗传的基因活性变化。","audioStart":186.745,"audioEnd":192.05,"audioFile":"audio/part-3.mp3"},{"term":"DNA methylation","english":"DNA methylation often represses gene expression when it occurs near promoters.","chinese":"DNA甲基化发生在启动子附近时常常抑制基因表达。","audioStart":192.37,"audioEnd":197.375,"audioFile":"audio/part-3.mp3"},{"term":"CpG island","english":"A CpG island near a promoter is often important for transcriptional control.","chinese":"启动子附近的CpG岛通常对转录控制很重要。","audioStart":197.695,"audioEnd":202.45,"audioFile":"audio/part-3.mp3"},{"term":"histone modification","english":"Histone modification changes how tightly DNA is packaged around histones.","chinese":"组蛋白修饰改变DNA围绕组蛋白包装的紧密程度。","audioStart":202.782,"audioEnd":207.5,"audioFile":"audio/part-3.mp3"},{"term":"histone acetylation","english":"Histone acetylation generally opens chromatin and promotes transcription.","chinese":"组蛋白乙酰化通常打开染色质并促进转录。","audioStart":207.832,"audioEnd":212.325,"audioFile":"audio/part-3.mp3"},{"term":"histone methylation","english":"Histone methylation can activate or repress transcription depending on the modified residue.","chinese":"组蛋白甲基化可激活或抑制转录，取决于被修饰的残基。","audioStart":212.657,"audioEnd":217.925,"audioFile":"audio/part-3.mp3"},{"term":"chromatin","english":"Chromatin packages DNA while controlling how accessible genes are to regulatory proteins.","chinese":"染色质包装DNA，同时控制基因对调控蛋白的可及性。","audioStart":218.245,"audioEnd":223.737,"audioFile":"audio/part-3.mp3"},{"term":"euchromatin","english":"Euchromatin is relatively open and usually enriched for active genes.","chinese":"常染色质相对开放，通常富含活跃基因。","audioStart":224.057,"audioEnd":228.437,"audioFile":"audio/part-3.mp3"},{"term":"heterochromatin","english":"Heterochromatin is compact and often associated with transcriptional repression.","chinese":"异染色质结构紧密，常与转录抑制相关。","audioStart":228.757,"audioEnd":233.5,"audioFile":"audio/part-3.mp3"},{"term":"chromatin remodeling","english":"Chromatin remodeling moves or alters nucleosomes to expose or hide regulatory DNA.","chinese":"染色质重塑移动或改变核小体，从而暴露或隐藏调控DNA。","audioStart":233.82,"audioEnd":239.475,"audioFile":"audio/part-3.mp3"},{"term":"nucleosome","english":"A nucleosome is the basic unit of chromatin, with DNA wrapped around histone proteins.","chinese":"核小体是染色质的基本单位，由DNA缠绕组蛋白构成。","audioStart":239.795,"audioEnd":245.387,"audioFile":"audio/part-3.mp3"},{"term":"histone deacetylase, HDAC","english":"Histone deacetylase, HDAC, removes acetyl groups and often reduces gene expression.","chinese":"组蛋白去乙酰化酶去除乙酰基，并常常降低基因表达。","audioStart":245.707,"audioEnd":252.337,"audioFile":"audio/part-3.mp3"},{"term":"DNA methyltransferase, DNMT","english":"DNA methyltransferase, DNMT, writes methylation marks onto DNA.","chinese":"DNA甲基转移酶在DNA上写入甲基化标记。","audioStart":252.657,"audioEnd":258.637,"audioFile":"audio/part-3.mp3"},{"term":"ChIP-seq","english":"ChIP-seq maps where a protein or histone modification is enriched across the genome.","chinese":"ChIP-seq绘制某种蛋白或组蛋白修饰在全基因组中的富集位置。","audioStart":258.957,"audioEnd":264.1,"audioFile":"audio/part-3.mp3"},{"term":"ATAC-seq","english":"ATAC-seq identifies open chromatin regions that are accessible to regulatory proteins.","chinese":"ATAC-seq识别对调控蛋白开放的染色质区域。","audioStart":264.407,"audioEnd":269.987,"audioFile":"audio/part-3.mp3"},{"term":"RNA-seq","english":"RNA-seq measures transcript abundance and reveals changes in gene expression programs.","chinese":"RNA-seq测量转录本丰度，并揭示基因表达程序的变化。","audioStart":270.307,"audioEnd":275.687,"audioFile":"audio/part-3.mp3"},{"term":"single-cell RNA-seq, scRNA-seq","english":"Single-cell RNA-seq, scRNA-seq, reveals differences that bulk sequencing can hide.","chinese":"单细胞RNA测序揭示整体测序可能掩盖的细胞差异。","audioStart":276.007,"audioEnd":281.975,"audioFile":"audio/part-3.mp3"},{"term":"enhancer-promoter interaction","english":"Enhancer-promoter interaction explains how distant regulatory DNA controls a target gene.","chinese":"增强子-启动子相互作用解释远端调控DNA如何控制靶基因。","audioStart":282.295,"audioEnd":288.025,"audioFile":"audio/part-3.mp3"},{"term":"gene editing","english":"Gene editing changes DNA at selected sites to test function or correct disease-causing mutations.","chinese":"基因编辑在特定位点改变DNA，用于检测功能或校正致病突变。","audioStart":288.345,"audioEnd":294.237,"audioFile":"audio/part-3.mp3"},{"term":"genome editing","english":"Genome editing can modify not only genes but also regulatory regions that control gene activity.","chinese":"基因组编辑不仅能改变基因，也能改变控制基因活性的调控区域。","audioStart":294.557,"audioEnd":300.65,"audioFile":"audio/part-3.mp3"},{"term":"gene therapy","english":"Gene therapy aims to treat disease by adding, correcting, silencing, or replacing genetic information.","chinese":"基因治疗旨在通过添加、校正、沉默或替换遗传信息来治疗疾病。","audioStart":300.97,"audioEnd":308.037,"audioFile":"audio/part-3.mp3"},{"term":"CRISPR-Cas9","english":"CRISPR-Cas9 uses a guide RNA to bring Cas9 to a chosen DNA sequence.","chinese":"CRISPR-Cas9利用向导RNA把Cas9带到选定的DNA序列。","audioStart":308.357,"audioEnd":313.462,"audioFile":"audio/part-3.mp3"},{"term":"guide RNA, gRNA","english":"Guide RNA, gRNA, determines which genomic site the editing enzyme will recognize.","chinese":"向导RNA决定编辑酶将识别基因组中的哪个位点。","audioStart":313.795,"audioEnd":319.262,"audioFile":"audio/part-3.mp3"},{"term":"single-guide RNA, sgRNA","english":"Single-guide RNA, sgRNA, combines targeting information with the scaffold needed to bind Cas9.","chinese":"单向导RNA同时包含靶向信息和结合Cas9所需的支架结构。","audioStart":319.582,"audioEnd":326.35,"audioFile":"audio/part-3.mp3"},{"term":"Cas9 nuclease","english":"Cas9 nuclease cuts DNA after it is directed to the target sequence by guide RNA.","chinese":"Cas9核酸酶在向导RNA引导到靶序列后切割DNA。","audioStart":326.67,"audioEnd":332.1,"audioFile":"audio/part-3.mp3"},{"term":"PAM sequence","english":"A PAM sequence is required for Cas9 to recognize and cut the target DNA.","chinese":"PAM序列是Cas9识别并切割靶DNA所必需的。","audioStart":332.42,"audioEnd":337.175,"audioFile":"audio/part-3.mp3"},{"term":"double-strand break, DSB","english":"A double-strand break, DSB, is powerful for editing but risky if repaired incorrectly.","chinese":"DNA双链断裂有利于编辑，但如果修复错误也具有风险。","audioStart":337.495,"audioEnd":343.425,"audioFile":"audio/part-3.mp3"},{"term":"non-homologous end joining, NHEJ","english":"Non-homologous end joining, NHEJ, repairs broken DNA quickly but often introduces small insertions or deletions.","chinese":"非同源末端连接能快速修复断裂DNA，但常引入小的插入或缺失。","audioStart":343.745,"audioEnd":351.487,"audioFile":"audio/part-3.mp3"},{"term":"homology-directed repair, HDR","english":"Homology-directed repair, HDR, can copy a designed sequence into the genome when a repair template is provided.","chinese":"同源定向修复在提供修复模板时可把设计序列复制进基因组。","audioStart":351.807,"audioEnd":358.887,"audioFile":"audio/part-3.mp3"},{"term":"base editing","english":"Base editing changes a single DNA base without creating a double-strand break.","chinese":"碱基编辑无需产生DNA双链断裂即可改变单个碱基。","audioStart":359.22,"audioEnd":364.012,"audioFile":"audio/part-3.mp3"},{"term":"prime editing","english":"Prime editing can introduce precise small edits by using a reverse-transcription mechanism.","chinese":"引导编辑通过逆转录机制引入精确的小片段编辑。","audioStart":364.345,"audioEnd":369.812,"audioFile":"audio/part-3.mp3"},{"term":"off-target effect","english":"An off-target effect occurs when an editing system changes a site other than the intended target.","chinese":"脱靶效应指编辑系统改变了预期靶点之外的位点。","audioStart":0.057,"audioEnd":5.4,"audioFile":"audio/part-4.mp3"},{"term":"on-target editing","english":"On-target editing must be efficient enough to produce a therapeutic benefit.","chinese":"靶向编辑必须足够高效，才能产生治疗获益。","audioStart":5.72,"audioEnd":10.187,"audioFile":"audio/part-4.mp3"},{"term":"knock-in","english":"Knock-in introduces a defined DNA sequence into a specific genomic location.","chinese":"敲入把特定DNA序列插入基因组的指定位置。","audioStart":10.507,"audioEnd":15.662,"audioFile":"audio/part-4.mp3"},{"term":"knockout","english":"Knockout can reveal whether a gene is required for a phenotype or pathway.","chinese":"敲除可以揭示某个基因是否为某种表型或通路所必需。","audioStart":15.982,"audioEnd":20.5,"audioFile":"audio/part-4.mp3"},{"term":"gene correction","english":"Gene correction repairs the disease-causing sequence while preserving normal gene regulation.","chinese":"基因校正修复致病序列，同时保留正常基因调控。","audioStart":20.82,"audioEnd":26.25,"audioFile":"audio/part-4.mp3"},{"term":"loss-of-function mutation","english":"A loss-of-function mutation reduces or abolishes the normal activity of a gene product.","chinese":"功能缺失突变降低或消除基因产物的正常活性。","audioStart":26.57,"audioEnd":32.05,"audioFile":"audio/part-4.mp3"},{"term":"gain-of-function mutation","english":"A gain-of-function mutation gives a gene product a new or excessive activity.","chinese":"功能获得性突变赋予基因产物新的或过强的活性。","audioStart":32.37,"audioEnd":37.162,"audioFile":"audio/part-4.mp3"},{"term":"viral vector","english":"A viral vector takes advantage of viral entry mechanisms to deliver genetic material.","chinese":"病毒载体利用病毒进入细胞的机制来递送遗传材料。","audioStart":37.482,"audioEnd":42.812,"audioFile":"audio/part-4.mp3"},{"term":"adeno-associated virus, AAV","english":"Adeno-associated virus, AAV, is widely used because it can deliver genes with relatively low pathogenicity.","chinese":"腺相关病毒因能以相对低致病性递送基因而被广泛使用。","audioStart":43.132,"audioEnd":50.687,"audioFile":"audio/part-4.mp3"},{"term":"lentiviral vector","english":"A lentiviral vector can integrate genetic material into dividing and non-dividing cells.","chinese":"慢病毒载体可以把遗传材料整合进分裂和非分裂细胞。","audioStart":51.007,"audioEnd":56.425,"audioFile":"audio/part-4.mp3"},{"term":"retroviral vector","english":"A retroviral vector integrates into the host genome, which can provide stable expression but raises safety concerns.","chinese":"逆转录病毒载体会整合进宿主基因组，可提供稳定表达，但也带来安全性问题。","audioStart":56.745,"audioEnd":63.625,"audioFile":"audio/part-4.mp3"},{"term":"delivery system","english":"A delivery system is often the limiting step between a successful edit in cells and a useful therapy in patients.","chinese":"递送系统常常是从细胞中成功编辑走向患者治疗的限制步骤。","audioStart":63.945,"audioEnd":70.4,"audioFile":"audio/part-4.mp3"},{"term":"lipid nanoparticle, LNP","english":"Lipid nanoparticle, LNP, can package RNA and protect it during delivery into cells.","chinese":"脂质纳米颗粒可以包装RNA，并在递送入细胞时保护RNA。","audioStart":70.72,"audioEnd":76.837,"audioFile":"audio/part-4.mp3"},{"term":"ex vivo gene therapy","english":"Ex vivo gene therapy modifies patient cells outside the body before returning them.","chinese":"离体基因治疗先在体外修改患者细胞，再将其回输体内。","audioStart":77.157,"audioEnd":82.237,"audioFile":"audio/part-4.mp3"},{"term":"in vivo gene therapy","english":"In vivo gene therapy delivers the therapeutic system directly into the patient.","chinese":"体内基因治疗把治疗系统直接递送进患者体内。","audioStart":82.557,"audioEnd":87.25,"audioFile":"audio/part-4.mp3"},{"term":"transgene","english":"A transgene is an introduced gene that provides a function the cell lacks or needs more of.","chinese":"外源基因是被引入的基因，用来提供细胞缺失或需要增强的功能。","audioStart":87.57,"audioEnd":92.812,"audioFile":"audio/part-4.mp3"},{"term":"therapeutic gene","english":"A therapeutic gene is selected because its expression can correct or compensate for disease biology.","chinese":"治疗性基因被选择，是因为其表达能够校正或补偿疾病生物学异常。","audioStart":93.132,"audioEnd":98.85,"audioFile":"audio/part-4.mp3"},{"term":"genetic disorder","english":"A genetic disorder results from changes in DNA that disrupt normal biological function.","chinese":"遗传病由破坏正常生物学功能的DNA改变引起。","audioStart":99.17,"audioEnd":104.65,"audioFile":"audio/part-4.mp3"},{"term":"monogenic disease","english":"A monogenic disease is caused primarily by defects in a single gene.","chinese":"单基因病主要由单个基因缺陷导致。","audioStart":104.97,"audioEnd":109.375,"audioFile":"audio/part-4.mp3"},{"term":"sickle cell disease","english":"Sickle cell disease shows how one point mutation can alter blood cell shape and function.","chinese":"镰状细胞病说明一个点突变如何改变血细胞形态和功能。","audioStart":109.695,"audioEnd":114.637,"audioFile":"audio/part-4.mp3"},{"term":"cystic fibrosis","english":"Cystic fibrosis is caused by CFTR defects that disturb salt and water transport.","chinese":"囊性纤维化由CFTR缺陷引起，导致盐和水转运紊乱。","audioStart":114.957,"audioEnd":120.525,"audioFile":"audio/part-4.mp3"},{"term":"Duchenne muscular dystrophy, DMD","english":"Duchenne muscular dystrophy, DMD, results from loss of dystrophin and progressive muscle damage.","chinese":"杜氏肌营养不良由抗肌萎缩蛋白缺失导致，并造成进行性肌肉损伤。","audioStart":120.857,"audioEnd":127.012,"audioFile":"audio/part-4.mp3"},{"term":"safety profile","english":"The safety profile of a therapy includes both immediate toxicity and long-term risk.","chinese":"一种疗法的安全性特征包括即时毒性和长期风险。","audioStart":127.32,"audioEnd":132.462,"audioFile":"audio/part-4.mp3"},{"term":"immune response","english":"An immune response against a vector or editor can reduce efficacy and increase adverse effects.","chinese":"针对载体或编辑器的免疫反应会降低疗效并增加不良反应。","audioStart":132.782,"audioEnd":138.462,"audioFile":"audio/part-4.mp3"},{"term":"clinical trial","english":"A clinical trial tests whether a therapy is safe and effective in human participants.","chinese":"临床试验检验一种疗法在人体中是否安全有效。","audioStart":138.782,"audioEnd":143.787,"audioFile":"audio/part-4.mp3"},{"term":"gut microbiota","english":"Gut microbiota can influence digestion, immunity, metabolism, and even responses to therapy.","chinese":"肠道菌群能够影响消化、免疫、代谢，甚至影响治疗反应。","audioStart":144.12,"audioEnd":150.537,"audioFile":"audio/part-4.mp3"},{"term":"gut microbiome","english":"The gut microbiome includes microbial genes that expand the metabolic capacity of the host.","chinese":"肠道微生物组包括微生物基因，它们扩展了宿主的代谢能力。","audioStart":150.857,"audioEnd":156.662,"audioFile":"audio/part-4.mp3"},{"term":"microbiota","english":"Microbiota refers to the community of microorganisms living in a particular environment.","chinese":"微生物群指生活在特定环境中的微生物群落。","audioStart":156.982,"audioEnd":162.462,"audioFile":"audio/part-4.mp3"},{"term":"microbiome","english":"The microbiome includes microorganisms and their collective genetic material.","chinese":"微生物组包括微生物及其全部遗传物质。","audioStart":162.795,"audioEnd":167.562,"audioFile":"audio/part-4.mp3"},{"term":"commensal bacteria","english":"Commensal bacteria often benefit from the host while helping maintain immune balance.","chinese":"共生菌通常从宿主获益，同时帮助维持免疫平衡。","audioStart":167.882,"audioEnd":172.887,"audioFile":"audio/part-4.mp3"},{"term":"pathogen","english":"A pathogen causes disease by damaging host tissues or disrupting normal physiology.","chinese":"病原体通过损伤宿主组织或扰乱正常生理功能引起疾病。","audioStart":173.207,"audioEnd":178.425,"audioFile":"audio/part-4.mp3"},{"term":"opportunistic pathogen","english":"An opportunistic pathogen becomes harmful when host defenses or microbial balance are weakened.","chinese":"条件致病菌在宿主防御或菌群平衡受损时会变得有害。","audioStart":178.745,"audioEnd":184.462,"audioFile":"audio/part-4.mp3"},{"term":"probiotics","english":"Probiotics are live microorganisms intended to provide a health benefit when taken in adequate amounts.","chinese":"益生菌是摄入足量时预期能带来健康益处的活微生物。","audioStart":184.782,"audioEnd":190.925,"audioFile":"audio/part-4.mp3"},{"term":"prebiotics","english":"Prebiotics feed beneficial microbes rather than directly adding new organisms.","chinese":"益生元不是直接添加新微生物，而是为有益菌提供营养。","audioStart":191.245,"audioEnd":196.125,"audioFile":"audio/part-4.mp3"},{"term":"synbiotics","english":"Synbiotics combine probiotics and prebiotics to support beneficial microbial activity.","chinese":"合生元结合益生菌和益生元，以支持有益微生物活动。","audioStart":196.445,"audioEnd":202.125,"audioFile":"audio/part-4.mp3"},{"term":"dysbiosis","english":"Dysbiosis describes an imbalanced microbial community that may contribute to disease.","chinese":"菌群失调指可能促进疾病的不平衡微生物群落。","audioStart":202.457,"audioEnd":207.787,"audioFile":"audio/part-4.mp3"},{"term":"microbial diversity","english":"Microbial diversity is often considered a marker of ecosystem stability in the gut.","chinese":"微生物多样性常被视为肠道生态系统稳定性的标志。","audioStart":208.12,"audioEnd":213.5,"audioFile":"audio/part-4.mp3"},{"term":"alpha diversity","english":"Alpha diversity measures how many types of microbes are present within one sample.","chinese":"alpha多样性衡量一个样本内部有多少类微生物。","audioStart":213.82,"audioEnd":218.662,"audioFile":"audio/part-4.mp3"},{"term":"beta diversity","english":"Beta diversity compares microbial community differences between samples or groups.","chinese":"beta多样性比较不同样本或组别之间的微生物群落差异。","audioStart":218.982,"audioEnd":224.162,"audioFile":"audio/part-4.mp3"},{"term":"Firmicutes","english":"Firmicutes include many gut bacteria involved in fermenting dietary components.","chinese":"厚壁菌门包括许多参与发酵膳食成分的肠道细菌。","audioStart":224.482,"audioEnd":229.575,"audioFile":"audio/part-4.mp3"},{"term":"Bacteroidetes","english":"Bacteroidetes are important for breaking down complex carbohydrates in the gut.","chinese":"拟杆菌门对分解肠道中的复杂碳水化合物很重要。","audioStart":229.907,"audioEnd":234.537,"audioFile":"audio/part-4.mp3"},{"term":"Proteobacteria","english":"Proteobacteria expansion is often viewed as a sign of microbial imbalance or inflammation.","chinese":"变形菌门扩增常被视为菌群失衡或炎症的信号。","audioStart":234.857,"audioEnd":240.587,"audioFile":"audio/part-4.mp3"},{"term":"Actinobacteria","english":"Actinobacteria include beneficial genera such as Bifidobacterium.","chinese":"放线菌门包括双歧杆菌属等有益菌属。","audioStart":240.907,"audioEnd":245.312,"audioFile":"audio/part-4.mp3"},{"term":"Lactobacillus","english":"Lactobacillus can produce lactic acid and help maintain a protective microbial environment.","chinese":"乳酸杆菌属能够产生乳酸，并帮助维持保护性微生物环境。","audioStart":245.632,"audioEnd":251.375,"audioFile":"audio/part-4.mp3"},{"term":"Bifidobacterium","english":"Bifidobacterium is often enriched in infants and can support intestinal health.","chinese":"双歧杆菌属常在婴儿肠道中富集，并可支持肠道健康。","audioStart":251.695,"audioEnd":256.487,"audioFile":"audio/part-4.mp3"},{"term":"Escherichia coli","english":"Escherichia coli can be a harmless commensal strain or a dangerous pathogen depending on the strain.","chinese":"大肠杆菌可根据菌株不同表现为无害共生菌或危险病原体。","audioStart":256.807,"audioEnd":262.262,"audioFile":"audio/part-4.mp3"},{"term":"Akkermansia muciniphila","english":"Akkermansia muciniphila degrades mucin and is often linked to metabolic health.","chinese":"嗜黏蛋白阿克曼菌降解黏蛋白，并常与代谢健康相关。","audioStart":262.582,"audioEnd":267.362,"audioFile":"audio/part-4.mp3"},{"term":"short-chain fatty acids, SCFAs","english":"Short-chain fatty acids, SCFAs, connect microbial fermentation with host immune and metabolic regulation.","chinese":"短链脂肪酸把微生物发酵与宿主免疫和代谢调控联系起来。","audioStart":267.682,"audioEnd":274.712,"audioFile":"audio/part-4.mp3"},{"term":"acetate","english":"Acetate is the most abundant short-chain fatty acid produced by gut microbes.","chinese":"乙酸盐是肠道微生物产生的最丰富短链脂肪酸。","audioStart":275.032,"audioEnd":279.812,"audioFile":"audio/part-4.mp3"},{"term":"propionate","english":"Propionate can influence liver metabolism and appetite-related signaling.","chinese":"丙酸盐可以影响肝脏代谢和食欲相关信号。","audioStart":280.12,"audioEnd":284.637,"audioFile":"audio/part-4.mp3"},{"term":"butyrate","english":"Butyrate fuels colon cells and supports anti-inflammatory immune responses.","chinese":"丁酸盐为结肠细胞供能，并支持抗炎免疫反应。","audioStart":284.957,"audioEnd":289.875,"audioFile":"audio/part-4.mp3"},{"term":"bile acid metabolism","
