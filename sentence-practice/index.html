english":"Bile acid metabolism is shaped by both the liver and gut microbes.","chinese":"胆汁酸代谢同时受到肝脏和肠道微生物的影响。","audioStart":290.207,"audioEnd":294.4,"audioFile":"audio/part-4.mp3"},{"term":"intestinal barrier","english":"The intestinal barrier prevents microbes and toxins from freely entering host tissues.","chinese":"肠屏障防止微生物和毒素自由进入宿主组织。","audioStart":294.695,"audioEnd":299.725,"audioFile":"audio/part-4.mp3"},{"term":"tight junction","english":"Tight junction proteins seal the space between epithelial cells.","chinese":"紧密连接蛋白封闭上皮细胞之间的间隙。","audioStart":300.045,"audioEnd":304.112,"audioFile":"audio/part-4.mp3"},{"term":"mucosal immunity","english":"Mucosal immunity must defend against pathogens without overreacting to food or commensal microbes.","chinese":"黏膜免疫必须抵御病原体，同时不能对食物或共生菌过度反应。","audioStart":304.445,"audioEnd":310.6,"audioFile":"audio/part-4.mp3"},{"term":"gut-brain axis","english":"The gut-brain axis allows microbial signals to influence neural and behavioral processes.","chinese":"肠脑轴使微生物信号能够影响神经和行为过程。","audioStart":310.907,"audioEnd":316.375,"audioFile":"audio/part-4.mp3"},{"term":"fecal microbiota transplantation, FMT","english":"Fecal microbiota transplantation, FMT, transfers a whole microbial community from a donor to a recipient.","chinese":"粪菌移植把供体的完整微生物群落转移给受体。","audioStart":316.695,"audioEnd":324.537,"audioFile":"audio/part-4.mp3"},{"term":"metagenomics","english":"Metagenomics analyzes microbial DNA directly from environmental or clinical samples.","chinese":"宏基因组学直接分析环境或临床样本中的微生物DNA。","audioStart":324.857,"audioEnd":330.55,"audioFile":"audio/part-4.mp3"},{"term":"16S rRNA sequencing","english":"16S rRNA sequencing profiles bacterial communities by reading a conserved marker gene.","chinese":"16S rRNA测序通过读取保守标记基因来分析细菌群落。","audioStart":330.87,"audioEnd":336.8,"audioFile":"audio/part-4.mp3"},{"term":"host-microbe interaction","english":"Host-microbe interaction can shape immunity, nutrition, and susceptibility to disease.","chinese":"宿主-微生物相互作用能够影响免疫、营养和疾病易感性。","audioStart":337.12,"audioEnd":342.712,"audioFile":"audio/part-4.mp3"},{"term":"inflammatory bowel disease, IBD","english":"Inflammatory bowel disease, IBD, involves chronic intestinal inflammation and disrupted barrier function.","chinese":"炎症性肠病涉及慢性肠道炎症和屏障功能受损。","audioStart":343.032,"audioEnd":349.937,"audioFile":"audio/part-4.mp3"},{"term":"Crohn's disease","english":"Crohn's disease can affect any part of the gastrointestinal tract and often shows patchy inflammation.","chinese":"克罗恩病可影响胃肠道任何部位，并常表现为节段性炎症。","audioStart":350.257,"audioEnd":356.112,"audioFile":"audio/part-4.mp3"},{"term":"ulcerative colitis","english":"Ulcerative colitis mainly affects the colon and involves continuous mucosal inflammation.","chinese":"溃疡性结肠炎主要影响结肠，并表现为连续性黏膜炎症。","audioStart":356.432,"audioEnd":361.712,"audioFile":"audio/part-4.mp3"},{"term":"tumor immunology","english":"Tumor immunology studies how cancer cells are recognized, ignored, or eliminated by the immune system.","chinese":"肿瘤免疫学研究癌细胞如何被免疫系统识别、忽视或清除。","audioStart":362.032,"audioEnd":369.062,"audioFile":"audio/part-4.mp3"},{"term":"cancer immunotherapy","english":"Cancer immunotherapy treats tumors by strengthening or redirecting immune responses.","chinese":"肿瘤免疫治疗通过增强或重定向免疫反应来治疗肿瘤。","audioStart":369.382,"audioEnd":374.725,"audioFile":"audio/part-4.mp3"},{"term":"tumor microenvironment, TME","english":"The tumor microenvironment, TME, contains immune cells, stromal cells, vessels, and suppressive signals.","chinese":"肿瘤微环境包含免疫细胞、基质细胞、血管和抑制性信号。","audioStart":375.045,"audioEnd":382.775,"audioFile":"audio/part-4.mp3"},{"term":"immune surveillance","english":"Immune surveillance can eliminate abnormal cells before they become clinically detectable tumors.","chinese":"免疫监视可以在异常细胞发展为临床可检测肿瘤之前将其清除。","audioStart":383.095,"audioEnd":388.7,"audioFile":"audio/part-4.mp3"},{"term":"immune evasion","english":"Immune evasion allows tumor cells to survive despite the presence of antitumor immunity.","chinese":"免疫逃逸使肿瘤细胞即使在抗肿瘤免疫存在时也能存活。","audioStart":389.02,"audioEnd":394.45,"audioFile":"audio/part-4.mp3"},{"term":"tumor antigen","english":"A tumor antigen can be recognized by T cells if it is properly presented on MHC molecules.","chinese":"肿瘤抗原如果被MHC分子正确呈递，就能被T细胞识别。","audioStart":394.77,"audioEnd":400.8,"audioFile":"audio/part-4.mp3"},{"term":"neoantigen","english":"A neoantigen arises from tumor-specific mutations and is absent from normal tissues.","chinese":"新生抗原来源于肿瘤特异性突变，在正常组织中不存在。","audioStart":401.12,"audioEnd":406.575,"audioFile":"audio/part-4.mp3"},{"term":"antigen presentation","english":"Antigen presentation links intracellular protein degradation to T-cell recognition.","chinese":"抗原呈递把细胞内蛋白降解与T细胞识别联系起来。","audioStart":406.895,"audioEnd":412.1,"audioFile":"audio/part-4.mp3"},{"term":"major histocompatibility complex, MHC","english":"Major histocompatibility complex, MHC, molecules display peptide fragments to T cells.","chinese":"主要组织相容性复合体分子向T细胞展示肽片段。","audioStart":412.42,"audioEnd":418.712,"audioFile":"audio/part-4.mp3"},{"term":"T cell","english":"A T cell can kill infected or malignant cells after recognizing a specific antigen.","chinese":"T细胞在识别特定抗原后可以杀伤感染细胞或恶性细胞。","audioStart":419.032,"audioEnd":424.587,"audioFile":"audio/part-4.mp3"},{"term":"B cell","english":"A B cell can produce antibodies and also present antigen to T cells.","chinese":"B细胞能够产生抗体，也能向T细胞呈递抗原。","audioStart":424.882,"audioEnd":429.387,"audioFile":"audio/part-4.mp3"},{"term":"natural killer cell, NK cell","english":"A natural killer cell, NK cell, can kill abnormal cells without prior antigen sensitization.","chinese":"自然杀伤细胞无需事先抗原致敏即可杀伤异常细胞。","audioStart":429.707,"audioEnd":435.85,"audioFile":"audio/part-4.mp3"},{"term":"dendritic cell, DC","english":"A dendritic cell, DC, is highly effective at priming naive T cells.","chinese":"树突状细胞非常擅长启动初始T细胞反应。","audioStart":436.145,"audioEnd":440.425,"audioFile":"audio/part-4.mp3"},{"term":"macrophage","english":"A macrophage can destroy pathogens, clear debris, or support tissue repair depending on its state.","chinese":"巨噬细胞可根据状态不同杀灭病原体、清除碎片或支持组织修复。","audioStart":440.745,"audioEnd":446.925,"audioFile":"audio/part-4.mp3"},{"term":"tumor-associated macrophage, TAM","english":"Tumor-associated macrophage, TAM, often supports tumor growth by suppressing T cells and promoting angiogenesis.","chinese":"肿瘤相关巨噬细胞常通过抑制T细胞和促进血管生成来支持肿瘤生长。","audioStart":447.245,"audioEnd":454.937,"audioFile":"audio/part-4.mp3"},{"term":"myeloid-derived suppressor cell, MDSC","english":"Myeloid-derived suppressor cell, MDSC, weakens antitumor immunity in many cancers.","chinese":"髓源性抑制细胞在多种癌症中削弱抗肿瘤免疫。","audioStart":455.257,"audioEnd":461.4,"audioFile":"audio/part-4.mp3"},{"term":"regulatory T cell, Treg","english":"Regulatory T cell, Treg, prevents excessive immunity but can also suppress antitumor responses.","chinese":"调节性T细胞防止免疫过度，但也可能抑制抗肿瘤反应。","audioStart":461.72,"audioEnd":468.55,"audioFile":"audio/part-4.mp3"},{"term":"cytotoxic T lymphocyte, CTL","english":"Cytotoxic T lymphocyte, CTL, kills target cells by releasing perforin and granzymes.","chinese":"细胞毒性T淋巴细胞通过释放穿孔素和颗粒酶杀伤靶细胞。","audioStart":468.857,"audioEnd":475.512,"audioFile":"audio/part-4.mp3"},{"term":"immune checkpoint","english":"An immune checkpoint restrains immune activation and can be exploited by tumors.","chinese":"免疫检查点限制免疫激活，也可能被肿瘤利用。","audioStart":475.832,"audioEnd":480.625,"audioFile":"audio/part-4.mp3"},{"term":"PD-1","english":"PD-1 is an inhibitory receptor that marks exhausted or restrained T cells.","chinese":"PD-1是一种抑制性受体，常标志耗竭或受抑制的T细胞。","audioStart":480.932,"audioEnd":486.037,"audioFile":"audio/part-4.mp3"},{"term":"PD-L1","english":"PD-L1 on tumor cells can bind PD-1 and reduce T-cell attack.","chinese":"肿瘤细胞上的PD-L1可结合PD-1并降低T细胞攻击。","audioStart":486.332,"audioEnd":490.912,"audioFile":"audio/part-4.mp3"},{"term":"CTLA-4","english":"CTLA-4 limits early T-cell activation by competing with costimulatory receptors.","chinese":"CTLA-4通过与共刺激受体竞争来限制早期T细胞激活。","audioStart":491.195,"audioEnd":496.7,"audioFile":"audio/part-4.mp3"},{"term":"checkpoint blockade","english":"Checkpoint blockade releases inhibitory brakes on immune cells.","chinese":"免疫检查点阻断解除免疫细胞上的抑制性刹车。","audioStart":497.02,"audioEnd":500.95,"audioFile":"audio/part-4.mp3"},{"term":"immune checkpoint inhibitor, ICI","english":"An immune checkpoint inhibitor, ICI, can produce durable responses but only in a subset of patients.","chinese":"免疫检查点抑制剂可产生持久应答，但只发生在部分患者中。","audioStart":501.27,"audioEnd":507.637,"audioFile":"audio/part-4.mp3"},{"term":"monoclonal antibody","english":"A monoclonal antibody binds one specific target with high selectivity.","chinese":"单克隆抗体以高度选择性结合一个特定靶点。","audioStart":507.957,"audioEnd":512.575,"audioFile":"audio/part-4.mp3"},{"term":"cytokine","english":"A cytokine is a soluble signal that coordinates communication between immune cells.","chinese":"细胞因子是协调免疫细胞间交流的可溶性信号。","audioStart":512.857,"audioEnd":517.925,"audioFile":"audio/part-4.mp3"},{"term":"interleukin","english":"An interleukin regulates immune cell growth, differentiation, or activation.","chinese":"白细胞介素调节免疫细胞的生长、分化或激活。","audioStart":518.207,"audioEnd":523.337,"audioFile":"audio/part-4.mp3"},{"term":"interferon","english":"Interferon helps establish antiviral states and can increase antigen presentation.","chinese":"干扰素帮助建立抗病毒状态，并能增强抗原呈递。","audioStart":523.67,"audioEnd":528.925,"audioFile":"audio/part-4.mp3"},{"term":"tumor-infiltrating lymphocyte, TIL","english":"Tumor-infiltrating lymphocyte, TIL, indicates that immune cells have entered the tumor tissue.","chinese":"肿瘤浸润淋巴细胞表明免疫细胞已经进入肿瘤组织。","audioStart":529.245,"audioEnd":535.062,"audioFile":"audio/part-4.mp3"},{"term":"CAR-T cell therapy","english":"CAR-T cell therapy engineers T cells to recognize tumor antigens through a synthetic receptor.","chinese":"CAR-T细胞治疗通过合成受体改造T细胞，使其识别肿瘤抗原。","audioStart":535.382,"audioEnd":541.262,"audioFile":"audio/part-4.mp3"},{"term":"chimeric antigen receptor, CAR","english":"A chimeric antigen receptor, CAR, combines antigen recognition with T-cell activation signals.","chinese":"嵌合抗原受体把抗原识别与T细胞激活信号结合起来。","audioStart":541.582,"audioEnd":548.637,"audioFile":"audio/part-4.mp3"},{"term":"TCR-T therapy","english":"TCR-T therapy engineers T cells with a defined T-cell receptor that recognizes peptide-MHC complexes.","chinese":"TCR-T细胞治疗用特定T细胞受体改造T细胞，使其识别肽-MHC复合物。","audioStart":548.957,"audioEnd":556.05,"audioFile":"audio/part-4.mp3"},{"term":"NK cell therapy","english":"NK cell therapy aims to use innate cytotoxicity against tumors with less dependence on antigen presentation.","chinese":"NK细胞治疗旨在利用先天细胞毒性抗肿瘤，对抗原呈递的依赖较低。","audioStart":556.357,"audioEnd":563.187,"audioFile":"audio/part-4.mp3"},{"term":"adoptive cell therapy, ACT","english":"Adoptive cell therapy, ACT, expands or engineers immune cells before infusing them into the patient.","chinese":"过继性细胞治疗先扩增或改造免疫细胞，再将其输回患者体内。","audioStart":563.507,"audioEnd":569.825,"audioFile":"audio/part-4.mp3"},{"term":"cytokine release syndrome, CRS","english":"Cytokine release syndrome, CRS, is a dangerous inflammatory reaction after strong immune activation.","chinese":"细胞因子释放综合征是强烈免疫激活后出现的危险炎症反应。","audioStart":570.145,"audioEnd":576.8,"audioFile":"audio/part-4.mp3"},{"term":"immune-related adverse events, irAEs","english":"Immune-related adverse events, irAEs, occur when immunotherapy activates immune attack against normal tissues.","chinese":"免疫相关不良事件发生于免疫治疗激活了针对正常组织的免疫攻击。","audioStart":577.12,"audioEnd":584.6,"audioFile":"audio/part-4.mp3"},{"term":"tumor mutation burden, TMB","english":"Tumor mutation burden, TMB, can predict the likelihood of neoantigen formation.","chinese":"肿瘤突变负荷可以预测新生抗原形成的可能性。","audioStart":584.92,"audioEnd":590.425,"audioFile":"audio/part-4.mp3"},{"term":"microsatellite instability, MSI","english":"Microsatellite instability, MSI, reflects defective DNA mismatch repair in many tumors.","chinese":"微卫星不稳定性反映许多肿瘤中DNA错配修复缺陷。","audioStart":590.757,"audioEnd":596.95,"audioFile":"audio/part-4.mp3"},{"term":"cold tumor","english":"A cold tumor has few immune cells and usually responds poorly to checkpoint blockade.","chinese":"冷肿瘤含有较少免疫细胞，通常对免疫检查点阻断反应较差。","audioStart":0.057,"audioEnd":4.987,"audioFile":"audio/part-5.mp3"},{"term":"hot tumor","english":"A hot tumor contains active immune infiltration and is more likely to respond to immunotherapy.","chinese":"热肿瘤含有活跃免疫浸润，更可能对免疫治疗产生应答。","audioStart":5.282,"audioEnd":10.987,"audioFile":"audio/part-5.mp3"},{"term":"metastasis","english":"Metastasis occurs when cancer cells spread and grow at distant sites.","chinese":"转移指癌细胞扩散并在远处部位生长。","audioStart":11.295,"audioEnd":15.687,"audioFile":"audio/part-5.mp3"},{"term":"angiogenesis","english":"Angiogenesis supplies tumors with blood vessels needed for oxygen and nutrients.","chinese":"血管生成向肿瘤提供其所需氧气和营养物质的血管。","audioStart":16.007,"audioEnd":21.0,"audioFile":"audio/part-5.mp3"},{"term":"epithelial-mesenchymal transition, EMT","english":"Epithelial-mesenchymal transition, EMT, gives cancer cells more migratory and invasive traits.","chinese":"上皮-间质转化赋予癌细胞更强迁移和侵袭特征。","audioStart":21.32,"audioEnd":27.925,"audioFile":"audio/part-5.mp3"},{"term":"relapse","english":"Relapse may occur when residual cancer cells survive initial therapy.","chinese":"复发可能发生于残留癌细胞在初始治疗后仍然存活。","audioStart":28.245,"audioEnd":32.575,"audioFile":"audio/part-5.mp3"},{"term":"drug resistance","english":"Drug resistance can arise through target mutation, pathway rewiring, or altered drug transport.","chinese":"耐药性可由靶点突变、通路重塑或药物转运改变产生。","audioStart":32.895,"audioEnd":39.037,"audioFile":"audio/part-5.mp3"},{"term":"is associated with","english":"High expression of the marker is associated with poor survival in patients.","chinese":"该标志物高表达与患者较差生存率相关。","audioStart":39.357,"audioEnd":43.725,"audioFile":"audio/part-5.mp3"},{"term":"contributes to","english":"Mitochondrial damage contributes to inflammation by releasing danger signals.","chinese":"线粒体损伤通过释放危险信号促进炎症。","audioStart":44.045,"audioEnd":48.787,"audioFile":"audio/part-5.mp3"},{"term":"plays a critical role in","english":"Autophagy plays a critical role in helping cells survive nutrient deprivation.","chinese":"自噬在帮助细胞应对营养缺乏中发挥关键作用。","audioStart":49.07,"audioEnd":53.862,"audioFile":"audio/part-5.mp3"},{"term":"is required for","english":"Cas9 activity is required for efficient genome editing in this system.","chinese":"在该系统中，高效基因组编辑需要Cas9活性。","audioStart":54.182,"audioEnd":58.8,"audioFile":"audio/part-5.mp3"},{"term":"is sufficient to","english":"Activation of this transcription factor is sufficient to induce neuronal differentiation.","chinese":"激活该转录因子足以诱导神经元分化。","audioStart":59.12,"audioEnd":64.225,"audioFile":"audio/part-5.mp3"},{"term":"leads to","english":"Loss of barrier integrity leads to increased microbial translocation.","chinese":"屏障完整性丧失会导致微生物移位增加。","audioStart":64.545,"audioEnd":68.987,"audioFile":"audio/part-5.mp3"},{"term":"results in","english":"Inhibition of the pathway results in reduced tumor cell proliferation.","chinese":"抑制该通路会导致肿瘤细胞增殖下降。","audioStart":69.307,"audioEnd":73.562,"audioFile":"audio/part-5.mp3"},{"term":"is mediated by","english":"The anti-inflammatory effect is mediated by short-chain fatty acids.","chinese":"这种抗炎作用由短链脂肪酸介导。","audioStart":73.857,"audioEnd":78.075,"audioFile":"audio/part-5.mp3"},{"term":"is regulated by","english":"PD-L1 expression is regulated by inflammatory signaling in the tumor microenvironment.","chinese":"PD-L1表达受肿瘤微环境中炎症信号调控。","audioStart":78.395,"audioEnd":83.937,"audioFile":"audio/part-5.mp3"},{"term":"is involved in","english":"Chromatin remodeling is involved in the activation of lineage-specific genes.","chinese":"染色质重塑参与谱系特异性基因的激活。","audioStart":84.257,"audioEnd":89.037,"audioFile":"audio/part-5.mp3"},{"term":"is enriched in","english":"This histone mark is enriched in active enhancer regions.","chinese":"这种组蛋白标记在活跃增强子区域富集。","audioStart":89.345,"audioEnd":92.887,"audioFile":"audio/part-5.mp3"},{"term":"is upregulated","english":"The cytokine is upregulated after viral infection.","chinese":"病毒感染后，该细胞因子表达上调。","audioStart":93.195,"audioEnd":96.737,"audioFile":"audio/part-5.mp3"},{"term":"is downregulated","english":"The metabolic enzyme is downregulated in aged tissues.","chinese":"该代谢酶在衰老组织中表达下调。","audioStart":97.07,"audioEnd":100.837,"audioFile":"audio/part-5.mp3"},{"term":"loss of function","english":"Loss of function in the receptor reduces cellular sensitivity to the ligand.","chinese":"受体功能缺失会降低细胞对配体的敏感性。","audioStart":101.157,"audioEnd":105.862,"audioFile":"audio/part-5.mp3"},{"term":"gain of function","english":"Gain of function in the kinase drives abnormal cell proliferation.","chinese":"激酶功能获得会驱动异常细胞增殖。","audioStart":106.182,"audioEnd":110.275,"audioFile":"audio/part-5.mp3"},{"term":"compared with the control group","english":"Compared with the control group, treated mice showed lower inflammatory scores.","chinese":"与对照组相比，处理组小鼠炎症评分更低。","audioStart":110.595,"audioEnd":115.0,"audioFile":"audio/part-5.mp3"},{"term":"these findings suggest that","english":"These findings suggest that gut microbes influence the efficacy of immunotherapy.","chinese":"这些发现表明肠道微生物会影响免疫治疗的疗效。","audioStart":115.295,"audioEnd":119.962,"audioFile":"audio/part-5.mp3"},{"term":"further studies are needed","english":"Further studies are needed to determine whether this mechanism also applies to humans.","chinese":"仍需进一步研究以确定该机制是否也适用于人类。","audioStart":120.282,"audioEnd":125.175,"audioFile":"audio/part-5.mp3"},{"term":"underlying mechanism","english":"The underlying mechanism may involve changes in mitochondrial metabolism.","chinese":"其潜在机制可能涉及线粒体代谢变化。","audioStart":125.47,"audioEnd":130.137,"audioFile":"audio/part-5.mp3"},{"term":"therapeutic potential","english":"The edited cells showed therapeutic potential in a mouse model of the disease.","chinese":"编辑后的细胞在该疾病小鼠模型中显示出治疗潜力。","audioStart":130.432,"audioEnd":134.787,"audioFile":"audio/part-5.mp3"},{"term":"clinical application","english":"Safety and delivery remain major barriers to clinical application.","chinese":"安全性和递送仍是临床应用的主要障碍。","audioStart":135.107,"audioEnd":139.262,"audioFile":"audio/part-5.mp3"},{"term":"disease progression","english":"Chronic inflammation accelerates disease progression in this model.","chinese":"在该模型中，慢性炎症会加速疾病进展。","audioStart":139.582,"audioEnd":143.725,"audioFile":"audio/part-5.mp3"},{"term":"immune response","english":"The immune response was stronger in tumors with high neoantigen burden.","chinese":"新生抗原负荷高的肿瘤中免疫反应更强。","audioStart":144.045,"audioEnd":148.275,"audioFile":"audio/part-5.mp3"},{"term":"molecular mechanism","english":"The study proposes a molecular mechanism linking metabolism to gene expression.","chinese":"该研究提出了一种连接代谢与基因表达的分子机制。","audioStart":148.582,"audioEnd":153.55,"audioFile":"audio/part-5.mp3"}];
    const list = document.querySelector('#list');
    const search = document.querySelector('#search');
    const voiceSelect = document.querySelector('#voice');
    const rate = document.querySelector('#rate');
    const rateValue = document.querySelector('#rateValue');
    const status = document.querySelector('#status');
    const visibleCount = document.querySelector('#visibleCount');
    const stopButton = document.querySelector('#stop');
    const neuralAudio = new Audio();
    neuralAudio.preload = 'metadata';
    let voices = [];
    let activeButton = null;
    let activeAudioEnd = null;
    let activeAudioFile = '';
    let playbackToken = 0;

    function loadVoices() {
      const all = speechSynthesis.getVoices();
      voices = all.filter(v => /^en[-_]/i.test(v.lang));
      if (!voices.length) voices = all;
      const previous = voiceSelect.value;
      voiceSelect.innerHTML = '';
      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = `${voice.name} · ${voice.lang}`;
        if (/Microsoft.*(Aria|Jenny|Guy|Sonia)/i.test(voice.name)) option.dataset.preferred = 'true';
        voiceSelect.append(option);
      });
      const preferred = [...voiceSelect.options].find(o => o.dataset.preferred === 'true');
      if (previous && voiceSelect.querySelector(`option[value="${previous}"]`)) voiceSelect.value = previous;
      else if (preferred) voiceSelect.value = preferred.value;
      if (!voices.length) voiceSelect.innerHTML = '<option>未检测到可用语音</option>';
    }

    function clearActive() {
      if (activeButton) activeButton.classList.remove('active');
      activeButton = null;
      status.classList.remove('speaking');
    }

    function stopPlayback(message = '已停止朗读。') {
      playbackToken += 1;
      speechSynthesis.cancel();
      neuralAudio.pause();
      activeAudioEnd = null;
      clearActive();
      status.textContent = message;
    }

    function playEntry(entry, button) {
      stopPlayback('');
      const token = playbackToken;
      activeButton = button;
      button.classList.add('active');
      status.classList.add('speaking');

      if (entry.audioFile && entry.audioStart !== null && entry.audioEnd !== null) {
        status.textContent = `正在播放自然语音：${entry.english}`;
        const startAudio = () => {
          if (token !== playbackToken) return;
          activeAudioEnd = entry.audioEnd;
          neuralAudio.currentTime = entry.audioStart;
          neuralAudio.play().catch(() => {
            if (token === playbackToken) {
              clearActive();
              status.textContent = '音频加载失败，请确保两个 MP3 与网页在同一文件夹。';
            }
          });
        };
        if (activeAudioFile !== entry.audioFile) {
          activeAudioFile = entry.audioFile;
          neuralAudio.src = entry.audioFile;
          neuralAudio.load();
        }
        if (neuralAudio.readyState >= 1) startAudio();
        else neuralAudio.addEventListener('loadedmetadata', startAudio, { once: true });
        return;
      }

      const utterance = new SpeechSynthesisUtterance(entry.english);
      const selectedVoice = voices[Number(voiceSelect.value)];
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.lang = selectedVoice?.lang || 'en-US';
      utterance.rate = Number(rate.value);
      status.textContent = `正在使用系统语音：${entry.english}`;
      utterance.onend = () => {
        if (token === playbackToken) { clearActive(); status.textContent = '朗读完成。'; }
      };
      utterance.onerror = event => {
        if (token === playbackToken) { clearActive(); status.textContent = `朗读失败：${event.error || '浏览器语音不可用'}`; }
      };
      speechSynthesis.speak(utterance);
    }

    neuralAudio.addEventListener('timeupdate', () => {
      if (activeAudioEnd !== null && neuralAudio.currentTime >= activeAudioEnd) {
        neuralAudio.pause();
        activeAudioEnd = null;
        clearActive();
        status.textContent = '朗读完成。';
      }
    });

    function render() {
      const query = search.value.trim().toLowerCase();
      const filtered = entries.map((entry, index) => ({ ...entry, index })).filter(item =>
        `${item.term} ${item.english} ${item.chinese}`.toLowerCase().includes(query)
      );
      list.replaceChildren();
      visibleCount.textContent = filtered.length;
      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '没有找到匹配的句子。';
        list.append(empty);
        return;
      }
      const fragment = document.createDocumentFragment();
      filtered.forEach(({ term, english, chinese, audioFile, audioStart, audioEnd, index }) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'sentence';
        button.setAttribute('aria-label', `朗读第 ${index + 1} 句：${english}`);
        button.innerHTML = `<span class="number">${String(index + 1).padStart(3, '0')}</span><span class="content"><span class="term-row"><span class="term"></span><span class="audio-tag"></span></span><span class="text"></span><span class="translation"></span></span><span class="play" aria-hidden="true">▶</span>`;
        button.querySelector('.term').textContent = term;
        button.querySelector('.text').textContent = english;
        const audioTag = button.querySelector('.audio-tag');
        audioTag.textContent = audioFile ? 'Neural MP3' : 'System voice';
        audioTag.classList.toggle('fallback', !audioFile);
        button.querySelector('.translation').textContent = chinese;
        button.addEventListener('click', () => playEntry({ english, audioFile, audioStart, audioEnd }, button));
        fragment.append(button);
      });
      list.append(fragment);
    }

    search.addEventListener('input', render);
    rate.addEventListener('input', () => { rateValue.textContent = `${Number(rate.value).toFixed(2)}×`; });
    stopButton.addEventListener('click', () => stopPlayback());
    speechSynthesis.addEventListener?.('voiceschanged', loadVoices);
    loadVoices();
    render();
  </script>
</body>
</html>
